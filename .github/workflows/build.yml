# Builds the mod on every push to main and every pull request, and keeps the jar as an artifact.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "*.md"]
  pull_request:
    paths-ignore: ["site/**", "*.md"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v5
        with:
          name: vanilla-sugar-${{ github.sha }}
          path: build/libs/*.jar
