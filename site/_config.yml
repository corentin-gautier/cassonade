# Website of the mod, published on GitHub Pages by .github/workflows/pages.yml.
# The site URL and the repository links come from the GitHub repository itself (jekyll-github-metadata),
# so nothing here needs to change when the repository is renamed or moved.

title: Vanilla Sugar
author: Corentin
lang: en
locale: en_US

social:
  name: Vanilla Sugar
# The icon is small and square: a large card would crop it
twitter:
  card: summary

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata

# Jekyll SEO Tag reads the image shown when a page is shared (Discord, Reddit, X…) from the page itself.
# A 1200×630 screenshot would make a larger preview than the icon.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/icon.png

exclude:
  - assets/screenshots/README.md
