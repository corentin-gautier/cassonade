{%- assign t = site.data[page.lang] -%}
	<footer class="footer">
		<div class="wrap footer-inner">
			<nav aria-label="Project">
				<a href="{{ site.github.repository_url }}" rel="noopener" target="_blank">{{ t.footer.source }}</a>
				<a href="{{ site.github.issues_url }}" rel="noopener" target="_blank">{{ t.footer.issues }}</a>
				<a href="{{ site.github.releases_url }}" rel="noopener" target="_blank">{{ t.footer.releases }}</a>
				<a href="{{ site.data.mod.kofi }}" rel="noopener" target="_blank">{{ t.support.button }}</a>
				<a href="https://corentin-gautier.github.io/" rel="me noopener" target="_blank">{{ t.footer.portfolio }}</a>
			</nav>
			<p>{{ t.footer.license }} {{ t.footer.disclaimer }}</p>
		</div>
	</footer>
