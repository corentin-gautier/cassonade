hero:
  eyebrow: "Cassonade · Fabric mod for Minecraft 26.3"
  shot_alt: "A plains village in Minecraft with the Cassonade HUD: compass minimap, clock, current quest and a waypoint in the world"
  title: "Minecraft, minus the friction."
  lead: "Cassonade is a vanilla+ quality-of-life mod that fixes the hundred small annoyances of survival Minecraft and leaves everything else alone. No new ores, no magic, no machines: the same game you know, just smoother."
  download: "Download .jar"
  download_alt: "Download .jar"
  features: "See what changes"
  note: "Free and open source · Singleplayer and servers"
  github: "Jar on GitHub"

why:
  heading: "Still Minecraft. Just without the papercuts."
  intro: "Most quality-of-life modpacks pile on dozens of mods, each with its own style and its own options, or turn the game into something else. Cassonade is one mod, built around a single rule: if Mojang could ship it in an update tomorrow, it belongs here. If it changes how you play, it does not."
  items:
    - title: "Same progression"
      text: "No new resources, tiers or dimensions. Every new feature is unlocked by equipping an item you already know (a compass, a clock) or one crafted from vanilla items (a backpack, a world map, a barometer)."
    - title: "Every small annoyance, fixed"
      text: "Leaves that take minutes to decay, “Too Expensive!”, boats stuck on a pixel, the enchanting table's “…?”: each fix is small, together they change how the game feels."
    - title: "Feels like it was always there"
      text: "The interface keeps Minecraft's pixel style and sounds. Features only show up once you equip their item, and every key can be remapped."
    - title: "One style, no settings maze"
      text: "A modpack stitched from a dozen mods brings a dozen visual styles and options scattered across as many config screens. Cassonade looks the same everywhere and has nothing to configure on purpose: each feature works one way, as close to vanilla as it gets, and that's it."

compare:
