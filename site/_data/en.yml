hero:
  eyebrow: "Vanilla Sugar · Fabric mod for Minecraft 26.3"
  shot_alt: "A plains village in Minecraft with the Vanilla Sugar HUD: compass minimap, clock, current quest and a waypoint in the world"
  title: "Minecraft, minus the friction."
  lead: "Vanilla Sugar is a vanilla+ quality-of-life mod that fixes the hundred small annoyances of survival Minecraft and leaves everything else alone. No new ores, no magic, no machines: the same game you know, just smoother."
  download: "Download for Fabric"
  features: "See what changes"
  note: "Free and open source · Singleplayer and servers"
  github: "Jar on GitHub"

why:
  heading: "Still Minecraft. Just without the papercuts."
  intro: "Most quality-of-life modpacks pile on dozens of mods with clashing styles, or turn the game into something else. Vanilla Sugar is one mod, built around a single rule: if Mojang could ship it in an update tomorrow, it belongs here. If it changes how you play, it does not."
  items:
    - title: "Same progression"
      text: "No new resources, tiers or dimensions. Every new feature is unlocked by equipping an item you already know (a compass, a clock) or one crafted from vanilla items (a backpack, a world map)."
    - title: "Every small annoyance, fixed"
      text: "Leaves that take minutes to decay, “Too Expensive!”, boats stuck on a pixel, the enchanting table's “…?”: each fix is small, together they change how the game feels."
    - title: "Feels like it was always there"
      text: "The interface keeps Minecraft's pixel style and sounds. Features only show up once you equip their item, and every key can be remapped."

compare:
  heading: "What Vanilla Sugar fixes"
  intro: "Each moment as you know it in vanilla, and the same moment with Vanilla Sugar."
  vanilla: "Vanilla"
  mod: "With Vanilla Sugar"
  rows:
    - topic: "Cutting down a tree"
      vanilla: "Leaves decay one by one for minutes"
      mod: "Leaves fall right away, drops included"
    - topic: "Repairing at the anvil"
      vanilla: "“Too Expensive!”"
      mod: "Any repair you can pay for"
    - topic: "Enchanting table"
      vanilla: "One enchantment, then “…?”"
      mod: "Every enchantment the option will give"
    - topic: "Mending and Infinity"
      vanilla: "Incompatible on a bow"
      mod: "Work together"
    - topic: "Running out of blocks"
      vanilla: "Open the inventory, find more"
      mod: "The hand refills from the inventory"
    - topic: "Messy chests"
      vanilla: "Sort by hand"
      mod: "One click to sort, one click to stash"
    - topic: "Harvesting crops"
      vanilla: "Break, collect, replant"
      mod: "Right-click: harvested and replanted"
    - topic: "Flying with armor"
      vanilla: "Elytra or chestplate"
      mod: "Both, in their own slots"
    - topic: "Sorting items with hoppers"
      vanilla: "Redstone item sorter"
      mod: "A filter slot in every hopper"
    - topic: "Boats on land"
      vanilla: "Stuck on a 1-pixel step"
      mod: "Glide over paths, farmland, carpets, snow"
    - topic: "Double doors"
      vanilla: "Open each door separately"
      mod: "Both open together"
    - topic: "Composter"
      vanilla: "1 bone meal, after a delay"
      mod: "8 bone meal, right away"
    - topic: "Daytime"
      vanilla: "10 minutes, then night falls"
      mod: "20 minutes, the night is unchanged"
    - topic: "Going to bed"
      vanilla: "5 seconds to skip the night"
      mod: "2.5 seconds"
    - topic: "Death screen"
      vanilla: "Buttons locked for a second"
      mod: "Respawn immediately"
    - topic: "Nether portal"
