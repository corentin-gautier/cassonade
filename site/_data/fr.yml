hero:
  eyebrow: "Mod Fabric · Minecraft 26.3"
  title: "Minecraft, sans les frictions."
  lead: "Vanilla Sugar corrige les cent petits agacements de Minecraft en survie, et ne touche à rien d'autre. Pas de nouveaux minerais, pas de magie, pas de machines : le jeu que vous connaissez, en plus fluide."
  download: "Télécharger pour Fabric"
  features: "Voir ce qui change"
  note: "Gratuit et open source · Solo et serveurs"

why:
  heading: "Toujours Minecraft. Les petits tracas en moins."
  intro: "La plupart des modpacks « confort » empilent des dizaines de mods aux styles disparates, ou transforment le jeu en autre chose. Vanilla Sugar est un seul mod, construit sur une seule règle : si Mojang pouvait le sortir dans une mise à jour demain, il a sa place ici. S'il change la façon de jouer, non."
  items:
    - title: "La même progression"
      text: "Pas de nouvelles ressources, de nouveaux paliers ni de nouvelles dimensions. Chaque fonction se débloque en équipant un objet que vous connaissez déjà (un compas, une montre) ou fabriqué à partir d'objets vanilla (un sac à dos, une carte du monde)."
    - title: "Chaque petit agacement, corrigé"
      text: "Les feuilles qui mettent des minutes à disparaître, « Trop cher ! », les bateaux bloqués par un pixel, le « … ? » de la table d'enchantement : chaque correction est petite, ensemble elles changent la sensation de jeu."
    - title: "Comme si ça avait toujours été là"
      text: "L'interface garde le style pixel et les sons de Minecraft. Chaque fonction n'apparaît qu'une fois son objet équipé, et toutes les touches se changent."

