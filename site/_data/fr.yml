  github: "Jar sur GitHub"

why:
  heading: "Toujours Minecraft. Les petits tracas en moins."
  intro: "La plupart des modpacks « confort » empilent des dizaines de mods, chacun avec son style et ses options, ou transforment le jeu en autre chose. Cassonade est un seul mod, construit sur une seule règle : si Mojang pouvait le sortir dans une mise à jour demain, il a sa place ici. S'il change la façon de jouer, non."
  items:
    - title: "La même progression"
      text: "Pas de nouvelles ressources, de nouveaux paliers ni de nouvelles dimensions. Chaque fonction se débloque en équipant un objet que vous connaissez déjà (un compas, une montre) ou fabriqué à partir d'objets vanilla (un sac à dos, une carte du monde, un baromètre)."
    - title: "Chaque petit agacement, corrigé"
      text: "Les feuilles qui mettent des minutes à disparaître, « Trop cher ! », les bateaux bloqués par un pixel, le « … ? » de la table d'enchantement : chaque correction est petite, ensemble elles changent la sensation de jeu."
    - title: "Comme si ça avait toujours été là"
      text: "L'interface garde le style pixel et les sons de Minecraft. Chaque fonction n'apparaît qu'une fois son objet équipé, et toutes les touches se changent."
    - title: "Un seul style, pas de jungle d'options"
      text: "Un modpack assemblé à partir d'une dizaine de mods, c'est une dizaine de styles et des options éparpillées dans autant d'écrans de configuration. Cassonade a le même style partout et, volontairement, rien à configurer : chaque fonction marche d'une seule façon, au plus près du vanilla, et c'est tout."

