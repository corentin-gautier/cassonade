  note: "Les escaliers et les dalles se refont aussi en blocs, sans perte."

never:
  heading: "Ce que Vanilla Sugar n'ajoutera jamais"
  items:
    - "De nouveaux minerais, métaux ou paliers d'équipement"
    - "De la magie, des machines ou des arbres technologiques"
    - "De nouveaux monstres, biomes ou dimensions"
    - "Quoi que ce soit qui rende le jeu plus facile à finir plutôt que plus agréable à jouer"

install:
  heading: "Installer"
  steps:
    - "Installez le <a href=\"https://fabricmc.net/use/\">Fabric Loader</a> pour Minecraft 26.3."
    - "Téléchargez <a href=\"https://modrinth.com/mod/fabric-api\">Fabric API</a> et Vanilla Sugar."
    - "Placez les deux fichiers <code>.jar</code> dans le dossier <code>mods</code> de Minecraft."
    - "Lancez le jeu avec le profil Fabric."
  requires: "Nécessite"
  multiplayer: "Sur un serveur, installez le mod sur le serveur et chez chaque joueur. En solo, il n'y a rien d'autre à faire."

faq:
  heading: "Questions"
  items:
    - q: "Vanilla Sugar change-t-il la progression de Minecraft ?"
      a: "Non. Pas de nouvelles ressources, de nouveaux paliers ni de nouvelles dimensions, et chaque fonction se débloque en équipant un objet vanilla ou fabriqué à partir d'objets vanilla. On mine, construit, explore et combat toujours de la même façon."
    - q: "Fonctionne-t-il en multijoueur ?"
      a: "Oui. Installez-le sur le serveur et chez chaque joueur. Sur un serveur sans le mod, certaines fonctions ont moins à montrer : pas de prévision météo, pas de liste des monstres qui vous chassent, et les informations d'enchantement et de progrès du vanilla."
    - q: "Quelles versions sont prises en charge ?"
      a: "Minecraft 26.3 avec Fabric Loader 0.20.1 ou plus récent, Fabric API et Java 25. Forge et NeoForge ne sont pas pris en charge."
    - q: "Peut-on désactiver des fonctions ?"
      a: "Une fonction dont l'objet n'est pas équipé reste cachée : sans compas, pas de mini-map. Les touches se changent dans Options → Commandes → Vanilla Sugar, et les choix d'affichage (rotation de la carte, marqueurs, suivi de quête) sont retenus."
    - q: "Peut-on l'utiliser dans un modpack ?"
      a: "Oui. Vanilla Sugar est publié sous CC0 : utilisez-le, distribuez-le et modifiez-le comme vous le souhaitez."

