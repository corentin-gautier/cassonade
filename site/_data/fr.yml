      vanilla: "Les feuilles disparaissent une à une pendant des minutes"
      mod: "Les feuilles tombent aussitôt, avec leur butin"
    - topic: "Réparer à l'enclume"
      vanilla: "« Trop cher ! »"
      mod: "Toute réparation que vous pouvez payer"
    - topic: "Table d'enchantement"
      vanilla: "Un enchantement, puis « … ? »"
      mod: "Tous les enchantements de l'option"
    - topic: "Raccommodage et Infinité"
      vanilla: "Incompatibles sur un arc"
      mod: "Compatibles"
    - topic: "Plus de blocs en main"
      vanilla: "Ouvrir l'inventaire, en chercher"
      mod: "La main se remplit depuis l'inventaire"
    - topic: "Coffres en désordre"
      vanilla: "Trier à la main"
      mod: "Un clic pour trier, un clic pour ranger"
    - topic: "Récolter les cultures"
      vanilla: "Casser, ramasser, replanter"
      mod: "Clic droit : récolté et replanté"
    - topic: "Voler en armure"
      vanilla: "Élytre ou plastron"
      mod: "Les deux, chacun dans son slot"
    - topic: "Trier avec des entonnoirs"
