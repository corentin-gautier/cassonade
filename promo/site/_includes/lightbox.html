{%- comment -%}
The carousels and the full-size screenshots, on every page that shows screenshots.
{%- endcomment -%}
{%- assign t = site.data[page.lang] -%}
	<dialog class="lightbox" aria-label="{{ t.lightbox.label }}">
		<img alt="">
		<button class="lightbox-close" type="button" aria-label="{{ t.lightbox.close }}">×</button>
		<button class="lightbox-arrow lightbox-prev" type="button" aria-label="{{ t.lightbox.previous }}"></button>
		<button class="lightbox-arrow lightbox-next" type="button" aria-label="{{ t.lightbox.next }}"></button>
	</dialog>
	<script>
		// A feature with several screenshots shows them one at a time: arrows, dots or a swipe go from one to the next
		document.querySelectorAll(".carousel").forEach(carousel => {
			const track = carousel.querySelector(".carousel-track");
			const dots = [...carousel.querySelectorAll(".carousel-dots button")];
			const current = () => Math.round(track.scrollLeft / track.clientWidth);
			const go = index => track.scrollTo({left: ((index + dots.length) % dots.length) * track.clientWidth});
			carousel.querySelector(".carousel-prev").addEventListener("click", () => go(current() - 1));
			carousel.querySelector(".carousel-next").addEventListener("click", () => go(current() + 1));
			dots.forEach((dot, index) => dot.addEventListener("click", () => go(index)));
			track.addEventListener("scroll", () => dots.forEach((dot, index) => dot.toggleAttribute("aria-current", index === current())));
		});

		// Ambience loops: a short silent video over its screenshot, fetched only once it plays. In the home's panorama, the
		// open band's alone (the one pointed at, or the last one, kept open by home.html) (each band on screen, once they are stacked on a narrow screen); elsewhere, while it is on screen.
		// With reduced motion, the screenshot stays.
		(() => {
			const videos = [...document.querySelectorAll(".shot-video")];
			if (!videos.length || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
			const play = video => video.play().then(() => video.classList.add("playing"), () => {});
			const stop = video => {
				video.pause();
				video.classList.remove("playing");
			};
			const wide = matchMedia("(min-width: 961px)");
			const seen = new Set();
			const panoramas = [...document.querySelectorAll(".panorama")];
			const update = panorama => {
				const strips = [...panorama.querySelectorAll(".strip")];
				const open = panorama.querySelector(".strip:is(:hover, :focus-within)") ?? (panorama.matches(":hover, :focus-within") ? null : panorama.querySelector(".strip.active"));
				strips.forEach(strip => {
					const video = strip.querySelector(".shot-video");
					if (video) (wide.matches ? seen.has(panorama) && strip === open : seen.has(video)) ? play(video) : stop(video);
				});
			};
			const observer = new IntersectionObserver(entries => entries.forEach(({ target, isIntersecting }) => {
				if (isIntersecting) seen.add(target); else seen.delete(target);
				const panorama = target.closest(".panorama");
				if (panorama) update(panorama);
				else if (isIntersecting) play(target);
				else stop(target);
			}), { threshold: .5 });
			videos.forEach(video => observer.observe(video));
			panoramas.forEach(panorama => {
				observer.observe(panorama);
				// After the event, once :hover and :focus-within have moved
				["pointerover", "pointerleave", "focusin", "focusout"].forEach(type => panorama.addEventListener(type, () => setTimeout(() => update(panorama))));
			});
			wide.addEventListener("change", () => panoramas.forEach(update));
		})();

		// The screenshots open full size in the lightbox: a click or Escape closes it, the arrows go from one to the next
		(() => {
			const dialog = document.querySelector(".lightbox");
			const image = dialog.querySelector("img");
			const links = [...document.querySelectorAll("[data-lightbox]")];
			let current = 0;
			const show = index => {
				current = (index + links.length) % links.length;
				image.src = links[current].href;
				image.alt = links[current].querySelector("img").alt;
			};
			links.forEach((link, index) => link.addEventListener("click", event => {
				event.preventDefault();
				show(index);
				dialog.showModal();
			}));
			dialog.querySelector(".lightbox-prev").addEventListener("click", event => {
				event.stopPropagation();
				show(current - 1);
			});
			dialog.querySelector(".lightbox-next").addEventListener("click", event => {
				event.stopPropagation();
				show(current + 1);
			});
			dialog.addEventListener("click", () => dialog.close());
			dialog.addEventListener("keydown", event => {
				if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
					event.preventDefault();
					show(current + (event.key === "ArrowRight" ? 1 : -1));
				}
			});
			dialog.addEventListener("close", () => links[current].focus());
		})();
	</script>
