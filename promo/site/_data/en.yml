hero:
  eyebrow: "Cassonade · Fabric mod for Minecraft 26.3"
  shot_alt: "Green and violet auroras over a snowy plain at night, with the Milky Way and a crescent moon"
  title: "Less friction, more life."
  lead: "A vanilla+ quality-of-life mod that fixes the hundred small annoyances of survival and makes the world feel alive, with birds, waves and starry nights, and towns and treasures worth the trip. No new ores, no magic, no machines: it's the same game you know, just smoother and a lot less empty."
  download: "Download .jar"
  download_alt: "Download .jar"
  features: "See what changes"
  video: "Watch the video"
  day: "Day"
  note: "Free and open source · Singleplayer and servers"
  github: "Jar on GitHub"

why:
  heading: "Still Minecraft. Just a lot less annoying."
  intro: "I made this mod because even though I love Minecraft, I'm usually frustrated by it: the worlds feel empty, exploration is not really rewarded, some mechanics are really annoying and I clearly don't want to get a PhD to master redstone. I'm not a fan of modpacks either: way too many settings everywhere, each mod with its own style, and some just don't “feel” like Minecraft to me. So I made the one I wanted to play."
  items:
    - title: "Same progression"
      text: "I didn't add any new resources, tiers or dimensions. Every new tool is unlocked by equipping an item you already know (a compass, a clock) or one crafted from vanilla items (a backpack, a world map, a barometer)."
    - title: "Every small annoyance, fixed"
      text: "Leaves that take forever to decay, “Too Expensive!”, boats stuck on a pixel, the enchanting table's “…?”: each fix is small, but together they really change how the game feels."
    - title: "Feels like it was always there"
      text: "The interface keeps Minecraft's pixel style and sounds, tools only show up once you equip their item, and you can remap every key."
    - title: "A world that feels alive"
      text: "Flocks cross the sky, waves break on the shore, crickets sing through warm nights. Nothing to fight, collect or craft, just what makes a place feel inhabited."
    - title: "A world worth exploring"
      text: "Towns, taverns, furnished mansions, temples with real treasures, a pirate's booty hidden in a lush cave: going out there finally pays off. And less friction doesn't mean less challenge: the sea is murky and dark now, so a dive is a real trip you get ready for."
    - title: "One style, no settings maze"
      text: "That's exactly my problem with modpacks: a dozen mods means a dozen visual styles and as many config screens. Cassonade looks the same everywhere and there's nothing to configure, on purpose: each feature works one way, as close to vanilla as possible."

compare:
  heading: "What Cassonade fixes"
  intro: "Each moment as you know it in vanilla, and the same moment with Cassonade."
  vanilla: "Vanilla"
  mod: "With Cassonade"
  groups:
    - title: "Storage and items"
      rows:
        - topic: "Running out of blocks"
          vanilla: "Open the inventory, find more"
          mod: "The hand refills from the inventory"
        - topic: "Messy chests"
          vanilla: "Sort by hand"
          mod: "One click to sort, one click to stash"
        - topic: "Sorting items with hoppers"
          vanilla: "Redstone item sorter"
          mod: "A filter slot in every hopper"
        - topic: "A sign on a chest"
          vanilla: "Clicking it edits the sign"
          mod: "Clicking it opens the chest"
        - topic: "An item frame on a chest"
          vanilla: "Clicking it turns the item"
          mod: "Clicking it opens the chest"
        - topic: "Named chests"
          vanilla: "The name only shows once opened"
          mod: "Look at one: its name shows"
        - topic: "Ender chests"
          vanilla: "Silk Touch, or 8 obsidian"
          mod: "Drop themselves with any pickaxe"
    - title: "Crafting and workstations"
      rows:
        - topic: "Repairing at the anvil"
          vanilla: "“Too Expensive!”"
          mod: "Any repair you can pay for"
        - topic: "Renaming at the anvil"
          vanilla: "Costs levels, even when that is all you do"
          mod: "Free when renaming alone"
        - topic: "Enchanting table"
          vanilla: "One enchantment, then “…?”"
          mod: "Every enchantment the option will give"
        - topic: "Mending and Infinity"
          vanilla: "Incompatible on a bow"
          mod: "Work together"
        - topic: "Enchantment levels"
          vanilla: "Some top out at II or IV"
          mod: "Every one tops out at I, III or V"
        - topic: "Furnaces"
          vanilla: "Watch the arrow fill"
          mod: "One small line: time left, how much more the fuel will cook, and the experience it holds"
        - topic: "Grindstone"
          vanilla: "The experience it gives back is a surprise"
          mod: "Shown before you take the item"
        - topic: "Cutting planks"
          vanilla: "Only the crafting table, a few pieces at a time"
          mod: "A woodcutter, iron ingot over three planks: stairs, slabs, fences and more, in a wood-toned stonecutter window"
        - topic: "Crafting 64 buttons"
          vanilla: "64 blocks"
          mod: "4 blocks (recipes give fair amounts)"
        - topic: "Nether wart blocks and packed ice"
          vanilla: "No way back"
          mod: "Crafted back into 9 nether wart, or 9 ice"
        - topic: "Dyed wool, carpets, beds, terracotta and glass"
          vanilla: "Stay dyed for good"
          mod: "Washed in a water cauldron, a whole stack for one level of water"
        - topic: "Concrete powder"
          vanilla: "Place it by water, block by block"
          mod: "Hardened in a water cauldron, a whole stack for one level of water"
        - topic: "Filled maps"
          vanilla: "Stay drawn for good"
          mod: "Wiped blank in a water cauldron, for one level of water"
    - title: "Nature and time"
      rows:
        - topic: "Cutting down a tree"
          vanilla: "Leaves decay one by one for minutes"
          mod: "Leaves fall right away, drops included"
        - topic: "Walking under trees"
          vanilla: "Leaves at head height"
          mod: "Taller trunks, two blocks of air under the canopy"
        - topic: "Harvesting crops"
          vanilla: "Break, collect, replant"
          mod: "Right-click: harvested and replanted"
        - topic: "Composter"
          vanilla: "1 bone meal, after a delay"
          mod: "8 bone meal, right away"
        - topic: "Farmland"
          vanilla: "Turns back to dirt when you jump on it"
          mod: "Players never trample it, on foot or riding"
        - topic: "Paintings"
          vanilla: "A random one, the largest that fits"
          mod: "Sneak and scroll: go through all that fit"
        - topic: "Snow"
          vanilla: "Break it, all layers at once"
          mod: "Right-click with a shovel: one layer comes off, for one snowball"
        - topic: "Daytime"
          vanilla: "10 minutes, then night falls"
          mod: "20 minutes, the night is unchanged"
        - topic: "Nights"
          vanilla: "Just as dark, monsters every night"
          mod: "Lighter under a full moon, which keeps monsters off the surface"
        - topic: "Going to bed"
          vanilla: "5 seconds to skip the night"
          mod: "2.5 seconds"
        - topic: "Sweet berry bushes"
          vanilla: "Thorns hurt through any armor"
          mod: "Leggings and boots stop them"
        - topic: "Your bed"
          vanilla: "Villagers claim it and sleep in it"
          mod: "They leave the one you respawn in alone"
        - topic: "Iron golems and fire"
          vanilla: "They walk through it and burn"
          mod: "They go around it"
        - topic: "Your dogs, cats and fire"
          vanilla: "They follow you through it and burn"
          mod: "They go around it"
        - topic: "Bees and the sea"
          vanilla: "They wander off over the ocean, for good"
          mod: "They turn back at the shore"
        - topic: "The far sea"
          vanilla: "Sun and kelp show through the distant water"
          mod: "A clean horizon, and murky, dim depths"
        - topic: "Moving villagers"
          vanilla: "Boats, rails, trapping"
          mod: "Put them on a lead"
        - topic: "Wandering traders"
          vanilla: "Their departure time is hidden"
          mod: "Their trade screen shows how long they have left"
    - title: "Building and decorating"
      rows:
        - topic: "Double doors"
          vanilla: "Open each door separately"
          mod: "Both open together"
        - topic: "Doors, trapdoors and gates"
          vanilla: "Snap open and shut"
          mod: "Swing on their hinges"
        - topic: "Ladders"
          vanilla: "Placed one by one, from the bottom"
          mod: "Click a ladder: it grows up, or down when looking down"
        - topic: "Item frames"
          vanilla: "Always show their frame"
          mod: "Shears hide the frame, the item stays on the wall"
        - topic: "Armor stands"
          vanilla: "One piece at a time"
          mod: "Alt-click: your whole armor swaps with the stand's; sneak-click: the next pose"
        - topic: "Armor stand arms"
          vanilla: "Only with commands"
          mod: "Placed with arms; shears take them off, two sticks put them back"
    - title: "Reading the world"
      rows:
        - topic: "Books in a chiseled bookshelf"
          vanilla: "Take a book out to read its title"
          mod: "Look at its slot to see its title, with its enchantments or author"
        - topic: "Books on a lectern"
          vanilla: "Open it to know which book it is"
          mod: "Look at the lectern to see its title and author"
        - topic: "Note blocks"
          vanilla: "Count the clicks to know the note"
          mod: "Look at one: its note shows"
        - topic: "Jukebox"
          vanilla: "Its song only shows when it starts"
          mod: "Look at one: its song shows"
        - topic: "Redstone"
          vanilla: "Guess a wire's power from its glow"
          mod: "Redstone in hand: a wire's power, whether a block is powered"
        - topic: "Waxed copper"
          vanilla: "Looks the same as unwaxed"
          mod: "Honeycomb or axe in hand: waxed or not"
    - title: "Adventure and combat"
      rows:
        - topic: "Villages"
          vanilla: "All about the same size"
          mod: "Now and then, a town: three times the houses, closer together, around a market square"
        - topic: "Village streets"
          vanilla: "Torches on fences"
          mod: "Lanterns on posts in the village's wood or stone"
        - topic: "Village houses"
          vanilla: "Cobblestone foundations, walls and wells"
          mod: "Mostly stone bricks, some mossy or cracked"
        - topic: "Village churches"
          vanilla: "A church and its tower, a brewing stand for the cleric"
          mod: "A tavern behind its tower, or a small inn under an awning: bar and kegs, tables, a fireplace, and the tavern keeper at the brewing stand"
        - topic: "Woodland mansions"
          vanilla: "Cobblestone walls, sparse rooms, torches, modest chests"
          mod: "Stone brick walls, furnished rooms, lanterns, barrels and richer loot"
        - topic: "Lush caves"
          vanilla: "Moss, azaleas and glow berries"
          mod: "Very rarely, a pirate's booty: a pile of barrels full of gold and gems"
        - topic: "Jungle temples"
          vanilla: "Bones, rotten flesh and a little gold"
          mod: "Two treasures more per chest: emeralds, diamonds, enchanted books, gold"
        - topic: "Fast travel"
          vanilla: "Commands, or Nether tunnels"
          mod: "Waystones, once you reach the End: one click to another, in any dimension"
        - topic: "Flying with armor"
          vanilla: "Elytra or chestplate"
          mod: "Both, in their own slots"
        - topic: "Boats on land"
          vanilla: "Stuck on a 1-pixel step"
          mod: "Glide over paths, farmland, carpets, snow"
        - topic: "Nether portal"
          vanilla: "4 seconds of warping and noise"
          mod: "Step in, you're through"
        - topic: "Building a Nether portal"
          vanilla: "Obsidian only"
          mod: "Crying obsidian works too"
        - topic: "Burning"
          vanilla: "Flames rise past the crosshair"
          mod: "Flames stay low on the screen"
        - topic: "Raising a shield"
          vanilla: "It hides the middle of the screen"
          mod: "It stays lower, out of the way"
        - topic: "Cobwebs"
          vanilla: "Slow to break, nothing without a sword or shears"
          mod: "Break at once by hand, and give their string"
        - topic: "Poison"
          vanilla: "One potion takes you down to half a heart"
          mod: "Half as long, half as often"
        - topic: "Netherite sword"
          vanilla: "Three hits for most monsters"
          mod: "Two hits"
        - topic: "Netherite pickaxe on deepslate"
          vanilla: "Slower than on stone"
          mod: "As fast as on stone, at once with Efficiency V and Haste II"
        - topic: "Death screen"
          vanilla: "Buttons locked for a second"
          mod: "Respawn immediately"
        - topic: "Getting hit"
          vanilla: "The screen flashes red"
          mod: "A red arc points where the hit came from"
        - topic: "A mob in tall grass"
          vanilla: "The hit cuts the grass"
          mod: "The hit goes through to the mob"
        - topic: "Baby zombies"
          vanilla: "Hard to hit"
          mod: "A little easier to aim at"
        - topic: "Blazes"
          vanilla: "They shoot from 48 blocks, lost in the fog"
          mod: "They spot you from 24 blocks, so you see them coming"
        - topic: "Sweeping a sword"
          vanilla: "Also hits your own wolf or horse"
          mod: "Spares the animals you tamed"
        - topic: "Torch in hand"
          vanilla: "Lights nothing until placed"
          mod: "Lights up around you"
        - topic: "Colored lights"
          vanilla: "Every light gives the same warm glow"
          mod: "Soul fire lights blue, redstone red, copper green, amethyst purple"
    - title: "Writing and menus"
      rows:
        - topic: "Editing a book"
          vanilla: "Pages only added at the end, Esc loses what was written"
          mod: "Insert or delete a page anywhere, and Esc saves"
        - topic: "Editing a sign"
          vanilla: "No mouse, copy line by line"
          mod: "The mouse places the cursor and selects; copy and paste take the whole sign"
        - topic: "Your name in the chat"
          vanilla: "Easy to miss"
          mod: "A soft bell, and your name in gold"
        - topic: "Going back in menus"
          vanilla: "Only Esc"
          mod: "Mouse button 4 too, unless bound to something else"

features:
  heading: "Features"
  intro: "Everything I added, one by one."
  groups:
    - title: "Carry and sort"
      ids: [backpack, inventory, hopper]
    - title: "Explore and find your way"
      ids: [minimap, worldmap, clock, waystone, spyglass, elytra, sea, villages]
    - title: "Play your way"
      ids: [quests, combat, torch, harvest, woodcutter]
    - title: "Everyday polish"
      ids: [tweaks, interface, graphics]
  items:
    - id: backpack
      title: "Backpack"
      shot_alt: "Minecraft inventory with the Cassonade backpack open beside it, a leather panel full of items, next to the extra equipment slots"
      lead: "54 more slots, crafted from leather, string and a bundle."
      points:
        - "Worn in its own equipment slot and opened from a tab at the top of the inventory, in a leather panel where the recipe book usually sits."
        - "Holds 54 stacks, as much as a large chest. Like a shulker box, it keeps its contents when placed in a chest or dropped."
        - "Shift-click sends items straight into the open backpack."
      item:
        icon: backpack_upgrade_smithing_template
        name: "Backpack Upgrade"
        recipe: "Template + Backpack + Hopper, at a smithing table"
        text: "A rare template, found in ancient city, bastion treasure and end city chests, and in woodland mansion barrels. The organized backpack it makes refills your hand, lends its items to the recipe book and completes its own stacks with what you pick up."
      keys: "B opens and closes it"
      detail:
        heading: "A backpack for Minecraft survival, crafted from vanilla items"
        intro: "Cassonade adds a backpack to Minecraft: 54 more slots, as much as a large chest, worn in its own equipment slot and crafted from leather, string and a bundle. No new resources, no new tier, just room for what you carry."
        points:
          - "Craft it from 4 leather, 4 string and a bundle, then wear it in its own equipment slot: Shift-click it in the inventory."
          - "Open it with B or from the tab at the top of the inventory. It opens in a leather panel where the recipe book usually sits; opening one closes the other."
          - "54 slots, as much as a large chest."
          - "While it is open, Shift-click sends items straight into it. Armor and shields still go to their own slots first."
          - "Like a Shulker box, it keeps its contents when placed in a chest or dropped. Neither a backpack nor a Shulker box can go inside a backpack."
          - "On death, it drops like the rest of your inventory, unless keepInventory is on."
          - "A rare smithing template, from ancient city, bastion treasure and end city chests and woodland mansion barrels, upgrades it at a smithing table with a hopper: the organized backpack refills your hand, lends its items to the recipe book, and completes its own stacks with what you pick up."
        recipe:
          pattern: ["SLS", "SBS", "LLL"]
          key:
            S: { icon: string, name: "String" }
            L: { icon: leather, name: "Leather" }
            B: { icon: bundle, name: "Bundle" }
          result: { icon: backpack, name: "Backpack" }
          text: "4 leather, 4 string and a bundle, in a crafting table. The recipe shows in the recipe book."
        faq:
          - q: "How do I craft the backpack?"
            a: "Put a bundle in the middle of a crafting table, string on both sides of it and in the two top corners, and leather in the top middle and along the whole bottom row: 4 leather, 4 string and a bundle in all."
          - q: "How do I open the backpack?"
            a: "Wear it in its equipment slot (Shift-click it in the inventory), then press B or click the backpack tab at the top of the inventory. The key can be changed in Options → Controls → Key Binds → Cassonade."
          - q: "Do I lose my backpack when I die?"
            a: "It drops where you died with everything inside, like the rest of your inventory. With keepInventory on, you keep it."
          - q: "Does the backpack work in multiplayer?"
            a: "Yes, when the server has Cassonade too. A server without the mod has nowhere to keep the extra slots, so the backpack is not offered there."
    - id: ambience
      title: "A living world"
      shot_alt: "A flock of geese flying in a V across a clear blue sky, seen from the ground"
      lead: "Minecraft's world is beautiful, but it feels empty. Now something is always going on."
      points:
        - "Flocks cross the sky by day: geese in a V or a loose group, black crows, white gulls near the coast, the geese and gulls calling as they pass. Very rarely, at the end of the day, a great cloud of starlings."
        - "Robins and cuckoos sing among the trees, owls call through the forest at night, frogs fill the swamps from dusk on, and a lone wolf howls far off on full moon nights."
        - "Butterflies flit around flowers, pollen drifts over the grass, dust falls from cave ceilings."
        - "A faint Milky Way turns overhead, shooting stars cross it, auroras light up snowy nights, some mornings start in mist, and the rain brings blizzards and sandstorms."
      more_shots:
        - id: ambience-night
          alt: "The Milky Way, a faint band high in the night sky, above an open plain with flowers in the grass"
        - id: ambience-mist
          alt: "A birch forest at dawn, the far trees fading into a light mist"
        - id: ambience-butterfly
          alt: "A plain at midday, full of flowers, with pollen drifting in the air and a butterfly among them"
      detail:
        heading: "A living world: birds, butterflies, auroras and morning mist in Minecraft"
        intro: "This is my answer to the empty worlds. Nothing to fight, collect or craft, just what makes a place feel inhabited. It's always there, there's nothing to equip, and none of it changes the game."
        sections:
          - title: "In the sky"
            points:
              - "<strong>Flocks</strong> cross the sky by clear day, several at once and at very different heights: a V or a loose group of geese, a few black crows, and white gulls among them as you near the coast. They fly on their way without following you."
              - "<strong>Starlings</strong>: very rarely, in the last hour of a clear day, a cloud of hundreds folds and swells in the sky for about a minute, then goes on."
              - "<strong>Milky Way</strong>: a faint band across the night, placed and shaped like the real one, with its bright heart and dark rift. It turns with the stars."
              - "<strong>Auroras</strong> hang to the north, green and violet, every other clear night over snowy land."
              - "<strong>Shooting stars</strong> cross the sky now and then on a clear night."
              - "<strong>Heat lightning</strong> flickers silently, low on the horizon, on some warm evenings."
          - title: "In the air"
            points:
              - "<strong>Butterflies</strong> flit around flowers near you by clear day."
              - "<strong>Pollen</strong> drifts around grass and trees by day, mixed with dry dust in savannas."
              - "<strong>Mushroom fields</strong>: plants found nowhere else grow on the mycelium, spore sprouts with cyan tips and glowcaps, red like the fields' mushrooms, lighting the dark in their color; spores rise from the ground, day and night, glowing faintly in the dark, and here and there mushrooms grow in fairy rings."
              - "<strong>Dust</strong> falls slowly from cave ceilings, where your torches catch it."
              - "<strong>Breath</strong> shows in the cold: in snowy lands, players and villagers breathe out small puffs of mist."
              - "<strong>Fish</strong> leap out of lakes and rivers at dawn and dusk, with a splash each way, louder the closer they are."
              - "<strong>Waterfalls</strong> splash where they land, on the ground or in a pool, harder the higher they fall, with a little mist at the foot of a tall one."
              - "<strong>Morning mist</strong>: now and then, about one morning in eight, the land wakes in a mist that hides the sky and the distance, then lifts as the sun climbs, thinner up high and gone underground."
              - "<strong>Blizzards and sandstorms</strong>: when it rains, the snowy lands get a blizzard and the deserts and badlands a sandstorm, where vanilla shows nothing. The view closes in to some 30 blocks, the sky is gone, snow or sand blows past on a wind you can hear, muffled once you're back inside, and it's even thicker in a thunderstorm, when the wind turns into a gale. A good time to check the barometer before you go out. The sandstorm also lays sand on the dunes, never on what you built, and it piles up where it would for real: in the hollows and at the foot of a dune or a wall, on the side away from the wind, up to three layers."
              - "<strong>Layers of sand</strong>: three sand make six layers, like snow, to place and stack the same way. A shovel takes them off one at a time."
              - "<strong>Up high</strong>, specks carried by the wind rush past."
              - "<strong>The rain</strong> falls in pale grey streaks, the color of water, not blue."
              - "<strong>After the rain</strong>, the trees keep dripping for a minute, from every leaf the rain reached."
          - title: "What you hear"
            points:
              - "<strong>Under water</strong>, sounds turn muffled and quieter while your head is below the surface, seem to come from everywhere, those from above the water grow faint, and only a flooded cave or a ceiling of blocks gives them a dull echo; the music and the menus stay clear."
              - "<strong>Geese and gulls</strong> call as a flock passes, louder the closer it is, and a flock flying high goes by in silence."
              - "<strong>Robins</strong> sing by day among the trees of the warm lands, some close by and others far off, joined by <strong>cuckoos</strong> in forests."
              - "<strong>Owls</strong> call in forests at night."
              - "<strong>A wolf</strong>: on full moon nights in the taiga, a lone wolf howls far off, once in a while."
              - "<strong>Thunder</strong> comes after the flash, later and duller the farther the lightning struck."
              - "<strong>Rain on the roof</strong>: under a roof, the rain and the thunder are muffled; leaves are no roof."
              - "<strong>Caves</strong> send every sound back as an echo, short in a passage, long in a great hall."
              - "<strong>Waves</strong> grow all around you as you near a shore: a dull roar from afar, clear at the water's edge, where a line of foam runs up the shore with each wave and water splashes where it breaks. Out at sea, far from any shore, a quiet swell remains."
              - "<strong>Frogs</strong> croak all around in swamps, from dusk until dawn."
              - "<strong>Crickets</strong> sing through warm nights, and <strong>grasshoppers</strong> in savannas by day."
          - title: "Bees and spiders"
            points:
              - "<strong>Bees</strong> are drawn smaller, adults and babies alike, closer to the size of a real one next to a flower."
              - "<strong>Spiders</strong> are drawn smaller too, cave spiders as well, but they are just as easy to hit."
              - "<strong>Spiders</strong> turn upright when they climb a wall, belly to the stone and head up, instead of lying flat in the air."
        faq:
          - q: "Does it change how the game plays?"
            a: "No. Birds and butterflies are only pictures, with nothing behind them: they can't be touched, hunted or hurt, and they drop nothing. Mist never hides the way; a blizzard or a sandstorm can, like a real one, but it stays outside your house."
          - q: "Does it work on a server without the mod?"
            a: "Almost all of it: it happens on your own computer, so it works anywhere, and each player sees their own flocks. Only the mushroom fields' plants and fairy rings, and the sand that sandstorms lay, need the mod on the server, since they grow with the world."
          - q: "Can I turn the sounds down?"
            a: "Yes: they all follow the game's Ambient/Environment slider, in the Music &amp; Sound options."
    - id: minimap
      title: "Compass minimap"
      shot_alt: "Compass minimap in the top-right corner of the screen, with the biome, the coordinates and a Farm marker shown in the village"
      lead: "Equip a compass to see where you are."
      points:
        - "A minimap in the top-right corner, drawn with the colors of vanilla maps, from 32 to 256 blocks wide."
        - "Biome and coordinates right underneath; north-up or rotating with the player."
        - "A direction bar showing where your markers lie, naming the one you aim at, and each one in the world, through terrain, once close. In the Nether, the map shows the floor you stand on, not the bedrock ceiling."
      keys: "+ / − zoom · R rotates · N toggles markers"
      detail:
        heading: "A minimap for Minecraft, unlocked with a compass"
        intro: "Equip a compass and Cassonade draws a minimap in the top-right corner of the screen, in the colors of vanilla maps, with the biome and your coordinates underneath. No compass, no minimap: the screen stays as clean as vanilla."
        points:
          - "Equip a compass in the compass slot, above the offhand: the minimap shows up in the top-right corner."
          - "+ and − zoom from 32 to 256 blocks across."
          - "The biome you stand in and your coordinates are written underneath."
          - "The N button next to the minimap, or R, switches between north-up and a map that turns with you."
          - "H puts the minimap away, with the biome and coordinates, and brings it back; the direction bar and markers stay."
          - "A direction bar at the top of the screen shows your markers and names the one you aim at, with its distance; it gives way to boss bars during a fight. Within 32 blocks, a marker also shows in the world, through terrain, with its name and distance, to tell how high it is. N cycles between the bar, hidden, and all of them in the world; holding V shows them all in the world for a moment."
          - "In the Nether, the map shows the floor you stand on, not the bedrock ceiling. Deep in a cave, it shows the cave around you rather than the surface far above, up to its ceiling in a tall one."
          - "Zoom, rotation, hiding and marker display are remembered between sessions."
        faq:
          - q: "Do I need a compass to see the minimap?"
            a: "Yes: the minimap shows while a compass, or a sculk compass, is equipped in its slot. Take it off and the screen is vanilla again."
          - q: "Does the minimap work in the Nether?"
            a: "Yes. It shows the floor you stand on rather than the bedrock ceiling, so the tunnels and lava lakes around you stay readable."
          - q: "Does the minimap show caves?"
            a: "Yes: deep in a cave, out of the daylight, it shows the cave's floor around you, the way it does in the Nether, and the surface again once you are out."
          - q: "How do I add a marker?"
            a: "Markers are placed on the world map: right-click anywhere on it, then pick a name and one of the 16 dye colors. The marker then shows on the minimap and in the world."
          - q: "Do the keys work on an AZERTY keyboard?"
            a: "Yes. Letter keys, + and − follow the character printed on your keyboard, and every key can be changed in Options → Controls → Key Binds → Cassonade."
    - id: worldmap
      title: "World map and markers"
      shot_alt: "Full-screen world map of the explored land around a village, with rivers, a fog of war and Tower, Farm and Mine markers"
      lead: "Every chunk you have explored, on one map."
      points:
        - "Craft a world map from an empty map and eight sticks, equip it, and open a full-screen map of everything you have visited, under a fog of war."
        - "Hold Shift and hover over a place to see the name of its biome."
        - "Right-click to drop a named marker in any of the 16 dye colors. A brief pale ring marks the spot as you place or remove one; markers appear on the map, the minimap and in the world."
        - "A red X where you last died, until you get back there."
        - "Exploration is recorded from the first minute, even before you craft the map."
      keys: "M opens the map · Space recenters"
      more_shots:
        - id: worldmap-biome
          alt: "World map with the pointer over an explored area and, holding Shift, the name of its biome"
      detail:
        heading: "A world map with markers for Minecraft"
        intro: "Craft a world map from an empty map and eight sticks, and open a full-screen map of every chunk you have explored, under a fog of war. Place named markers in any of the 16 dye colors: they show on the map, on the minimap and in the world."
        points:
          - "Craft a world map from an empty map surrounded by eight sticks, and equip it in the map slot."
          - "M, or the tab at the top of the inventory, opens a full-screen map of every chunk you have explored in this dimension, under a fog of war."
          - "Drag to move, + / − or the mouse wheel to zoom, Space to recenter on yourself. A panel in the bottom left corner lists the map's shortcuts."
          - "Hold Shift and hover over a place to see the name of its biome."
          - "Once you have been to the Nether, the tooltip also gives where that spot leads in the other dimension."
          - "Right-click to place a marker, with an optional name and one of the 16 dye colors; right-click a marker to remove it. A brief pale ring marks the spot when you place or remove one. You can have up to 64, and they are kept on death."
          - "Markers show as banners of their color on the world map, on the minimap and in the world."
          - "Where you last died shows as a red X, on the maps and in the world. It goes away once you get back there, or with a right-click on the world map."
          - "The world's spawn chunk, where you come back without a bed, is outlined on the world map."
          - "The lodestone each of your lodestone compasses points to shows as a white X on the minimap and the world map, named after the compass if you renamed it."
          - "Coordinates written in the chat become links: a click opens the world map there, ready to name a marker."
          - "Ping: Shift + middle click on a spot or a mob, up to 128 blocks away, and every player in the dimension sees it marked by a red point with your name for a few seconds. No map needed; middle click alone still picks the block."
          - "Exploration is recorded from the first minute, even before you craft the map."
        recipe:
          pattern: ["SSS", "SMS", "SSS"]
          key:
            S: { icon: stick, name: "Stick" }
            M: { icon: map, name: "Empty Map" }
          result: { icon: world_map, name: "World Map" }
          text: "An empty map surrounded by eight sticks, in a crafting table."
        faq:
          - q: "How do I craft the world map?"
            a: "Put an empty map in the middle of a crafting table and fill the eight slots around it with sticks. Equip the world map in the map slot, above the offhand, then press M to open it."
          - q: "Do I have to explore again after crafting the map?"
            a: "No. Exploration is recorded from the first minute, with or without the map: everywhere you have been is already on it when you craft it."
          - q: "How many markers can I place?"
            a: "Up to 64, across all dimensions. They are saved on your player and kept when you die."
          - q: "How do I find where I died?"
            a: "A red X marks where you last died, on the world map, on the minimap and in the world, until you get back there. A right-click on it in the world map removes it."
          - q: "How do I show a place to my friends?"
            a: "Look at it and Shift + middle click: every player in the dimension sees a red point there with your name for a few seconds, following the mob if you pointed at one. It needs Cassonade on the server; without it, the middle click picks the block as usual."
    - id: clock
      title: "Clock and barometer"
      shot_alt: "Minecraft at dusk with the clock panel in the top-left corner: 18:36, day 1, the weather and the next weather change"
      lead: "Equip a clock to know when night falls, a barometer to know when rain will."
      points:
        - "The time of day and the current weather."
        - "The day count and the moon's phase, blinking with a small bed and a soft chime when you can sleep."
        - "In the Nether, the clock spins, just like in vanilla."
      item:
        icon: barometer
        name: "Barometer"
        recipe: "Clock + Lightning rod"
        text: "Worn in the clock's slot, it also shows the next weather change, read from the server's own weather timers."
      detail:
        heading: "A clock HUD and a weather forecast for Minecraft"
        intro: "Equip a clock to see the time, the weather, the day count and the moon's phase in the top-left corner of the screen. Combine it with a lightning rod to make a barometer, and know when the next rain or thunderstorm will come."
        points:
          - "Equip a clock in the clock slot: a panel in the top-left corner shows the time and the current weather."
          - "The day count and the moon's phase."
          - "When you can sleep, at nightfall or as a thunderstorm starts, a soft chime rings and the moon blinks with a small bed for a few seconds."
          - "Craft a barometer from a clock and a lightning rod, and wear it in the clock's slot instead: the panel also shows the next weather change, read from the server's own weather timers."
          - "In the Nether, the clock spins, just like in vanilla."
        recipe:
          pattern: ["CL", "  "]
          key:
            C: { icon: clock, name: "Clock" }
            L: { icon: lightning_rod, name: "Lightning Rod" }
          result: { icon: barometer, name: "Barometer" }
          text: "A clock and a lightning rod, anywhere in a crafting grid: the inventory's is enough."
        faq:
          - q: "How does the barometer know the weather?"
            a: "Minecraft decides the next weather change in advance, with timers on the server. The barometer reads them, so its forecast is the game's own, not a guess. When the weather is frozen, there is nothing to forecast."
          - q: "When can I sleep?"
            a: "When the moon blinks with a small bed on the clock, with a soft chime: at nightfall, or as soon as a thunderstorm starts."
          - q: "Does Cassonade change the length of the day?"
            a: "Yes: daytime lasts 20 minutes instead of 10, and the night keeps its vanilla length. The clock and the forecast follow the slower day."
          - q: "Does the forecast work in multiplayer?"
            a: "Yes, when the server has Cassonade too: it sends the forecast to players wearing a barometer."
    - id: inventory
      title: "An inventory that keeps up"
      shot_alt: "Chest window with sort buttons, and a Shulker box tooltip showing its contents and fill bar"
      lead: "All the little gestures vanilla is missing."
      points:
        - "Sort a chest, a shulker box or your inventory in one click, or with a middle-click. Stash items into the open chest when it already holds some."
        - "Search a chest, shulker box or backpack with Ctrl+F (Cmd+F on Mac), or the magnifying-glass button; other stacks dim."
        - "Hold Shift and drag across a row to move it all. Scroll down over a stack to move it one item at a time. Drag a bundle over items to fill it, or over empty slots to empty it."
        - "Lock a slot with Alt-click: sorting, stashing, Shift-click and the drop key leave it alone."
        - "See inside bundles, shulker boxes, backpacks and filled maps on hover, and what food restores."
        - "What each enchantment does, on enchanted books, and on gear with Shift held."
        - "What you pick up, listed discreetly on the right of the screen."
        - "Ctrl-click a recipe to craft as many as your inventory allows."
        - "A warning before an enchanted tool or armor piece breaks."
        - "Soft sounds on inventory clicks, where vanilla stays silent."
      more_shots:
        - id: inventory-food
          alt: "Inventory with a food in hand, the drumsticks it would restore blinking in the hunger bar"
      detail:
        heading: "Inventory sorting and quality-of-life tweaks for Minecraft"
        intro: "Sort chests in one click, stash items where they belong, lock slots, refill your hand, see inside Shulker boxes: Cassonade adds all the little inventory gestures vanilla Minecraft is missing, in the game's own style."
        points:
          - "<strong>Sort</strong> a chest, barrel, ender chest, Shulker box, your backpack or your inventory with the small buttons next to the titles, or middle-click a slot."
          - "<strong>Stash</strong>: one click puts into the open chest the items it already holds."
          - "<strong>Search</strong>: press Ctrl+F (Cmd+F on Mac), or click the magnifying-glass button, to open a search field. It matches item names and IDs, enchantments, and items inside bundles and Shulker boxes; non-matches dim without disappearing."
          - "<strong>Shift-drag</strong> across a row to move every stack you pass over."
          - "<strong>Scroll wheel</strong>: scroll down over a stack to move its items one at a time, where a Shift-click would send the stack."
          - "<strong>Locked slots</strong>: Alt-click a slot of your inventory or hotbar to lock it, marked with a padlock. Sorting, stashing, Shift-click, Shift-drag and the drop key leave it alone, and it still gets refilled when its stack runs out."
          - "<strong>Bundles</strong>: drag a bundle over items to fill it, or right-drag over empty slots to empty it."
          - "<strong>Previews</strong>: see inside bundles, Shulker boxes, backpacks and filled maps on hover. Food shows the hunger it restores and its saturation, as drumsticks, and in hand, what it would restore blinks on the hunger bar."
          - "<strong>Enchantment descriptions</strong>: what each enchantment does, under its name, always on enchanted books, and on enchanted gear while Shift is held."
          - "<strong>Compare gear</strong>: with Shift held, a weapon's, tool's or armor's tooltip shows how it compares with the piece you wear or hold there, +2 Armor or -1 Attack Damage, enchantments aside."
          - "<strong>Anvil penalty</strong>: an item already worked at the anvil shows the levels the anvil adds to every new use on it."
          - "<strong>Fuel</strong>: in a furnace, blast furnace or smoker, a fuel's tooltip says how many items it smelts (coal 8, a plank 1.5)."
          - "<strong>Brewing</strong>: a brewing stand shows how long its current batch has left and how many fuelled batches remain."
          - "<strong>Picked up</strong>: what you pick up is listed discreetly on the right of the screen for a few seconds, the same item's pickups added up."
          - "<strong>New items</strong>: what you just picked up carries a small golden dot in your inventory, until your cursor passes over it."
          - "<strong>Hotbar rows</strong>: G rotates your inventory rows into the hotbar, the row just above coming down into it. Four presses bring everything back, so each row can hold a set: tools, building blocks, food and torches."
          - "<strong>Hand refill</strong>: when the stack in your hand runs out (last block placed, last food eaten, tool broken), a matching stack from your inventory takes its place."
          - "<strong>Durability warning</strong>: when an enchanted tool, weapon or armor piece is about to break, a soft crack, a message above the hotbar and the item blinking red."
          - "<strong>Bulk crafting</strong>: Ctrl-click (Cmd on Mac) a recipe in the recipe book to craft as many as your inventory allows."
          - "<strong>An item's uses</strong>: press U over an item to open the recipe book on every recipe that uses it; U again, a search or closing the book brings the whole book back."
          - "<strong>Chain crafting</strong>: click a recipe missing something you could craft first, and the recipe book makes it from your inventory, logs into planks, planks into sticks."
          - "<strong>Shulker boxes</strong> click like bundles: click or drag over stacks to fill one, right-click to take a stack out, and scroll over it to pick which."
          - "Soft sounds on inventory clicks, where vanilla stays silent."
        faq:
          - q: "How do I sort a chest?"
            a: "Click the small sort button next to its title, or middle-click a slot in it (in Survival). Identical stacks are merged, then ordered by item. In your own inventory, sorting leaves the hotbar and armor alone."
          - q: "How do I lock an inventory slot?"
            a: "Alt-click a slot of your inventory or hotbar: a padlock marks it. Sorting, stashing, Shift-click, Shift-drag and the drop key (Q) leave it alone. Alt-click it again to unlock it."
          - q: "What does hand refill do?"
            a: "When the stack in your hand runs out, a matching stack from your inventory takes its place, an identical one (same enchantments, same wear) first. It never takes from the backpack."
          - q: "How do I search a chest or backpack?"
            a: "Press Ctrl+F (Cmd+F on Mac), or click the magnifying-glass button by the title. Type an item name, ID or enchantment; items inside bundles and Shulker boxes are searched too. Non-matching stacks dim but stay in place."
          - q: "Does the brewing stand show how long a potion will take?"
            a: "Yes. While it is open, it shows the time left in the current batch and the number of fuelled batches remaining."
          - q: "Does it work on a server without the mod?"
            a: "Partly. Search, previews, food values, the durability warning, the new items' dot, hotbar rows and brewing times work on any server; sorting and locked slots need Cassonade on the server."
    - id: harvest
      title: "Right-click harvest"
      shot_alt: "A field of ripe wheat on both sides of a water channel, ready for right-click harvest"
      lead: "Right-click a ripe crop: it is harvested and replanted."
      points:
        - "Wheat, carrots, potatoes, beetroots, nether wart and cocoa."
        - "Same drops as breaking it, Fortune included, minus the replanted seed. Sneak to use the vanilla right-click."
      detail:
        heading: "Right-click harvest for Minecraft crops"
        intro: "Right-click a ripe crop and Cassonade harvests and replants it in one go: wheat, carrots, potatoes, beetroots, nether wart and cocoa. The same drops as breaking it, without replanting by hand."
        points:
          - "Works on wheat, carrots, potatoes, beetroots, nether wart and cocoa, once they are fully grown."
          - "You get the same drops as breaking the crop, Fortune included, minus the seed that goes back in the ground."
          - "Sneak to use the vanilla right-click instead."
        faq:
          - q: "Which crops can I harvest with a right-click?"
            a: "Wheat, carrots, potatoes, beetroots, nether wart and cocoa, once they are fully grown."
          - q: "Does Fortune work with right-click harvest?"
            a: "Yes. The drops are the same as breaking the crop, Fortune included; only the seed that replants it is taken out."
          - q: "Can I still use the vanilla right-click on a crop?"
            a: "Yes: sneak while you right-click."
    - id: elytra
      title: "Elytra slot"
      shot_alt: "A player seen from behind wearing an iron helmet, a diamond chestplate and elytra at the same time, above a village"
      lead: "Fly without taking your chestplate off."
      points:
        - "Elytra have their own slot, next to the offhand. They fly, wear out and take Mending exactly as in vanilla."
        - "Other players see your wings over your armor."
      detail:
        heading: "An elytra slot: fly without taking off your chestplate"
        intro: "In vanilla Minecraft, elytra take the chestplate's place. Cassonade gives them their own equipment slot, next to the offhand, so you can fly and stay protected at the same time."
        points:
          - "Elytra have their own slot, next to the offhand. Right-click them, or Shift-click them in the inventory, to equip them."
          - "Your chestplate stays in its slot and keeps protecting you while you fly."
          - "They fly, wear out and take Mending exactly as in vanilla."
          - "Other players see your wings over your armor."
        faq:
          - q: "Can I wear elytra and a chestplate at the same time?"
            a: "Yes. Elytra go in their own slot, next to the offhand, and the chestplate stays in its slot: you fly with your full armor on."
          - q: "Does it change how elytra fly?"
            a: "No. Gliding, speed, durability and repairs are vanilla; only where they are worn changes."
          - q: "How do I repair elytra in their slot?"
            a: "As in vanilla: with phantom membranes at the anvil, or with Mending, which works in the elytra slot too."
    - id: hopper
      title: "Filtered hopper"
      shot_alt: "Hopper window with a stone block in its filter slot, so only stone goes through"
      lead: "Item sorters without the redstone."
      points:
        - "Every hopper gets a filter slot: put one item in, and the hopper only accepts that item."
        - "Put a bundle or a shulker box in the filter, and every item inside it goes through."
        - "A line of hoppers with filters underneath makes a full sorting system."
        - "Filtered hoppers are recognizable by the iron grate inside. Speed, redstone locking and comparators stay vanilla."
      detail:
        heading: "Hopper filters: sort items without redstone"
        intro: "Every hopper gets a filter slot. Put one item in, and the hopper only accepts that item: a row of filtered hoppers makes a full item sorter, no redstone needed, so no PhD in redstone either."
        points:
          - "Every hopper gets a filter slot: put one item in, and the hopper only accepts that item."
          - "A bundle or a shulker box in the filter slot lets through every item it holds. An empty one filters bundles or shulker boxes, like any other item."
          - "The filter compares the item, not its enchantments or name."
          - "A row of hoppers with filtered hoppers underneath makes a full item sorter."
          - "Speed, redstone locking and comparators stay vanilla."
          - "Filtered hoppers are recognizable by the iron grate inside."
        faq:
          - q: "How do I build an item sorter with filtered hoppers?"
            a: "Send your items along a line of hoppers. Under each hopper of the line, place a filtered hopper leading into a chest: each one pulls out only its item, and the rest carries on down the line."
          - q: "Can one hopper filter several items?"
            a: "Yes: put a bundle or a shulker box holding those items in the filter slot, and every item inside it goes through."
          - q: "Does the filter care about enchantments or names?"
            a: "No, it compares the item only: any diamond sword goes through a diamond sword filter, enchanted or renamed."
          - q: "Does it break my redstone builds?"
            a: "No. Without a filter, a hopper works exactly as in vanilla, and speed, redstone locking and comparators never change."
    - id: quests
      title: "Quest journal and advancements"
      shot_alt: "Quest journal open on the First Steps chapter, with every chapter and its progress"
      lead: "Always know what to do next."
      points:
        - "A journal in twelve chapters walks you from your first night to the toughest challenges, following Minecraft's own advancements."
        - "The current quest shows under the minimap, with its progress. Click it to open the journal."
        - "A new advancements screen lists them all, with what is left for each (biomes to visit, mobs to kill…)."
        - "Earned advancements are celebrated in the middle of the screen, bigger for goals and challenges."
      keys: "J journal · L advancements · K tracker"
      more_shots:
        - id: advancements
          alt: "Advancements screen with the Minecraft tab open, its advancements and the count made in each tab"
      detail:
        heading: "A quest journal and a better advancements screen for Minecraft"
        intro: "Always know what to do next: a quest journal in twelve chapters walks you from your first night to the toughest challenges, following Minecraft's own advancements, and a new advancements screen shows exactly what is left for each."
        points:
          - "<strong>Quest journal</strong> (J): twelve chapters that walk you from your first night to the toughest challenges. It is offered in a small panel on the side when you start a world: J accepts, K declines, and it goes away if you ignore it. You can turn it on or off at any time."
          - "<strong>Current quest</strong>: shown under the minimap with its progress. Click it to open the journal; K shrinks it, hides it or shows it again."
          - "<strong>Advancements screen</strong> (L): every advancement in one book, with what is left for each (biomes to visit, mobs to kill…) and a filter for what is done or still to do."
          - "<strong>Celebrations</strong>: earned advancements are announced in the middle of the screen, bigger for goals and challenges."
          - "The quests follow Minecraft's own advancements: nothing new to collect, nothing that changes the game's progression."
        faq:
          - q: "Are the quests new content?"
            a: "No. The journal arranges Minecraft's own advancements into twelve chapters, in a sensible order: it gives direction without changing the game."
          - q: "Can I turn the quest journal off?"
            a: "Yes. It is offered in a small panel when you start a world: K declines it, and it goes away if you ignore it. It can be turned on or off at any time. K shrinks or hides the current quest on screen."
          - q: "What does the new advancements screen show?"
            a: "Every advancement in one book, and for each one what is left: the biomes you have not visited yet for Adventuring Time, the mobs you have not killed for Monsters Hunted, and so on."
    - id: combat
      title: "Combat awareness"
      shot_alt: "A creeper and a spider with health bars and golden “!” marks over their heads, and the eye in the top-left corner"
      lead: "Equip a sculk compass to know who is after you."
      points:
        - "A health bar over mobs in a fight, which shows the damage you just dealt."
        - "A “!” when a mob starts chasing you."
        - "An eye in the corner of the screen while anything is hunting you, even out of sight."
        - "A red dot on the minimap for each mob hunting you."
      item:
        icon: sculk_compass
        name: "Sculk Compass"
        recipe: "Compass + Sculk sensor"
        text: "Worn in the compass's slot, it shows the minimap and senses the mobs around you. Sculk sensors grow in the deep dark and only drop with Silk Touch."
      detail:
        heading: "Mob health bars and combat awareness for Minecraft"
        intro: "Craft a sculk compass from a compass and a sculk sensor, and see what is after you: health bars over the mobs you fight, a “!” when a mob starts chasing you, and an eye in the corner of the screen while anything hunts you, even out of sight."
        points:
          - "Combine a compass with a sculk sensor to make a sculk compass, and wear it in the compass's slot: it shows the minimap as well."
          - "A health bar over mobs in a fight, which shows the damage you just dealt; bosses keep theirs at the top of the screen."
          - "A golden “!” when a mob starts chasing you."
          - "An eye in the corner of the screen while anything is hunting you, even out of sight, with the number of pursuers."
          - "A red dot on the minimap for each mob hunting you, on its edge when the mob is farther, so you know where it comes from."
          - "The other players around you on the minimap, as blue markers with their name."
          - "With or without the sculk compass, a red arc around the crosshair points to where a hit came from."
        recipe:
          pattern: ["CS", "  "]
          key:
            C: { icon: compass, name: "Compass" }
            S: { icon: sculk_sensor, name: "Sculk Sensor" }
          result: { icon: sculk_compass, name: "Sculk Compass" }
          text: "A compass and a sculk sensor, anywhere in a crafting grid: the inventory's is enough."
        faq:
          - q: "How do I get a sculk compass?"
            a: "Mine a sculk sensor with a Silk Touch tool, in the deep dark, then craft it with a compass. Wear the sculk compass in the compass slot, in place of the compass."
          - q: "Do I still get the minimap with the sculk compass?"
            a: "Yes: the sculk compass does everything the compass does, and senses the mobs around you."
          - q: "Does it work in multiplayer?"
            a: "Yes, with Cassonade on the server: the “!” and the eye need the server, which knows which mobs are chasing you."
    - id: spyglass
      title: "Spyglasses"
      shot_alt: "A horse seen through the naturalist's spyglass, in a round lens, its speed, jump, health and readiness to breed in a panel under the crosshair"
      lead: "A clearer lens and a finer zoom, and a naturalist's spyglass that reads what it sees."
      points:
        - "Through a spyglass, a round lens, and the scroll wheel zooms a step further in or out."
        - "The naturalist's spyglass also reads what you see: a horse's speed, jump and health, whether an animal can breed, a villager's sold-out trades, a crop's growth, how much honey is in a beehive and how many bees are inside."
        - "Up to 128 blocks away."
      item:
        icon: naturalist_spyglass
        name: "Naturalist's Spyglass"
        recipe: "Spyglass + Book + Sculk sensor"
        text: "It zooms like a spyglass, and reads what you see through it. Sculk sensors grow in the deep dark and only drop with Silk Touch."
      keys: "Scroll wheel zooms in and out"
      more_shots:
        - id: spyglass-bees
          alt: "A beehive seen through the naturalist's spyglass, with its honey level and the number of bees inside"
      detail:
        heading: "A naturalist's spyglass: horse stats, breeding and beehives at a glance"
        intro: "Look through a spyglass in a round lens, and zoom further in or out with the scroll wheel. Combine it with a book and a sculk sensor into a naturalist's spyglass, and a small panel tells what you see: a horse's speed, jump and health, whether an animal can breed, a villager's sold-out trades, a crop's growth and how many bees are in a beehive."
        points:
          - "Through a spyglass, a round lens at the end of a dark tube instead of vanilla's square window."
          - "The scroll wheel zooms one step further in or out than vanilla, the spyglass staying in hand."
          - "Combine a spyglass with a book and a sculk sensor to make a naturalist's spyglass: it zooms like a spyglass, and reads what you see through it, up to 128 blocks away."
          - "<strong>Horses, donkeys, mules and llamas</strong>: their speed in blocks per second, jump height and health, and a llama's strength, each as a bar from the worst a horse can be born with to the best, red to green."
          - "<strong>Animals</strong>: whether they are ready to breed, or how long until they are, and when a baby grows up."
          - "<strong>Villagers</strong>: their level, and how many of their trades are sold out."
          - "<strong>Crops</strong>: how far they have grown, or that they are ripe. <strong>Beehives</strong>: their honey and how many bees are inside."
        recipe:
          pattern: ["SB", "K "]
          key:
            S: { icon: spyglass, name: "Spyglass" }
            B: { icon: book, name: "Book" }
            K: { icon: sculk_sensor, name: "Sculk Sensor" }
          result: { icon: naturalist_spyglass, name: "Naturalist's Spyglass" }
          text: "A spyglass, a book and a sculk sensor, anywhere in a crafting grid: the inventory's is enough."
        faq:
          - q: "How do I craft the naturalist's spyglass?"
            a: "Mine a sculk sensor with a Silk Touch tool in the deep dark, then combine it with a spyglass and a book in a crafting table."
          - q: "How do I see a horse's stats?"
            a: "Look at the horse through a naturalist's spyglass: its speed, jump height and health show under the crosshair, each as a bar from the worst a horse can be born with to the best, red to green."
          - q: "Can I zoom further with a spyglass?"
            a: "Yes. While looking through any spyglass, turn the scroll wheel: it zooms one step further in, or one step further out, than vanilla."
          - q: "Does it work in multiplayer?"
            a: "Yes, with Cassonade on the server, which knows the naturalist's spyglass and tells when an animal can breed and which trades are sold out. The lens and the scroll wheel's zoom work on any server."
    - id: torch
      title: "Sculk torch"
      shot_alt: "A meadow at night seen with a sculk torch in hand, faint creeper faces lying on the grass where monsters can spawn, none around a torch"
      lead: "See where monsters can spawn before they do."
      points:
        - "Held in hand, it lights like a torch."
        - "A faint creeper's face lies on every block around where monsters can spawn."
        - "Dark where they can at any time, light where only the night lets them."
      item:
        icon: sculk_torch
        name: "Sculk Torch"
        recipe: "Torch + Sculk sensor"
        text: "Light the spots it shows and the faces go away. Sculk sensors grow in the deep dark and only drop with Silk Touch."
      detail:
        heading: "A sculk torch: see where mobs can spawn, without a light level overlay mod"
        intro: "Combine a torch with a sculk sensor into a sculk torch. Held in either hand, it lights around you like a torch, and lays a faint creeper's face on every block around where monsters can spawn: light them up, and the faces go away."
        points:
          - "Held in either hand, it lights around you like a torch, as any torch in hand does with Cassonade."
          - "In place of a flame, a sculk sensor's tendril sways at its top."
          - "On every block up to 12 blocks around where a monster can spawn, a creeper's face lies flat, like a faint shadow, hidden by the blocks in front."
          - "Dark where monsters can spawn at any time, in caves and under roofs; light where they can only at night, open to the sky."
          - "It reads the light your game knows: place torches until no face is left."
        recipe:
          pattern: ["TK"]
          key:
            T: { icon: torch, name: "Torch" }
            K: { icon: sculk_sensor, name: "Sculk Sensor" }
          result: { icon: sculk_torch, name: "Sculk Torch" }
          text: "A torch and a sculk sensor, anywhere in a crafting grid: the inventory's is enough."
        faq:
          - q: "How do I see where mobs can spawn?"
            a: "Hold a sculk torch: a faint creeper's face shows on every block around where a monster can spawn. Place torches or other light until the faces are gone."
          - q: "What do the dark and light faces mean?"
            a: "A dark face is a spot dark enough at any time, like a cave. A light one is open to the sky: monsters spawn there only at night."
          - q: "How do I craft the sculk torch?"
            a: "Mine a sculk sensor with a Silk Touch tool in the deep dark, then combine it with a torch in any crafting grid."
          - q: "Does it work in multiplayer?"
            a: "Yes, on any server: your game reads the light it already knows."
    - id: sea
      title: "The sea"
      shot_alt: "Twelve blocks under the sea, looking into murky water: a drowned with a trident coming out of the gloom, another only a shadow behind it"
      lead: "The sea is no longer a clear blue pool: its depths are murky, dark and full of things you see too late."
      points:
        - "Past about 30 blocks under water, everything is lost in the murk; nearer, the view blurs the farther things are."
        - "The deeper you go, the darker it gets, and at night the sea keeps almost none of its blue."
        - "Drowned and guardians come out of the gloom barely 16 blocks away. They see you no better."
        - "A diving mask keeps the view sharp and twice as long, and its snorkel lets you breathe just under the surface."
        - "From the shore, the sea ends on a clean horizon the sun sets behind, and its surface no longer repeats block by block."
      more_shots:
        - id: sea-mask
          alt: "The same water through a diving mask: the view sharp, the drowned clearly seen, and the one behind it too"
        - id: sea-sunset
          alt: "The sun setting behind the sea on a clean horizon, the water darkening under an orange sky"
        - id: sea-underwater
          alt: "Looking up from under the sea at the morning sun glowing through the waves, the surface around it a dark mirror"
      item:
        icon: diving_mask
        name: "Diving Mask"
        recipe: "5 Leather + Glass Pane"
        text: "Worn in the helmet's place, with a helmet's enchantments: the sea becomes a place you can explore."
      detail:
        heading: "The sea: murky depths that make diving a real expedition, and a diving mask to brave them"
        intro: "In vanilla, the sea is a clear blue pool where you see the ocean floor from afar. With Cassonade, it's a real sea: the water is murky, the depths are dark, and what lives there comes out of the gloom at the last moment. Diving becomes an expedition you prepare for, and the diving mask, crafted from vanilla leather and glass, is what you prepare with."
        sections:
          - title: "From the shore"
            points:
              - "<strong>The horizon</strong>: the sea ends on a clean curve, and the sun and moon set behind it instead of showing through the water."
              - "<strong>Far water</strong> turns opaque, hiding the kelp and sunken structures vanilla leaves lit in the distance."
              - "<strong>Its surface</strong> no longer repeats block by block: the ripples, in the game's own style, are drawn over 8 by 8 blocks, so a calm sea seen from above shows no grid."
              - "<strong>Its color</strong> follows the light: the sea darkens and greys at dusk, and keeps little of its blue at night."
          - title: "Under water"
            points:
              - "<strong>Murky water</strong>: past about 30 blocks, everything is lost in the water; nearer, the view blurs, the more the farther things are, as eyes open in real water see. Drifting silt, carried back and forth by the swell, closes in the view."
              - "<strong>Darkness</strong>: the distance dims the deeper you go, the sky only shows when you look up, the sun glowing through the waves, and never through rock; at night the sea keeps almost none of its blue."
              - "<strong>What lives there</strong>: drowned and guardians appear barely 16 blocks away, out of the murk. It is fair: through the water, monsters notice you only within 16 blocks too, and lose you past 30."
              - "<strong>Your eyes</strong> get used to the water in 3 seconds instead of 30: the sea is murky, not blinding, and you still find your way."
          - title: "The diving mask"
            points:
              - "<strong>The diving mask</strong> keeps the view sharp and twice as long, about 60 blocks. Its snorkel lets you breathe with your head up to about 2 blocks under the surface, and your last breath lasts 5 seconds deeper. It protects like a leather cap and takes a helmet's enchantments: Respiration, Aqua Affinity, Protection, Unbreaking, Mending."
        recipe:
          pattern: ["LLL", "LGL"]
          key:
            L: { icon: leather, name: "Leather" }
            G: { icon: glass_pane, name: "Glass Pane" }
          result: { icon: diving_mask, name: "Diving Mask" }
          text: "Five leather around a glass pane, shaped like a helmet: three on top, one on each side of the pane."
        faq:
          - q: "Why can't I see anything under water?"
            a: "The water is murky with Cassonade: past about 30 blocks, everything is lost in it, and the view blurs with distance. Wear a diving mask to see sharp and twice as far."
          - q: "How do I see better under water?"
            a: "Craft a diving mask from five leather around a glass pane, shaped like a helmet, and wear it in the helmet's place: the view stays sharp and reaches about 60 blocks."
          - q: "Can I breathe under water with the diving mask?"
            a: "Just under the surface: its snorkel lets you breathe with your head up to about 2 blocks under water, as long as the open air is right above. Diving deeper, your last breath lasts 5 seconds, then you hold your breath as usual. Respiration still helps."
          - q: "Can I enchant the diving mask?"
            a: "Yes, like a helmet: Respiration and Aqua Affinity from the enchanting table, Protection, Unbreaking and Mending too."
          - q: "Do monsters see me better under water?"
            a: "No: through the water, they notice you only within 16 blocks, and lose you past 30."
          - q: "Does it work in multiplayer?"
            a: "What you see works on any server: it happens on your own computer. Monsters losing you in the water, and the diving mask, an item of the mod, need Cassonade on the server."
    - id: villages
      title: "Villages and treasures"
      shot_alt: "A snowy town seen from above, its streets lined with houses close together"
      lead: "Exploring finally pays off: bigger villages, taverns, and treasures worth the trip."
      points:
        - "Now and then, a town: a village grown three times larger, its houses close together along its streets."
        - "Churches become taverns or small inns, with a bar, kegs, a fireplace and a tavern keeper, where villagers meet in the evening."
        - "Village houses and woodland mansions built of stone bricks, the mansions furnished and their chests richer."
        - "Temples, pillager outposts and igloos hold real treasures, and very rarely a lush cave hides a pirate's booty."
      more_shots:
        - id: villages-pirate-booty
          alt: "A pirate's booty in a lush cave: barrels piled on the moss under glow berries"
      detail:
        heading: "Towns, taverns and treasures: Minecraft villages and structures worth exploring"
        intro: "In vanilla, exploring rarely pays off: villages all look about the same, and most chests hold bones and rotten flesh. So I made the trip worth it: rare towns, taverns instead of churches, stone brick houses, furnished mansions and real treasures. All of it with vanilla blocks and vanilla loot, in the land you haven't explored yet."
        sections:
          - title: "Villages"
            points:
              - "<strong>Towns</strong>: now and then, about one village in ten, a town stands in its place: its streets run three times as far, lined with houses close together, none on top of another. Cartographers' village maps and <code>/locate</code> find them as they find villages."
              - "<strong>Market squares</strong>: a town's heart is a market square around its bell, with four stalls under striped wool awnings, goods on their counters and barrels of produce. One stall is left bare: a wandering trader who comes to town sets up there and stays, instead of roaming the streets."
              - "<strong>Lamp posts</strong>: lanterns on posts along the streets instead of torches on a fence, in the village's wood or stone, never in the middle of a path. In a zombie village, they are dark."
              - "<strong>Taverns</strong> take the place of churches, in the village's materials, a long hall along the street behind a tower that is their porch: a bar with kegs in the wall, some holding food and drink and one the church's loot, the brewing stand set in the counter, tables, a fireplace and hanging lanterns."
              - "<strong>Small inns</strong>: where the biome has a small church too (plains, desert, savanna), it becomes an inn, the same hall without the tower, its door under an awning, a short counter with three kegs and a single table by the fire."
              - "<strong>The tavern keeper</strong>: the cleric wears a green waistcoat and a cream apron, with the same trades. The kegs don't make fishermen."
              - "<strong>Evenings at the tavern</strong>: when villagers meet at the bell in the late afternoon, they meet in the tavern instead, as long as its fire burns. They chat between the tables and sip their drinks. Put the fire out and they go back to the bell."
              - "<strong>Houses</strong> are built mostly of stone bricks rather than cobblestone, some mossy or cracked, with a little cobblestone left, and on a slope their foundations go down to the ground. In a zombie village, the bricks are mossy, the tavern's fire and candles are out and its lanterns gone."
          - title: "Treasures"
            points:
              - "<strong>Woodland mansions</strong>: stone brick walls, candles, flowers and hanging lanterns in the rooms, lanterns instead of torches, barrels in rooms and corridors, and no empty chest. Their chests also hold emeralds, diamonds, enchanted books and rare treasures, and their barrels up to two backpack upgrade templates."
              - "<strong>Jungle temples</strong>: two more treasures in each chest, emeralds, diamonds, enchanted books, gold blocks, golden apples, and rarely netherite scrap or an enchanted golden apple."
              - "<strong>Pillager outposts</strong>: one or two more treasures in their chest, since you have to beat the pillagers first: emeralds, diamonds, enchanted books, an enchanted crossbow, golden apples, and rarely diamond horse armor or an enchanted golden apple."
              - "<strong>Desert pyramids</strong>: one more treasure in each of the four chests, emeralds, diamonds, enchanted books, gold blocks or golden apples."
              - "<strong>Igloos</strong>: you find them early, so the treasure stays modest: emeralds, an enchanted book, a Frost Walker book, a splash potion of Weakness to cure the zombie villager in the basement, or a diamond or two."
              - "<strong>Ocean monuments</strong>: past the elder guardians, deep under the murky sea, barrels in the corners of the treasure room, around the gold blocks: gold, prismarine crystals, emeralds, diamonds, enchanted books, and rarely diamond nautilus armor, a heart of the sea, netherite scrap, an enchanted trident or an enchanted golden apple. Finally a reason to go down there."
              - "<strong>A pirate's booty</strong>: very rarely, a lush cave hides a pile of barrels on its floor, full of gold, emeralds, diamonds and enchanted books, sometimes a spyglass or an enchanted diamond sword, and more rarely a heart of the sea, netherite scrap or an enchanted golden apple."
              - "<strong>A pirate's map</strong>: now and then, a shipwreck's map chest holds one besides the treasure map, a red X on the nearest booty. So the shipwreck leads you to the cave."
        faq:
          - q: "How do I find a town?"
            a: "Explore: about one village in ten is a town, in every biome villages grow in. A cartographer's village map can lead to one. Only land never visited before can hold one."
          - q: "Do I need a new world?"
            a: "Towns, taverns, the new houses and mansions, the monuments' barrels and the pirate's booty only show up in land never visited before: in an old world, go explore further out. Chests nobody has opened yet still get the richer loot."
          - q: "Doesn't richer loot make the game easier?"
            a: "Not really: it's vanilla items, in places you have to find first, often far away or deep down. A better reward for a long trip, not a shortcut at the start."
          - q: "Does it work in multiplayer?"
            a: "Yes, with Cassonade on the server, which builds the world. On a server without the mod, villages and structures stay vanilla."
    - id: woodcutter
      title: "Woodcutter"
      shot_alt: "The woodcutter's window, in wood tones like the stonecutter's, offering the pieces that one plank can be cut into"
      lead: "The stonecutter's twin for wood."
      points:
        - "Put a plank in, pick what you want: stairs, slabs, fences, fence gates, doors, trapdoors, signs, buttons or pressure plates."
        - "Cutting is lossless: you get at least what the crafting table gives for that plank, never more."
        - "The stonecutter keeps cutting stone only."
      item:
        icon: woodcutter
        name: "Woodcutter"
        recipe: "Iron ingot + 3 planks"
        text: "An iron ingot over three planks of any wood, in a crafting table."
      detail:
        heading: "A woodcutter: cut planks into stairs, slabs, doors and more"
        intro: "Craft a woodcutter, and cut wood the way the stonecutter cuts stone: put a plank in, pick the piece, take it out. Same window, in wood tones."
        points:
          - "Stairs, slabs, fences, fence gates, doors, trapdoors, signs, buttons and pressure plates of every wood."
          - "A piece gives what the crafting table gives per plank, rounded down and at least one: cutting is never worse than crafting, and never a way to get more out of the same wood."
          - "The stonecutter keeps cutting stone only."
          - "Both cutters remember your piece while the window is open: the next stack keeps it, and another material keeps the same shape."
        recipe:
          pattern: [" I ", "PPP"]
          key:
            I: { icon: iron_ingot, name: "Iron Ingot" }
            P: { icon: oak_planks, name: "Planks (any wood)" }
          result: { icon: woodcutter, name: "Woodcutter" }
          text: "An iron ingot over three planks of any wood, in a crafting table."
        faq:
          - q: "How do I craft the woodcutter?"
            a: "Put an iron ingot over three planks of any wood in a crafting table."
          - q: "Does it give more than the crafting table?"
            a: "No. A piece gives what the crafting table gives per plank, rounded down and at least one, so cutting wood is never a way to get more out of it."
          - q: "Does it work in multiplayer?"
            a: "Yes, with Cassonade on the server, which provides the window and its recipes."
    - id: waystone
      title: "Waystone"
      shot_alt: "A waystone in a meadow: a stone monument two blocks high with purple veins, a pink cube floating and turning above it, written in strange letters"
      lead: "Fast travel, but only once you've “finished” the game."
      points:
        - "Right-click one, pick another, and you are there, in any dimension."
        - "Its recipe needs a chorus fruit, so it comes after reaching the End, and it only ever leads to another waystone."
        - "Name each one, and tell them apart in the list by the color and icon of their dimension."
      more_shots:
        - id: waystone-list
          alt: "A waystone's window: a box to name it, and the list of the others, tinted and with an icon for the Nether and the End"
      item:
        icon: waystone
        name: "Waystone"
        recipe: "World map + chorus fruit + 5 chiseled stone bricks"
        text: "A world map over five chiseled stone bricks, a chorus fruit on top, in a crafting table."
      detail:
        heading: "Waystones: fast travel between places you built, once you reach the End"
        intro: "Craft a waystone, place one wherever you keep coming back, and travel between them with a click. It takes a chorus fruit, so fast travel waits until the End, and it only ever takes you to another waystone."
        points:
          - "It stands two blocks high: a stone monument with a pink cube turning above it, written in the enchanting table's alphabet, drawing in particles."
          - "Right-click it to list the others, in every dimension, and click one to go there. You arrive at its foot."
          - "Yours are listed from the moment you place them; another player's once you have been near it."
          - "Name yours in their window, or at an anvil before placing them. Without a name, a waystone goes by its dimension and coordinates."
          - "In the list, each dimension has its icon, and the Nether and the End their color."
          - "With a world map or a compass worn, the same waystones show on the world map, on the minimap and, with a compass, in the world with their name: landmarks to find your way, not shortcuts, since a trip always starts from the block."
          - "A waystone with no free spot around it stops the trip, and one that was broken leaves the list."
        recipe:
          pattern: [" C ", "SMS", "SSS"]
          key:
            C: { icon: chorus_fruit, name: "Chorus Fruit" }
            M: { icon: world_map, name: "World Map" }
            S: { icon: chiseled_stone_bricks, name: "Chiseled Stone Bricks" }
          result: { icon: waystone, name: "Waystone" }
          text: "A world map in the middle, chiseled stone bricks on both sides of it and along the whole bottom row, and a chorus fruit on top."
        faq:
          - q: "How do I craft a waystone?"
            a: "Put a world map in the middle of a crafting table, chiseled stone bricks on both sides of it and along the bottom row, and a chorus fruit in the top middle: 5 bricks, 1 map, 1 fruit."
          - q: "Can I teleport anywhere with it?"
            a: "No: only to another waystone. You place both ends of every trip yourself."
          - q: "Does it cost anything to travel?"
            a: "No: the cost is crafting the waystones. Chorus fruit only grows in the End, so they come late in the game."
          - q: "Does it work between dimensions?"
            a: "Yes: the list shows the waystones of every dimension, and a click takes you there."
          - q: "Can other players use my waystones?"
            a: "Yes, once they have found them by going near: a waystone joins each player's list from then on. Only the player who placed a waystone can rename it."
          - q: "Does it work in multiplayer?"
            a: "Yes, with Cassonade on the server, which provides the block and keeps the list."
    - id: tweaks
      title: "Small tweaks"
      shot_alt: "Redstone dust in hand, and the power of the wire looked at, from 0 to 15"
      lead: "All the little things that annoyed me, fixed one by one."
      points:
        - "Redstone dust in hand shows a wire's power; a honeycomb or an axe shows whether copper is waxed."
        - "A renamed chest, barrel or Shulker box shows its name, a chiseled bookshelf the book in the slot you look at."
        - "Armor stands come with arms, and a water cauldron washes dyed blocks, hardens concrete and wipes maps, a whole stack at once."
        - "Renaming at the anvil is free."
      more_shots:
        - id: tweaks-copper
          alt: "Copper looked at with a honeycomb in hand, shown as waxed"
        - id: tweaks-chest
          alt: "A chest renamed at the anvil, its name shown when looked at"
        - id: tweaks-bookshelf
          alt: "A chiseled bookshelf with the title and enchantment of the book in the slot looked at"
        - id: tweaks-armor-stand
          alt: "An armor stand with arms, wearing armor"
      detail:
        heading: "Small tweaks: the everyday annoyances of Minecraft, fixed"
        intro: "All the little things that annoyed me: what the game never tells you, or makes you do the hard way. Each one works the way vanilla would, if it had thought of it."
        sections:
          - title: "What the game doesn't tell you"
            points:
              - "<strong>Redstone</strong>: with redstone dust in hand, look at a wire to see its power, from 0 to 15; at any other block, whether it is powered. Note blocks show their note, playing jukeboxes their song."
              - "<strong>Copper</strong>: with a honeycomb or an axe in hand, look at copper to see whether it is waxed."
              - "<strong>Chests, barrels and Shulker boxes</strong>: a renamed one shows its name when looked at. An item frame on a chest opens it; sneak to turn the item."
              - "<strong>Chiseled bookshelves</strong>: look at a slot to see the book's title, and its enchantments or author. A lectern shows the title and author of its book."
              - "<strong>Pistons, observers, dispensers, droppers and hoppers</strong>: in hand, a small dark cross framed by four corners shows the face of the block to come that will push, eject, pour or watch."
          - title: "Crafting and blocks"
            points:
              - "<strong>Water cauldrons</strong> wash dyed wool, carpets, beds, terracotta and glass, harden concrete powder and wipe filled maps blank: the whole stack for one level of water."
              - "<strong>Anvil</strong>: renaming is free."
              - "<strong>Furnaces</strong> show the experience they hold, in the “!” icon's tooltip."
              - "<strong>Recipes</strong>: a nether wart block crafts back into 9 nether wart, packed ice into 9 ice."
              - "<strong>Ender chests</strong> drop themselves with any pickaxe, no Silk Touch needed."
          - title: "Building and getting around"
            points:
              - "<strong>Armor stands</strong> are placed with arms, as in Bedrock; shears take them off, two sticks put them back. Alt and right-click with an empty hand to swap your armor with the stand's; sneak and right-click for the next of Bedrock's 13 poses."
              - "<strong>Flower pots</strong>: right-click a filled pot with another flower or sapling to swap them."
              - "<strong>Paintings</strong>: sneak and look at one with a painting in hand, or right after placing your last one, and the scroll wheel goes through all that fit."
              - "<strong>Bridging</strong>: sneak and aim at the far side of the block you stand on, and a block in hand goes in front of it."
              - "<strong>Your animals</strong>: a swing passes through your own wolf or horse and lands on what is behind it; sneak to hit them on purpose. Your dogs, cats and parrots go around fire instead of following you through it."
              - "<strong>Villagers</strong>: a button beside the trades turns you towards the block a villager works at and points it out."
              - "<strong>Name tags</strong>: a blank one silences a mob; use another on it to give it its voice back."
              - "<strong>Creepers</strong>: <code>/gamerule cassonade:spawn_creepers false</code> stops them from spawning, the other monsters unchanged; those already there stay, and a spawn egg still makes one."
              - "<strong>Snow</strong>: right-click with a shovel to take off one layer, for one snowball."
              - "<strong>Boats and minecarts</strong>: you get off beside them, on the free side closest to where you look."
              - "<strong>Cobwebs</strong> break at once, even by hand, and give their string."
              - "<strong>Nether portals</strong>: a frame of crying obsidian lights too, alone or mixed with obsidian."
          - title: "Enchantments and gear"
            points:
              - "<strong>Poison</strong> lasts half as long and hurts half as often, whatever gives it: a single potion no longer takes you down to half a heart."
              - "<strong>Netherite sword</strong>: 10 damage instead of 8, so most monsters fall in two hits."
              - "<strong>Netherite pickaxe</strong>: every deepslate block breaks as fast as stone, and at once with Efficiency V and Haste II."
            table:
              intro: "Every enchantment tops out at I, III or V: those that stopped at II go up to III, those that stopped at IV go up to V. Each new level adds as much as the ones before it, and comes from the enchanting table, villagers, loot and the anvil like the others. Damage reductions are per armor piece and add up, to the game's limit of 80 %."
              head: ["Enchantment", "Top level", "Each level", "At the new top level"]
              rows:
                - ["Protection", "IV → V", "−4 % damage", "−20 % per piece: four pieces reach the 80 % limit, instead of 64 %"]
                - ["Fire Protection", "IV → V", "−8 % fire and lava damage, −15 % burning time", "−40 % damage, −75 % burning time"]
                - ["Blast Protection", "IV → V", "−8 % explosion damage, −15 % explosion knockback", "−40 % damage, −75 % knockback"]
                - ["Projectile Protection", "IV → V", "−8 % projectile damage", "−40 %"]
                - ["Feather Falling", "IV → V", "−12 % fall damage", "−60 %"]
                - ["Breach", "IV → V", "The target's armor 15 % less effective", "75 % less effective"]
                - ["Piercing", "IV → V", "The arrow goes through one more mob", "Through 5 mobs"]
                - ["Knockback", "II → III", "One more step of push", "Three times the push of Knockback I"]
                - ["Punch", "II → III", "One more step of push for arrows", "Three times the push of Punch I"]
                - ["Fire Aspect", "II → III", "4 seconds of fire", "12 seconds"]
                - ["Frost Walker", "II → III", "Ice 1 block further around you, from 3 at level I", "5 blocks around you"]
          - title: "Writing and menus"
            points:
              - "<strong>Books</strong>: insert or delete a page anywhere while writing; Esc saves what you wrote."
              - "<strong>Signs</strong>: edit them with the mouse and arrows as in any text field; with nothing selected, copy and paste take the whole sign."
              - "<strong>Long signs</strong>: the word you are typing carries over to the next line when one is full."
              - "<strong>Menus</strong>: mouse button 4 goes back, like Esc, unless you bound it to something else."
        faq:
          - q: "How do I see a redstone wire's power?"
            a: "Hold redstone dust and look at the wire: its power, from 0 to 15, shows under the crosshair."
          - q: "How do I get an ender chest back without Silk Touch?"
            a: "Break it with any pickaxe: it drops itself instead of 8 obsidian."
          - q: "How do I harden a whole stack of concrete powder?"
            a: "Right-click a water cauldron with the stack: it all turns to concrete, for one level of water. The same click wipes filled maps blank."
          - q: "How do I stop creepers from spawning without turning off other monsters?"
            a: "Run <code>/gamerule cassonade:spawn_creepers false</code>. Zombies, skeletons and the rest keep spawning; creepers already in the world stay, and a spawn egg still makes one."
          - q: "Does it work in multiplayer?"
            a: "Yes, with Cassonade on the server for what the server knows or decides: wire power, chest names, bookshelf titles, cauldrons, paintings, snow, ender chests and creeper spawning. On a server without the mod, the game falls back to vanilla."
    - id: graphics
      title: "Light and sky"
      shot_alt: "A mine gallery seen down its length, timber frames and a track: a lantern on the floor lights it warm, a redstone torch tints a post red, a soul lantern glows blue-green further on, and amethyst lights the far end purple"
      lead: "The same blocks in a better light, and you don't need a shader pack: lights with a color, and a deeper sky."
      points:
        - "Each light tints what it lights with its own color: soul fire blue, redstone red, copper green, amethyst purple. Outdoors, the sun washes it out by day."
        - "A torch in hand lights up around you, as do torches dropped, held by others or burning mobs."
        - "The sky is a deep blue that pales towards the horizon, and distant land melts into it rather than into white."
      more_shots:
        - id: graphics-lichen
          alt: "A great dark cave at night, lit only by the pale green glow of its lichen on the far walls"
      detail:
        heading: "Light and sky: a better-looking Minecraft that stays vanilla"
        intro: "You don't need a shader pack or a texture pack: it's the game's own look, with lights that have a color and a sky with some depth. Nothing to install besides the mod, nothing to set up. The sea, with its horizon and its depths, has its own page."
        sections:
          - title: "Light"
            points:
              - "<strong>Colored lights</strong>: each light tints what it lights with its own color, soul fire blue, redstone red, copper torches green, amethyst and crying obsidian purple, sea lanterns pale blue, glow lichen pale green, lava orange, the waystone's crystal pink; a light carried in hand takes its color too, the sculk torch teal. The color goes where the light goes, never through walls; outdoors the sun washes it out by day; torches, lanterns and fire keep their warm light."
              - "<strong>A light in hand</strong>: a torch, a lantern or any light you hold lights up around you and follows you smoothly, as do torches dropped, held by other players or burning mobs."
          - title: "Sky"
            points:
              - "<strong>The sky</strong> is a deep blue overhead, paling towards the horizon, and distant land melts into the very sky behind it, orange beside a sunset and blue by day, rather than into white."
        faq:
          - q: "Is it a shader pack?"
            a: "No. It is the game's own rendering, adjusted: no Iris or OptiFine, and nothing to set up."
          - q: "Does it work with Sodium?"
            a: "Colored lights are turned off when Sodium is installed, as it draws the terrain its own way; lights then keep vanilla's warm glow."
          - q: "Does it work on a server without the mod?"
            a: "Yes: it all happens on your own computer, so it works anywhere."
    - id: interface
      title: "A refined interface"
      shot_alt: "Crafting table with the reworked recipe book, drawn as a leather-bound book with cream pages and tabs"
      lead: "This is the web designer in me: a cleaner, warmer look for every screen, still in Minecraft's style."
      points:
        - "Wood panels, dark slots and cream text across the HUD, the chat, inventories, buttons and tooltips."
        - "A recipe book that looks like a book, and an animated enchanting table book."
        - "A discreet “!” by the title of furnaces, grindstones, brewing stands and more shows what the window does not."
        - "While a world loads, its map draws itself, chunk by chunk."
      more_shots:
        - id: interface-info
          alt: "Furnace with the tooltip of its “!” icon: cooking time, what the fuel will still cook and the experience held"
        - id: interface-worlds
          alt: "World selection: the worlds on the left, the one selected on the right with a large icon, its game mode and difficulty, last session, time played and version"
        - id: interface-loading
          alt: "World loading screen: the explored map in sepia in a wooden frame, the chunks already loaded in full color around the player, a progress bar and a tip"
      detail:
        heading: "A cleaner, warmer Minecraft interface that stays vanilla"
        intro: "This is the web designer in me. I redrew the game's screens in one consistent style: sepia wood panels, dark slots and cream text, from the HUD to inventories, the chat and tooltips. Still Minecraft's pixel style, just more polished."
        points:
          - "Sepia wood panels, dark slots and cream text across the HUD, the chat, inventories, buttons and tooltips."
          - "The world softly blurred behind open windows, which rise gently into place as they open and sink back as they close."
          - "The chat framed in wood above the hearts, with its input field."
          - "Status effects framed in the top-right corner, each with its time left in a corner of the icon."
          - "<strong>Boss bars</strong>: wide and framed in dark iron between two skulls, they fill up as the boss shows up, leave the health just lost as a pale trail that drains away, and add up the damage you deal next to the boss's name."
          - "A recipe book that looks like a book, bound in leather, with cream pages and tabs."
          - "An animated book on the enchanting table, which shows every enchantment an option will give instead of “…?”."
          - "<strong>Title screen</strong>: the buttons in a column on the left, a small logo centered above them and discreet small, faded text at the bottom, over the panorama fading into shadow on that side."
          - "<strong>World selection</strong>: your worlds on the left, each with its icon, when you last played it and its game mode; the selected one on the right, with a large icon, its game mode and difficulty, the date of your last session, your time played and its version. The world you played last is selected when the screen opens."
          - "<strong>Server selection</strong>: in the same style, your servers on the left and the selected one on the right, with whether it answers, how many are playing, its ping and its version."
          - "<strong>Menus and dialogs</strong>: the other menus share that plain background, confirmations and server forms sit in a framed panel, and the death screen shows a skull above a panel gathering everything, over the red veil."
          - "Clickable labels in the journal and advancements books, styled to fit their pages."
          - "<strong>Fire and shields</strong>: the flames of a burning player stay in the lower part of the screen, and a raised shield sits lower, so the middle stays clear."
          - "<strong>The “!” icon</strong>: hover it, by the title of a window, for what vanilla hides. A furnace tells its cooking time, how many more items the fuel will cook and the experience it holds; a grindstone, the experience it will give back, as a range; a wandering trader's screen, how long they have left."
          - "<strong>World loading</strong>: while a world loads, in singleplayer or joining a server, the map draws itself. What you explored shows in sepia and comes into color chunk by chunk; land never seen is inked on blank paper. A progress bar and a tip about the mod sit underneath."
        faq:
          - q: "Does the loading screen slow down loading?"
            a: "No. It only shows the game's own loading and never makes it last longer. On a world already generated it can be over in a moment."
          - q: "Does Cassonade change the game's textures?"
            a: "No. Blocks, items and mobs look exactly as in vanilla: only windows, buttons, tooltips, the chat and the mod's own panels change."
          - q: "Why does the enchanting table show every enchantment?"
            a: "Vanilla shows one enchantment, then “…?”. Cassonade shows every enchantment the option will give, computed the same way as the server, so you know what you pay for."

