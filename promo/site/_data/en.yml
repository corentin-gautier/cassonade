never:
  heading: "What I will never add"
  items:
    - "New ores, metals or gear tiers"
    - "Magic, machines or tech trees"
    - "New mobs, biomes or dimensions"
    - "Anything that makes the game easier to beat rather than nicer to play (a better reward late in the game, yes; a shortcut early on, no)"

install:
  heading: "Install"
  steps:
    - "Install the <a href=\"https://fabricmc.net/use/\" rel=\"noopener\" target=\"_blank\">Fabric Loader</a> for Minecraft 26.3."
    - "Download <a href=\"https://www.curseforge.com/minecraft/mc-mods/fabric-api\" rel=\"noopener\" target=\"_blank\">Fabric API</a> and Cassonade."
    - "Put both <code>.jar</code> files in the <code>mods</code> folder of your Minecraft directory."
    - "Launch the game with the Fabric profile."
  requires: "Requires"
  multiplayer: "On a server, install the mod on the server and on every player's game. In singleplayer, there's nothing else to do."

faq:
  heading: "Questions"
  items:
    - q: "What is Cassonade?"
      a: "A free, open-source vanilla+ Fabric mod for Minecraft 26.3 that does three things. It gathers quality-of-life (QoL) features: a backpack, a compass minimap, a world map with markers, inventory sorting, right-click harvest, a quest journal and dozens of small fixes. It makes the world feel alive, with birds, sounds, colored lights and a real sea. And it gives you more to find out there: towns, taverns, furnished mansions and hidden treasures. I made it to replace a whole stack of mods with one consistent mod that still feels like vanilla Minecraft."
    - q: "Does Cassonade change Minecraft's progression?"
      a: "No. There are no new resources, tiers or dimensions, and every feature is unlocked by equipping a vanilla item or one crafted from vanilla items. You still mine, build, explore and fight the same way."
    - q: "Does it work in multiplayer?"
      a: "Yes. Install it on the server and on each player's game. On a server without the mod, the game stays playable and everything that happens on your screen still works: the living world, the lights, the interface, inventory tooltips and conveniences. But the equipment slots are not offered, so nothing worn works (backpack, minimap, world map, clock, elytra slot, combat awareness), and the mod's items, recipes, structures and rules are not there."
    - q: "Which versions are supported?"
      a: "Minecraft 26.3 with Fabric Loader 0.20.1 or later, Fabric API and Java 25. Forge and NeoForge are not supported."
    - q: "Can I turn features off?"
      a: "There's no settings screen, on purpose: each feature works one way, close to vanilla, so there's nothing to tune. Features you don't equip stay hidden: no compass, no minimap. Key bindings live in Options → Controls → Cassonade, and display choices (map rotation, markers, quest tracker) are remembered."
    - q: "Can I use it in my modpack?"
      a: "Yes. Cassonade is released under the GPL-3.0: you can ship it in a modpack, and change it or reuse its code as long as your version stays under the GPL-3.0, credits its author and publishes its source."

