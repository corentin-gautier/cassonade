  key: "Key"
  action: "Action"
  needs: "Needs"
  needs_label: "Needs:"
  always: "Anytime"
  # The item each group of keys needs, drawn beside its name
  icons:
    "Backpack": backpack
    "World map": world_map
    "Compass": compass
  rows:
    - key: "<kbd>B</kbd>"
      action: "Open / close the backpack"
      needs: "Backpack"
    - key: "<kbd>M</kbd>"
      action: "Open the world map"
      needs: "World map"
    - key: "<kbd>Space</kbd>"
