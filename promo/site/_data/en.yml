install:
  heading: "Install"
  steps:
    - "Install the <a href=\"https://fabricmc.net/use/\" rel=\"noopener\" target=\"_blank\">Fabric Loader</a> for Minecraft 26.3."
    - "Download <a href=\"https://modrinth.com/mod/fabric-api\" rel=\"noopener\" target=\"_blank\">Fabric API</a> and Cassonade."
    - "Put both <code>.jar</code> files in the <code>mods</code> folder of your Minecraft directory."
    - "Launch the game with the Fabric profile."
  requires: "Requires"
  multiplayer: "On a server, install the mod on the server and on every player's game. In singleplayer, there is nothing else to do."

faq:
  heading: "Questions"
  items:
    - q: "What is Cassonade?"
      a: "A free, open-source Fabric mod for Minecraft 26.3 that gathers quality-of-life (QoL) features in one vanilla+ mod: a backpack, a compass minimap, a world map with waypoints, inventory sorting, right-click harvest, a quest journal and dozens of small fixes. It replaces a stack of separate QoL mods with one consistent mod that still feels like vanilla Minecraft."
    - q: "Does Cassonade change Minecraft's progression?"
      a: "No. There are no new resources, tiers or dimensions, and every feature is unlocked by equipping a vanilla item or one crafted from vanilla items. You still mine, build, explore and fight the same way."
    - q: "Does it work in multiplayer?"
      a: "Yes. Install it on the server and on each player's game. On a server without the mod, some features have less to show: no weather forecast, no list of mobs chasing you, and the vanilla enchanting and advancement information."
    - q: "Which versions are supported?"
      a: "Minecraft 26.3 with Fabric Loader 0.20.1 or later, Fabric API and Java 25. Forge and NeoForge are not supported."
    - q: "Can I turn features off?"
      a: "There is no settings screen, on purpose: each feature works one way, close to vanilla, so there is nothing to tune. Features you don't equip stay hidden: no compass, no minimap. Key bindings live in Options → Controls → Cassonade, and display choices (map rotation, waypoints, quest tracker) are remembered."
    - q: "Can I use it in my modpack?"
      a: "Yes. Cassonade is released under the GPL-3.0: you can ship it in a modpack, and change it or reuse its code as long as your version stays under the GPL-3.0, credits its author and publishes its source."

