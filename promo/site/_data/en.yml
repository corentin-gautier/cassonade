  item: "Item"
  vanilla: "Vanilla"
  mod: "Cassonade"
  rows:
    - item: "Buttons"
      vanilla: "1 block → 1"
      mod: "1 block → 16"
    - item: "Pressure plates"
      vanilla: "2 blocks → 1"
      mod: "2 blocks → 16"
    - item: "Wooden trapdoors"
      vanilla: "6 planks → 2"
      mod: "6 planks → 24"
    - item: "Sticks"
      vanilla: "2 planks → 4"
      mod: "2 planks → 32"
    - item: "Ladders"
      vanilla: "7 sticks → 3"
      mod: "7 sticks → 8"
    - item: "Stairs"
      vanilla: "6 blocks → 4"
      mod: "6 blocks → 8"
    - item: "Wood (bark)"
      vanilla: "4 logs → 3"
      mod: "4 logs → 4"
    - item: "Signs"
      vanilla: "6 planks + 1 stick → 3"
      mod: "6 planks + 1 stick → 12"
    - item: "Wooden doors"
      vanilla: "6 planks → 3"
      mod: "6 planks → 12"
    - item: "Bowls"
      vanilla: "3 planks → 4"
      mod: "3 planks → 12"
    - item: "Paper"
      vanilla: "3 sugar cane → 3"
      mod: "3 sugar cane → 6"
    - item: "Chests"
