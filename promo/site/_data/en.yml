      time: "06:00"
      alt: "A birch forest at dawn, the far trees fading into a light mist"
      title: "Morning mist"
      text: "Some mornings start in a light mist that fades with the sun, the far trees melting into it."
      sounds:
        - "Robin sings"
        - "Cuckoo calls"
        - "Fish splashes"
    - id: ambience
      time: "08:00"
      alt: "A flock of geese flying in a V across a clear blue sky, seen from the ground"
      title: "Flocks in the sky"
      text: "Geese in a V, black crows, white gulls near the coast, calling as they pass. Very rarely, a great cloud of starlings."
