why:
  heading: "Toujours Minecraft. Les petits tracas en moins."
  intro: "La plupart des modpacks « confort » empilent des dizaines de mods, chacun avec son style et ses options, ou transforment le jeu en autre chose. Cassonade est un seul mod, construit sur une seule règle : si Mojang pouvait le sortir dans une mise à jour demain, il a sa place ici. S'il change la façon de jouer, non."
  items:
    - title: "La même progression"
      text: "Pas de nouvelles ressources, de nouveaux paliers ni de nouvelles dimensions. Chaque outil se débloque en équipant un objet que vous connaissez déjà (un compas, une montre) ou fabriqué à partir d'objets vanilla (un sac à dos, une carte du monde, un baromètre)."
    - title: "Chaque petit agacement, corrigé"
      text: "Les feuilles qui mettent des minutes à disparaître, « Trop cher ! », les bateaux bloqués par un pixel, le « … ? » de la table d'enchantement : chaque correction est petite, ensemble elles changent la sensation de jeu."
    - title: "Comme si ça avait toujours été là"
      text: "L'interface garde le style pixel et les sons de Minecraft. Chaque outil n'apparaît qu'une fois son objet équipé, et toutes les touches se changent."
    - title: "Un monde qui vit"
      text: "Des oiseaux traversent le ciel, les vagues se brisent sur le rivage, les grillons chantent au fil des nuits chaudes. Rien à combattre, à ramasser ni à fabriquer : seulement ce qui rend un lieu habité."
    - title: "Un seul style, pas de jungle d'options"
      text: "Un modpack assemblé à partir d'une dizaine de mods, c'est une dizaine de styles et des options éparpillées dans autant d'écrans de configuration. Cassonade a le même style partout et, volontairement, rien à configurer : chaque fonction marche d'une seule façon, au plus près du vanilla, et c'est tout."

compare:
  heading: "Ce que Cassonade corrige"
  intro: "Chaque moment tel que vous le connaissez en vanilla, et le même avec Cassonade."
  vanilla: "Vanilla"
  mod: "Avec Cassonade"
  groups:
    - title: "Rangement et objets"
      rows:
        - topic: "Plus de blocs en main"
          vanilla: "Ouvrir l'inventaire, en chercher"
          mod: "La main se remplit depuis l'inventaire"
        - topic: "Coffres en désordre"
          vanilla: "Trier à la main"
          mod: "Un clic pour trier, un clic pour ranger"
        - topic: "Trier avec des entonnoirs"
          vanilla: "Trieur en redstone"
          mod: "Un filtre dans chaque entonnoir"
        - topic: "Un panneau sur un coffre"
          vanilla: "Un clic modifie le panneau"
          mod: "Un clic ouvre le coffre"
        - topic: "Un cadre sur un coffre"
          vanilla: "Un clic tourne l'objet"
          mod: "Un clic ouvre le coffre"
        - topic: "Coffres renommés"
          vanilla: "Le nom ne s'affiche qu'à l'ouverture"
          mod: "Il suffit de le regarder : son nom s'affiche"
        - topic: "Coffres de l'Ender"
          vanilla: "Toucher de soie, ou 8 obsidiennes"
          mod: "Se récupèrent avec n'importe quelle pioche"
    - title: "Fabrication et stations de travail"
      rows:
        - topic: "Réparer à l'enclume"
          vanilla: "« Trop cher ! »"
          mod: "Toute réparation que vous pouvez payer"
        - topic: "Renommer à l'enclume"
          vanilla: "Coûte des niveaux, même sans autre opération"
          mod: "Gratuit si l'on ne fait que renommer"
        - topic: "Table d'enchantement"
          vanilla: "Un enchantement, puis « … ? »"
          mod: "Tous les enchantements de l'option"
        - topic: "Raccommodage et Infinité"
          vanilla: "Incompatibles sur un arc"
          mod: "Compatibles"
        - topic: "Niveaux d'enchantement"
          vanilla: "Certains plafonnent à II ou IV"
          mod: "Tous plafonnent à I, III ou V"
        - topic: "Fourneaux"
          vanilla: "Regarder la flèche se remplir"
          mod: "Une seule ligne discrète : le temps restant, ce que le combustible cuira encore, et l'expérience qu'il contient"
        - topic: "Meule"
          vanilla: "L'expérience rendue est une surprise"
          mod: "Affichée avant de prendre l'objet"
        - topic: "Scier les planches"
          vanilla: "Seulement l'établi, quelques pièces à la fois"
          mod: "Un tailleur de bois, lingot de fer sur trois planches : escaliers, dalles, barrières et plus, dans la fenêtre du tailleur de pierre aux tons bois"
        - topic: "Fabriquer 64 boutons"
          vanilla: "64 blocs"
          mod: "4 blocs (des recettes aux quantités justes)"
        - topic: "Blocs de verrues du Nether et glace compactée"
          vanilla: "Pas de retour possible"
          mod: "Se refabriquent en 9 verrues du Nether, ou 9 glaces"
        - topic: "Laine, tapis, lits, terre cuite et verre teints"
          vanilla: "Teints pour toujours"
          mod: "Lavés dans un chaudron d'eau, une pile entière pour un niveau d'eau"
        - topic: "Béton en poudre"
          vanilla: "Le poser près de l'eau, bloc par bloc"
          mod: "Durci dans un chaudron d'eau, une pile entière pour un niveau d'eau"
        - topic: "Cartes remplies"
          vanilla: "Dessinées pour toujours"
          mod: "Effacées dans un chaudron d'eau, pour un niveau d'eau"
    - title: "Nature et temps qui passe"
      rows:
        - topic: "Couper un arbre"
          vanilla: "Les feuilles disparaissent une à une pendant des minutes"
          mod: "Les feuilles tombent aussitôt, avec leur butin"
        - topic: "Passer sous les arbres"
          vanilla: "Feuilles à hauteur de tête"
          mod: "Troncs plus hauts, deux blocs d'air entre le sol et les feuilles"
        - topic: "Récolter les cultures"
          vanilla: "Casser, ramasser, replanter"
          mod: "Clic droit : récolté et replanté"
        - topic: "Composteur"
          vanilla: "1 poudre d'os, après une attente"
          mod: "8 poudres d'os, aussitôt"
        - topic: "Terre labourée"
          vanilla: "Redevient de la terre quand on saute dessus"
          mod: "Les joueurs ne la piétinent plus, à pied ou à cheval"
        - topic: "Tableaux"
          vanilla: "Un au hasard, le plus grand qui rentre"
          mod: "Accroupi, la molette fait défiler tous ceux qui rentrent"
        - topic: "Neige"
          vanilla: "La casser, toutes les couches d'un coup"
          mod: "Clic droit avec une pelle : une couche part, pour une boule de neige"
        - topic: "La journée"
          vanilla: "10 minutes, puis la nuit tombe"
          mod: "20 minutes, la nuit ne change pas"
        - topic: "Aller au lit"
          vanilla: "5 secondes pour passer la nuit"
          mod: "2,5 secondes"
        - topic: "Buissons de baies sucrées"
          vanilla: "Les épines blessent à travers toute armure"
          mod: "Jambières et bottes les arrêtent"
        - topic: "Votre lit"
          vanilla: "Les villageois se l'approprient et y dorment"
          mod: "Ils laissent celui où vous réapparaissez"
        - topic: "Golems de fer et feu"
          vanilla: "Ils le traversent et brûlent"
          mod: "Ils le contournent"
        - topic: "Vos chiens, chats et le feu"
          vanilla: "Ils vous suivent à travers et brûlent"
          mod: "Ils le contournent"
        - topic: "Abeilles et mer"
          vanilla: "Elles se perdent au large, pour de bon"
          mod: "Elles font demi-tour au rivage"
        - topic: "La mer au loin"
          vanilla: "Soleil et algues se voient à travers l'eau lointaine"
          mod: "Un horizon net, des profondeurs troubles et sombres"
        - topic: "Déplacer des villageois"
          vanilla: "Bateaux, rails, pièges"
          mod: "Une laisse"
        - topic: "Marchands ambulants"
          vanilla: "Leur départ est une surprise"
          mod: "Leur interface d'échange indique le temps restant"
    - title: "Construction et décoration"
      rows:
        - topic: "Portes doubles"
          vanilla: "Ouvrir chaque porte"
          mod: "Les deux s'ouvrent ensemble"
        - topic: "Échelles"
          vanilla: "Posées une à une, depuis le bas"
          mod: "Un clic sur une échelle : elle monte, ou descend en regardant vers le bas"
        - topic: "Cadres"
          vanilla: "Le cadre se voit toujours"
          mod: "Des cisailles cachent le cadre, l'objet reste au mur"
        - topic: "Porte-armures"
          vanilla: "Une pièce à la fois"
          mod: "Alt-clic : toute votre armure s'échange avec la sienne ; accroupi-clic : la pose suivante"
        - topic: "Bras des porte-armures"
          vanilla: "Seulement avec des commandes"
          mod: "Posés avec des bras ; les cisailles les retirent, deux bâtons les remettent"
    - title: "Lire le monde"
      rows:
        - topic: "Livres dans une bibliothèque sculptée"
          vanilla: "Sortir un livre pour lire son titre"
          mod: "Regarder sa case pour voir son titre, avec ses enchantements ou son auteur"
        - topic: "Livre sur un pupitre"
          vanilla: "L'ouvrir pour savoir lequel c'est"
          mod: "Regarder le pupitre pour voir son titre et son auteur"
        - topic: "Blocs musicaux"
          vanilla: "Compter les clics pour connaître la note"
          mod: "Il suffit de le regarder : sa note s'affiche"
        - topic: "Juke-box"
          vanilla: "Le morceau ne s'affiche qu'au lancement"
          mod: "Il suffit de le regarder : son morceau s'affiche"
        - topic: "Redstone"
          vanilla: "Deviner la puissance d'un fil à sa lueur"
          mod: "Redstone en main : la puissance d'un fil, si un bloc est alimenté"
        - topic: "Cuivre ciré"
          vanilla: "Identique au cuivre non ciré"
