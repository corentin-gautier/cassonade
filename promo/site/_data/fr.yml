          mod: "Deux fois moins long, deux fois moins souvent"
        - topic: "Épée en netherite"
          vanilla: "Trois coups pour la plupart des monstres"
          mod: "Deux coups"
        - topic: "Pioche en netherite sur l'ardoise des abîmes"
          vanilla: "Plus lente que sur la pierre"
