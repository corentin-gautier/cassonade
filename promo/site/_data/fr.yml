    - title: "Aventure et combat"
      rows:
        - topic: "Villages"
          vanilla: "Tous à peu près de la même taille"
          mod: "De temps en temps, un bourg : un village trois fois plus grand"
        - topic: "Maisons des villages"
          vanilla: "Fondations, murs et puits en pierre"
          mod: "Surtout des pierres taillées, certaines moussues ou fissurées"
        - topic: "Églises des villages"
          vanilla: "Une église et son clocher, un alambic pour le prêtre"
          mod: "Une taverne derrière sa tour : bar et tonneaux, tables, cheminée, et le tavernier à l'alambic"
