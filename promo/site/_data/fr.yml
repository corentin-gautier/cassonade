          text: "Un lingot de fer au-dessus de trois planches de n'importe quel bois, sur un établi."
        faq:
          - q: "Comment fabriquer le tailleur de bois ?"
            a: "Posez un lingot de fer au-dessus de trois planches de n'importe quel bois sur un établi."
