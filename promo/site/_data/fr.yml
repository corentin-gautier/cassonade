features:
  heading: "Fonctionnalités"
  intro: "Tout ce que Cassonade ajoute, une chose après l'autre."
  groups:
    - title: "Porter et ranger"
      ids: [backpack, inventory, hopper]
    - title: "Explorer et s'orienter"
      ids: [minimap, worldmap, clock, waystone, spyglass, elytra]
    - title: "Jouer à sa façon"
      ids: [quests, combat, torch, harvest, woodcutter]
    - title: "Le confort au quotidien"
      ids: [tweaks, interface, graphics]
  items:
    - id: backpack
      title: "Sac à dos"
      shot_alt: "Inventaire de Minecraft avec le sac à dos de Cassonade ouvert à côté, un panneau en cuir rempli d'objets, près des emplacements d'équipement en plus"
      lead: "54 emplacements de plus, en cuir, ficelle et bundle."
      points:
        - "Porté dans son propre slot, il s'ouvre par un onglet en haut de l'inventaire, dans un panneau en cuir à la place du livre de recettes."
        - "54 piles, autant qu'un grand coffre. Comme une boîte de Shulker, il garde son contenu posé dans un coffre ou jeté au sol."
        - "Un clic avec Maj envoie les objets directement dans le sac ouvert."
      item:
        icon: backpack_upgrade_smithing_template
        name: "Amélioration de sac à dos"
        recipe: "Modèle + Sac à dos + Entonnoir, à la table de forgeron"
        text: "Un modèle rare, dans les coffres des cités antiques, des trésors de bastions et des cités de l'End, et dans les tonneaux des manoirs. Le sac à dos organisé qu'il donne remplit votre main, prête son contenu au livre de recettes et complète ses propres piles avec ce que vous ramassez."
      keys: "B l'ouvre et le ferme"
      detail:
        heading: "Un sac à dos pour Minecraft en survie, fabriqué avec des objets vanilla"
        intro: "Cassonade ajoute un sac à dos à Minecraft : 54 emplacements de plus, autant qu'un grand coffre, porté dans son propre slot d'équipement et fabriqué avec du cuir, de la ficelle et un bundle. Pas de nouvelle ressource, pas de nouveau palier, juste de la place pour ce que vous transportez."
        points:
          - "Fabriquez-le avec 4 cuirs, 4 ficelles et un bundle, puis portez-le dans son slot d'équipement : Maj + clic dessus dans l'inventaire."
          - "Ouvrez-le avec B ou par l'onglet en haut de l'inventaire. Il s'ouvre dans un panneau en cuir, à la place du livre de recettes ; ouvrir l'un ferme l'autre."
          - "54 emplacements, autant qu'un grand coffre."
          - "Sac ouvert, Maj + clic envoie les objets directement dedans. Les armures et les boucliers vont toujours d'abord dans leurs slots."
          - "Comme une boîte de Shulker, il garde son contenu posé dans un coffre ou jeté au sol. Ni un sac à dos ni une boîte de Shulker ne rentrent dans un sac à dos."
          - "À la mort, il tombe comme le reste de l'inventaire, sauf si keepInventory est activé."
          - "Un modèle de forge rare, dans les coffres des cités antiques, des trésors de bastions et des cités de l'End, et dans les tonneaux des manoirs, l'améliore à la table de forgeron avec un entonnoir : le sac à dos organisé remplit votre main, prête son contenu au livre de recettes et complète ses propres piles avec ce que vous ramassez."
        recipe:
          pattern: ["SLS", "SBS", "LLL"]
          key:
            S: { icon: string, name: "Ficelle" }
            L: { icon: leather, name: "Cuir" }
            B: { icon: bundle, name: "Bundle" }
          result: { icon: backpack, name: "Sac à dos" }
          text: "4 cuirs, 4 ficelles et un bundle, sur un établi. La recette apparaît dans le livre de recettes."
        faq:
          - q: "Comment fabriquer le sac à dos ?"
            a: "Posez un bundle au centre d'un établi, de la ficelle de chaque côté et dans les deux coins du haut, et du cuir au milieu du haut et sur toute la rangée du bas : 4 cuirs, 4 ficelles et un bundle en tout."
          - q: "Comment ouvrir le sac à dos ?"
            a: "Portez-le dans son slot d'équipement (Maj + clic dessus dans l'inventaire), puis appuyez sur B ou cliquez sur l'onglet du sac en haut de l'inventaire. La touche se change dans Options → Commandes → Touches → Cassonade."
          - q: "Est-ce que je perds mon sac à dos en mourant ?"
            a: "Il tombe là où vous êtes mort, avec tout son contenu, comme le reste de l'inventaire. Avec keepInventory activé, vous le gardez."
          - q: "Le sac à dos marche-t-il en multijoueur ?"
            a: "Oui, si le serveur a aussi Cassonade. Un serveur sans le mod n'a nulle part où garder les slots en plus : le sac à dos n'y est pas proposé."
    - id: ambience
      title: "Un monde qui vit"
      shot_alt: "Un vol d'oies en V traversant un ciel bleu dégagé, vu depuis le sol"
      lead: "Le monde de Minecraft est superbe, et étrangement vide. Désormais, il s'y passe toujours quelque chose."
      points:
        - "Des vols traversent le ciel le jour : oies en V ou en groupe lâche, corbeaux noirs, mouettes blanches près des côtes, oies et mouettes criant à leur passage. Très rarement, en fin de journée, un grand nuage d'étourneaux."
        - "Rouges-gorges et coucous chantent parmi les arbres, les chouettes hululent dans la forêt la nuit, les grenouilles emplissent les marais dès le crépuscule, et un loup solitaire hurle au loin les nuits de pleine lune."
        - "Les papillons volettent autour des fleurs, le pollen flotte sur l'herbe, la poussière tombe du plafond des grottes."
        - "Une voie lactée discrète tourne au-dessus de vous, des étoiles filantes la traversent, des aurores illuminent les nuits enneigées, et certains matins commencent dans la brume."
      more_shots:
        - id: ambience-night
          alt: "La voie lactée, bande discrète haut dans le ciel de nuit, au-dessus d'une plaine dégagée aux herbes fleuries"
        - id: ambience-mist
          alt: "Une forêt de bouleaux à l'aube, les arbres lointains s'effaçant dans une brume légère"
        - id: ambience-butterfly
          alt: "Une plaine fleurie en plein jour, du pollen dans l'air et un papillon parmi les fleurs"
      detail:
        heading: "Un monde qui vit : oiseaux, papillons, aurores et brume du matin dans Minecraft"
        intro: "Rien à combattre, à ramasser ou à fabriquer : seulement ce qui donne à un lieu l'air d'être habité. Tout se passe autour de vous, et rien de tout cela ne change le jeu."
        sections:
          - title: "Dans le ciel"
            points:
              - "<strong>Vols d'oiseaux</strong> : ils traversent le ciel par jour clair, plusieurs à la fois et à des hauteurs très variées : oies en V ou en groupe lâche, quelques corbeaux noirs, et des mouettes blanches parmi eux à l'approche des côtes. Ils suivent leur route sans vous suivre."
              - "<strong>Étourneaux</strong> : très rarement, dans la dernière heure d'une journée claire, un nuage de centaines d'oiseaux se plie et enfle dans le ciel pendant environ une minute, puis repart."
              - "<strong>Voie lactée</strong> : une bande discrète dans la nuit, placée et formée comme la vraie, avec son cœur brillant et sa zone sombre. Elle tourne avec les étoiles."
              - "<strong>Aurores</strong> : vertes et violettes, elles apparaissent au nord une nuit claire sur deux au-dessus des terres enneigées."
              - "<strong>Étoiles filantes</strong> : elles traversent le ciel de temps en temps par nuit claire."
              - "<strong>Éclairs de chaleur</strong> : certains soirs chauds, ils scintillent en silence, bas sur l'horizon."
          - title: "Dans l'air"
            points:
              - "<strong>Papillons</strong> : ils volettent autour des fleurs près de vous par jour clair."
              - "<strong>Pollen</strong> : il flotte le jour autour de l'herbe et des arbres, mêlé à une poussière sèche en savane."
              - "<strong>Champs de champignons</strong> : des plantes qu'on ne trouve nulle part ailleurs poussent sur le mycélium, pousses de spores aux pointes turquoise et luisecaps, rouges comme les champignons du biome, qui éclairent la nuit de leur couleur ; des spores montent du sol, de jour comme de nuit, et luisent faiblement dans le noir, et çà et là les champignons poussent en ronds de sorcière."
              - "<strong>Poussière</strong> : elle tombe lentement du plafond des grottes, où vos torches l'éclairent."
              - "<strong>Buée</strong> : dans le froid des terres enneigées, joueurs et villageois soufflent de petits nuages."
              - "<strong>Poissons</strong> : à l'aube et au crépuscule, ils sautent hors des lacs et des rivières, avec une éclaboussure à chaque passage, d'autant plus forte qu'ils sont proches."
              - "<strong>Cascades</strong> : elles éclaboussent là où elles retombent, sur le sol ou dans un bassin, d'autant plus fort qu'elles tombent de haut, avec un peu de brume au pied des plus hautes."
              - "<strong>Brume du matin</strong> : de temps en temps, environ un matin sur huit, le paysage s'éveille dans une brume qui cache le ciel et le lointain, puis se lève avec le soleil, plus fine en altitude et absente sous terre."
              - "<strong>En altitude</strong>, des particules emportées par le vent filent devant vous."
              - "<strong>La pluie</strong> tombe en traits gris pâle, couleur d'eau, et non plus bleus."
              - "<strong>Après la pluie</strong>, les arbres gouttent encore une minute, de chaque feuille que la pluie a touchée."
          - title: "Ce que vous entendez"
            points:
              - "<strong>Sous l'eau</strong>, les sons deviennent étouffés et plus faibles tant que votre tête est immergée, semblent venir de partout, ceux du dessus de l'eau s'estompent, et seule une grotte noyée ou un plafond de blocs leur donne un écho sourd ; la musique et les menus restent nets."
              - "<strong>Oies et mouettes</strong> : elles crient au passage d'un vol, plus fort s'il est proche, et un vol très haut passe en silence."
              - "<strong>Rouges-gorges</strong> : ils chantent le jour parmi les arbres des terres tempérées, certains tout près et d'autres au loin, rejoints par les <strong>coucous</strong> en forêt."
              - "<strong>Chouettes</strong> : elles hululent la nuit en forêt."
              - "<strong>Un loup</strong> : les nuits de pleine lune, dans la taïga, un loup solitaire hurle au loin, de loin en loin."
              - "<strong>Tonnerre</strong> : il arrive après l'éclair, d'autant plus tard et plus sourd que la foudre est tombée loin."
              - "<strong>La pluie sur le toit</strong> : sous un toit, la pluie et le tonnerre sont étouffés ; les feuilles ne font pas un toit."
              - "<strong>Les grottes</strong> renvoient chaque son en écho, bref dans un passage, long dans une grande salle."
              - "<strong>Vagues</strong> : leur son vous entoure à l'approche d'un rivage, grondement sourd de loin, net au bord de l'eau, où une ligne d'écume monte sur le rivage à chaque vague et où l'eau éclabousse en se brisant. En haute mer, loin de tout rivage, reste une houle discrète."
              - "<strong>Grenouilles</strong> : elles coassent tout autour dans les marais, du crépuscule à l'aube."
              - "<strong>Grillons</strong> : ils chantent au fil des nuits chaudes, et les <strong>criquets</strong> le jour dans les savanes."
          - title: "Et les abeilles"
            points:
              - "<strong>Abeilles</strong> : elles sont dessinées plus petites, adultes comme bébés, plus proches de la taille d'une vraie à côté d'une fleur."
        faq:
          - q: "Est-ce que ça change la façon de jouer ?"
            a: "Non. Oiseaux et papillons ne sont que des images, sans rien derrière : on ne peut ni les toucher, ni les chasser, ni les blesser, et ils ne laissent rien tomber. La brume ne cache jamais le chemin."
          - q: "Est-ce que ça marche sur un serveur sans le mod ?"
            a: "Oui : tout se passe sur votre ordinateur, donc partout. Chaque joueur voit ses propres vols."
          - q: "Puis-je baisser le volume des sons ?"
            a: "Oui : ils suivent tous le curseur Ambiance/Environnement du jeu, dans les options Musique et sons."
    - id: minimap
      title: "Mini-map au compas"
      shot_alt: "Mini-map au compas en haut à droite de l'écran, avec le biome, les coordonnées et un marqueur « Farm » affiché dans le village"
      lead: "Équipez un compas pour savoir où vous êtes."
      points:
        - "Une mini-map en haut à droite, aux couleurs des cartes vanilla, de 32 à 256 blocs de côté."
        - "Le biome et les coordonnées juste en dessous ; nord en haut ou carte qui tourne avec le joueur."
        - "Une bande de direction qui montre où sont vos marqueurs et nomme celui que vous visez, et chacun dans le monde, à travers le relief, une fois proche. Dans le Nether, la carte montre le sol où vous êtes, pas le plafond de bedrock."
      keys: "+ / − zoom · R orientation · N marqueurs"
      detail:
        heading: "Une mini-map pour Minecraft, débloquée par un compas"
        intro: "Équipez un compas et Cassonade dessine une mini-map en haut à droite de l'écran, aux couleurs des cartes vanilla, avec le biome et vos coordonnées en dessous. Pas de compas, pas de mini-map : l'écran reste aussi épuré qu'en vanilla."
        points:
          - "Équipez un compas dans le slot du compas, au-dessus de la main secondaire : la mini-map apparaît en haut à droite."
          - "+ et − zooment de 32 à 256 blocs de côté."
          - "Le biome où vous êtes et vos coordonnées sont écrits en dessous."
          - "Le bouton « N » à côté de la mini-map, ou R, passe du nord en haut à une carte qui tourne avec vous."
          - "H range la mini-map, avec le biome et les coordonnées, et la fait revenir ; la barre de direction et les points de repère restent."
          - "Une bande de direction en haut de l'écran montre vos marqueurs et nomme celui que vous visez, avec sa distance ; elle s'efface devant les barres de boss pendant un combat. À moins de 32 blocs, un marqueur s'affiche aussi dans le monde, à travers le relief, avec son nom et sa distance, pour voir à quelle hauteur il est. N passe de la bande à masqué, puis à tous dans le monde ; maintenir V les montre tous dans le monde un instant."
          - "Dans le Nether, la carte montre le sol où vous êtes, pas le plafond de bedrock. Au fond d'une grotte, elle montre la grotte autour de vous plutôt que la surface loin au-dessus, jusqu'à son plafond dans une grotte haute."
          - "Le zoom, l'orientation, le masquage et l'affichage des marqueurs sont gardés d'une partie à l'autre."
        faq:
          - q: "Faut-il un compas pour voir la mini-map ?"
            a: "Oui : la mini-map s'affiche tant qu'un compas, ou un compas sculk, est équipé dans son slot. Retirez-le et l'écran redevient vanilla."
          - q: "La mini-map marche-t-elle dans le Nether ?"
            a: "Oui. Elle montre le sol où vous êtes plutôt que le plafond de bedrock : les tunnels et les lacs de lave autour de vous restent lisibles."
          - q: "La mini-map montre-t-elle les grottes ?"
            a: "Oui : au fond d'une grotte, loin de la lumière du jour, elle montre le sol de la grotte autour de vous, comme dans le Nether, et de nouveau la surface une fois sorti."
          - q: "Comment ajouter un marqueur ?"
            a: "Les marqueurs se posent sur la carte du monde : clic droit n'importe où, puis un nom et l'une des 16 couleurs de teinture. Le marqueur s'affiche ensuite sur la mini-map et dans le monde."
          - q: "Les touches marchent-elles sur un clavier AZERTY ?"
            a: "Oui. Les lettres, + et − suivent le caractère imprimé sur votre clavier, et chaque touche se change dans Options → Commandes → Touches → Cassonade."
    - id: worldmap
      title: "Carte du monde et marqueurs"
      shot_alt: "Carte du monde en plein écran des terres explorées autour d'un village, avec les rivières, le brouillard de guerre et les marqueurs Tower, Farm et Mine"
      lead: "Chaque chunk exploré, sur une seule carte."
      points:
        - "Fabriquez une carte du monde avec une carte vierge et huit bâtons, équipez-la, et ouvrez en plein écran tout ce que vous avez parcouru, sous un brouillard de guerre."
        - "Maintenez Maj en survolant un endroit pour voir le nom de son biome."
        - "Un clic droit pose un marqueur nommé, dans l'une des 16 couleurs de teinture. Un bref halo clair marque l'endroit lors de la pose ou du retrait ; les marqueurs s'affichent sur la carte, la mini-map et dans le monde."
        - "Une croix rouge là où vous êtes mort, jusqu'à ce que vous y retourniez."
        - "L'exploration est enregistrée dès la première minute, avant même de fabriquer la carte."
      keys: "M ouvre la carte · Espace recentre"
      more_shots:
        - id: worldmap-biome
          alt: "Carte du monde avec le pointeur sur une zone explorée et, en maintenant Maj, le nom de son biome"
      detail:
        heading: "Une carte du monde avec marqueurs pour Minecraft"
        intro: "Fabriquez une carte du monde avec une carte vierge et huit bâtons, et ouvrez en plein écran chaque chunk exploré, sous un brouillard de guerre. Posez des marqueurs nommés dans l'une des 16 couleurs de teinture : ils s'affichent sur la carte, sur la mini-map et dans le monde."
        points:
          - "Fabriquez une carte du monde avec une carte vierge entourée de huit bâtons, et équipez-la dans le slot de la carte."
          - "M, ou l'onglet en haut de l'inventaire, ouvre en plein écran chaque chunk exploré dans cette dimension, sous un brouillard de guerre."
          - "Glissez pour vous déplacer, + / − ou la molette pour zoomer, Espace pour recentrer sur vous. Un panneau en bas à gauche rappelle les raccourcis de la carte."
          - "Maintenez Maj en survolant un endroit pour voir le nom de son biome."
          - "Une fois allé dans le Nether, l'infobulle indique aussi où cet endroit mène dans l'autre dimension."
          - "Un clic droit pose un marqueur, avec un nom facultatif et l'une des 16 couleurs de teinture ; un clic droit sur un marqueur le retire. Un bref halo clair marque l'endroit lors de la pose ou du retrait. Jusqu'à 64, gardés à la mort."
          - "Les marqueurs s'affichent en bannières de leur couleur sur la carte du monde, sur la mini-map et dans le monde."
          - "Une croix rouge marque l'endroit de votre dernière mort, sur les cartes et dans le monde. Elle disparaît quand vous y retournez, ou d'un clic droit sur la carte du monde."
          - "Le chunk d'apparition du monde, où l'on revient sans lit, est encadré sur la carte du monde."
          - "La magnétite visée par chacun de vos compas magnétiques apparaît en X blanc sur la mini-map et la carte du monde, au nom du compas si vous l'avez renommé."
          - "Les coordonnées écrites dans le chat deviennent des liens : un clic ouvre la carte du monde à cet endroit, prête à y nommer un marqueur."
          - "Ping : Maj + clic molette sur un endroit ou un mob, jusqu'à 128 blocs, et chaque joueur de la dimension le voit marqué d'un point rouge à votre nom pendant quelques secondes. Pas besoin de carte ; le clic molette seul choisit toujours le bloc."
          - "L'exploration est enregistrée dès la première minute, avant même de fabriquer la carte."
        recipe:
          pattern: ["SSS", "SMS", "SSS"]
          key:
            S: { icon: stick, name: "Bâton" }
            M: { icon: map, name: "Carte vierge" }
          result: { icon: world_map, name: "Carte du monde" }
          text: "Une carte vierge entourée de huit bâtons, sur un établi."
        faq:
          - q: "Comment fabriquer la carte du monde ?"
            a: "Posez une carte vierge au centre d'un établi et remplissez les huit cases autour avec des bâtons. Équipez la carte du monde dans le slot de la carte, au-dessus de la main secondaire, puis appuyez sur M pour l'ouvrir."
          - q: "Faut-il tout réexplorer après avoir fabriqué la carte ?"
            a: "Non. L'exploration est enregistrée dès la première minute, avec ou sans la carte : tout ce que vous avez parcouru y figure déjà quand vous la fabriquez."
          - q: "Combien de marqueurs peut-on poser ?"
            a: "Jusqu'à 64, toutes dimensions confondues. Ils sont enregistrés sur votre joueur et gardés à la mort."
          - q: "Comment retrouver l'endroit où je suis mort ?"
            a: "Une croix rouge le marque, sur la carte du monde, sur la mini-map et dans le monde, jusqu'à ce que vous y retourniez. Un clic droit dessus sur la carte du monde la retire."
          - q: "Comment montrer un endroit à mes amis ?"
            a: "Visez-le et faites Maj + clic molette : chaque joueur de la dimension y voit un point rouge à votre nom pendant quelques secondes, qui suit le mob si vous en visiez un. Il faut Cassonade sur le serveur ; sans lui, le clic molette choisit le bloc comme d'habitude."
    - id: clock
      title: "Montre"
      shot_alt: "Minecraft au crépuscule avec la montre en haut à gauche : 18:36, jour 1, la météo et le prochain changement de temps"
      lead: "Équipez une montre pour savoir quand tombe la nuit, un baromètre pour savoir quand tombera la pluie."
      points:
        - "L'heure et le temps qu'il fait."
        - "Le numéro du jour et la phase de la lune, qui clignote avec un petit lit et un léger carillon quand on peut dormir."
        - "Dans le Nether, la montre s'affole, comme en vanilla."
      item:
        icon: barometer
        name: "Baromètre"
        recipe: "Montre + Paratonnerre"
        text: "Équipé à la place de la montre, il montre aussi le prochain changement de météo, lu dans les compteurs du serveur."
      detail:
        heading: "Une montre à l'écran et la météo à venir pour Minecraft"
        intro: "Équipez une montre pour voir l'heure, la météo, le numéro du jour et la phase de la lune en haut à gauche de l'écran. Associez-la à un paratonnerre pour fabriquer un baromètre, et sachez quand viendra la prochaine pluie ou le prochain orage."
        points:
          - "Équipez une montre dans le slot de la montre : un panneau en haut à gauche montre l'heure et le temps qu'il fait."
          - "Le numéro du jour et la phase de la lune."
          - "Quand on peut dormir, à la tombée de la nuit ou quand un orage commence, un léger carillon sonne et la lune clignote avec un petit lit pendant quelques secondes."
          - "Fabriquez un baromètre avec une montre et un paratonnerre, et portez-le à la place de la montre : le panneau montre aussi le prochain changement de météo, lu dans les compteurs du serveur."
          - "Dans le Nether, la montre s'affole, comme en vanilla."
        recipe:
          pattern: ["CL", "  "]
          key:
            C: { icon: clock, name: "Montre" }
            L: { icon: lightning_rod, name: "Paratonnerre" }
          result: { icon: barometer, name: "Baromètre" }
          text: "Une montre et un paratonnerre, n'importe où dans une grille de fabrication : celle de l'inventaire suffit."
        faq:
          - q: "Comment le baromètre connaît-il la météo ?"
            a: "Minecraft décide à l'avance du prochain changement de temps, avec des compteurs sur le serveur. Le baromètre les lit : sa prévision est celle du jeu, pas une estimation. Quand la météo est figée, il n'y a rien à prévoir."
          - q: "Quand peut-on dormir ?"
            a: "Quand la lune clignote avec un petit lit sur la montre, avec un léger carillon : à la tombée de la nuit, ou dès qu'un orage commence."
          - q: "Cassonade change-t-il la durée du jour ?"
            a: "Oui : la journée dure 20 minutes au lieu de 10, et la nuit garde sa durée vanilla. La montre et la météo suivent ce jour plus lent."
          - q: "La météo à venir marche-t-elle en multijoueur ?"
            a: "Oui, si le serveur a aussi Cassonade : c'est lui qui envoie la prévision aux joueurs qui portent un baromètre."
    - id: inventory
      title: "Un inventaire qui suit"
      shot_alt: "Fenêtre de coffre avec les boutons de tri, et l'infobulle d'une boîte de Shulker qui montre son contenu et sa barre de remplissage"
      lead: "Tous les petits gestes qui manquent au vanilla."
      points:
        - "Triez un coffre, une boîte de Shulker ou l'inventaire d'un clic, ou d'un clic molette. Rangez dans le coffre ouvert ce qu'il contient déjà."
        - "Cherchez dans un coffre, une boîte de Shulker ou le sac avec Ctrl+F (Cmd+F sur Mac), ou le bouton à loupe ; les autres objets s'assombrissent."
        - "Maj enfoncé, glissez sur une rangée pour tout transférer, ou tournez la molette vers le bas sur une pile pour la transférer objet par objet. Glissez un bundle sur des objets pour le remplir, sur des cases vides pour le vider."
        - "Verrouillez une case avec Alt + clic : le tri, le rangement, Maj + clic et la touche pour jeter n'y touchent plus."
        - "Voyez le contenu des bundles, boîtes de Shulker, sacs à dos et cartes au survol, et ce que rend la nourriture."
        - "Ce que fait chaque enchantement, sur les livres enchantés, et sur l'équipement Maj enfoncé."
        - "Ce que vous ramassez, listé discrètement à droite de l'écran."
        - "Ctrl + clic sur une recette pour la fabriquer autant de fois que possible."
        - "Une alerte avant qu'un outil ou une armure enchantés ne cassent."
        - "De légers sons sur les clics d'inventaire, là où le vanilla reste muet."
      more_shots:
        - id: inventory-food
          alt: "Inventaire avec un aliment en main, les cuisses de poulet qu'il rendrait clignotant dans la barre de faim"
      detail:
        heading: "Tri d'inventaire et petits gestes de confort pour Minecraft"
        intro: "Triez les coffres d'un clic, rangez chaque objet à sa place, verrouillez des cases, remplissez votre main, voyez le contenu des boîtes de Shulker : Cassonade ajoute tous les petits gestes d'inventaire qui manquent à Minecraft, dans le style du jeu."
        points:
          - "<strong>Trier</strong> un coffre, un tonneau, un coffre de l'Ender, une boîte de Shulker, le sac à dos ou l'inventaire avec les petits boutons à côté des titres, ou d'un clic molette sur une case."
          - "<strong>Ranger</strong> : un clic met dans le coffre ouvert les objets qu'il contient déjà."
          - "<strong>Rechercher</strong> : Ctrl+F (Cmd+F sur Mac), ou le bouton à loupe, ouvre un champ de recherche. Il reconnaît les noms, identifiants, enchantements et objets dans les bundles et boîtes de Shulker ; les autres piles s'assombrissent sans disparaître."
          - "<strong>Maj + glisser</strong> sur une rangée transfère chaque pile survolée."
          - "<strong>Molette</strong> : tournez-la vers le bas sur une pile pour en transférer les objets un par un, là où Maj + clic enverrait la pile."
          - "<strong>Cases verrouillées</strong> : Alt + clic sur une case de l'inventaire ou de la barre d'action la verrouille, marquée d'un cadenas. Le tri, le rangement, Maj + clic, Maj + glisser et la touche pour jeter n'y touchent plus, et elle se remplit toujours quand sa pile s'épuise."
          - "<strong>Bundles</strong> : glissez un bundle sur des objets pour le remplir, ou clic droit glissé sur des cases vides pour le vider."
          - "<strong>Aperçus</strong> : le contenu des bundles, boîtes de Shulker, sacs à dos et cartes au survol. La nourriture montre la faim qu'elle rend et sa saturation, en cuisses de poulet, et en main, ce qu'elle rendrait clignote sur la barre de faim."
          - "<strong>Descriptions d'enchantements</strong> : ce que fait chaque enchantement, sous son nom, toujours sur les livres enchantés, et sur l'équipement enchanté Maj enfoncé."
          - "<strong>Comparer l'équipement</strong> : Maj enfoncé, l'infobulle d'une arme, d'un outil ou d'une armure montre l'écart avec la pièce portée ou tenue à cette place, +2 Armure ou -1 Dégâts d'attaque, enchantements à part."
          - "<strong>Pénalité d'enclume</strong> : un objet déjà passé à l'enclume montre les niveaux qu'elle ajoute à chaque nouveau passage."
          - "<strong>Combustible</strong> : dans un fourneau, un haut fourneau ou un fumoir, l'info-bulle d'un combustible dit combien d'objets il cuit (charbon 8, une planche 1,5)."
          - "<strong>Brassage</strong> : un alambic montre le temps restant pour le brassage en cours et le nombre de brassages encore alimentés."
          - "<strong>Objets ramassés</strong> : ce que vous ramassez s'affiche discrètement à droite de l'écran pendant quelques secondes, les ramassages d'un même objet additionnés."
          - "<strong>Nouveaux objets</strong> : ce que vous venez de ramasser porte un petit point doré dans l'inventaire, jusqu'à ce que le curseur passe dessus."
          - "<strong>Rangées de la barre d'action</strong> : G fait tourner les rangées de l'inventaire dans la barre d'action, celle juste au-dessus y descendant. Quatre appuis remettent tout en place : chaque rangée peut garder un jeu, outils, blocs de construction, nourriture et torches."
          - "<strong>Main remplie</strong> : quand la pile en main s'épuise (dernier bloc posé, dernier aliment mangé, outil cassé), une pile identique de l'inventaire prend sa place."
          - "<strong>Alerte d'usure</strong> : quand un outil, une arme ou une armure enchantés vont casser, un léger craquement, un message au-dessus de la barre d'action et l'objet qui clignote en rouge."
          - "<strong>Fabrication en masse</strong> : Ctrl + clic (Cmd sur Mac) sur une recette du livre pour la fabriquer autant de fois que l'inventaire le permet."
          - "<strong>Usages d'un objet</strong> : U sur un objet ouvre le livre de recettes sur toutes celles qui l'utilisent ; U de nouveau, une recherche ou la fermeture du livre ramène tout le livre."
          - "<strong>Fabrication en chaîne</strong> : cliquez une recette à laquelle il manque ce que vous pourriez d'abord fabriquer, et le livre de recettes le fait depuis votre inventaire, des bûches aux planches, des planches aux bâtons."
          - "<strong>Boîtes de Shulker</strong> : elles se cliquent comme les bundles. Cliquez ou glissez sur des piles pour en remplir une, clic droit pour en sortir une, et la molette pour choisir laquelle."
          - "De légers sons sur les clics d'inventaire, là où le vanilla reste muet."
        faq:
          - q: "Comment trier un coffre ?"
            a: "Cliquez sur le petit bouton de tri à côté de son titre, ou faites un clic molette sur une de ses cases (en Survie). Les piles identiques sont fusionnées, puis rangées par objet. Dans votre inventaire, le tri ne touche ni à la barre d'action ni à l'armure."
          - q: "Comment verrouiller une case de l'inventaire ?"
            a: "Alt + clic sur une case de l'inventaire ou de la barre d'action : un cadenas la marque. Le tri, le rangement, Maj + clic, Maj + glisser et la touche pour jeter (Q) n'y touchent plus. Un nouvel Alt + clic la déverrouille."
          - q: "À quoi sert la main remplie ?"
            a: "Quand la pile en main s'épuise, une pile semblable de l'inventaire prend sa place, d'abord une identique (mêmes enchantements, même usure). Elle ne puise jamais dans le sac à dos."
          - q: "Comment chercher dans un coffre ou un sac à dos ?"
            a: "Appuyez sur Ctrl+F (Cmd+F sur Mac), ou cliquez sur le bouton à loupe près du titre. Saisissez un nom d'objet, un identifiant ou un enchantement ; le contenu des bundles et des boîtes de Shulker est aussi recherché. Les objets sans résultat restent visibles, assombris."
          - q: "L'alambic indique-t-il le temps de préparation d'une potion ?"
            a: "Oui. Tant qu'il est ouvert, il montre le temps restant du brassage en cours et le nombre de brassages encore alimentés."
          - q: "Est-ce que ça marche sur un serveur sans le mod ?"
            a: "En partie. La recherche, les aperçus, les valeurs de la nourriture, l'alerte d'usure, le point des nouveaux objets, les rangées de la barre d'action et les temps de brassage marchent sur tous les serveurs ; le tri et les cases verrouillées ont besoin de Cassonade sur le serveur."
    - id: harvest
      title: "Récolte au clic droit"
      shot_alt: "Un champ de blé mûr de part et d'autre d'un canal d'eau, prêt pour la récolte au clic droit"
      lead: "Clic droit sur une culture mûre : récoltée et replantée."
      points:
        - "Blé, carottes, pommes de terre, betteraves, verrues du Nether et cacao."
        - "Le même butin qu'en la cassant, Fortune comprise, moins la graine replantée. Accroupi, le clic droit reste celui du jeu."
      detail:
        heading: "La récolte au clic droit pour les cultures de Minecraft"
        intro: "Clic droit sur une culture mûre : Cassonade la récolte et la replante d'un seul geste. Blé, carottes, pommes de terre, betteraves, verrues du Nether et cacao, avec le même butin qu'en la cassant, sans replanter à la main."
        points:
          - "Marche sur le blé, les carottes, les pommes de terre, les betteraves, les verrues du Nether et le cacao, une fois arrivés à maturité."
          - "Le même butin qu'en cassant la culture, Fortune comprise, moins la graine qui retourne en terre."
          - "Accroupi, le clic droit reste celui du jeu."
        faq:
          - q: "Quelles cultures peut-on récolter au clic droit ?"
            a: "Le blé, les carottes, les pommes de terre, les betteraves, les verrues du Nether et le cacao, une fois arrivés à maturité."
          - q: "Fortune marche-t-elle avec la récolte au clic droit ?"
            a: "Oui. Le butin est le même qu'en cassant la culture, Fortune comprise ; seule la graine qui la replante est retirée."
          - q: "Peut-on garder le clic droit vanilla sur une culture ?"
            a: "Oui : accroupissez-vous pendant le clic droit."
    - id: elytra
      title: "Slot élytre"
      shot_alt: "Un joueur vu de dos qui porte à la fois un casque en fer, un plastron en diamant et des élytres, au-dessus d'un village"
      lead: "Volez sans retirer votre plastron."
      points:
        - "L'élytre a son propre slot, à côté de la main secondaire. Elle vole, s'use et se répare avec Raccommodage comme en vanilla."
        - "Les autres joueurs voient vos ailes par-dessus l'armure."
      detail:
        heading: "Un slot pour l'élytre : volez sans retirer votre plastron"
        intro: "Dans Minecraft vanilla, l'élytre prend la place du plastron. Cassonade lui donne son propre slot d'équipement, à côté de la main secondaire : vous volez en restant protégé."
        points:
          - "L'élytre a son propre slot, à côté de la main secondaire. Clic droit avec, ou Maj + clic dessus dans l'inventaire, pour l'équiper."
          - "Le plastron reste dans son slot et vous protège pendant le vol."
          - "Elle vole, s'use et se répare avec Raccommodage exactement comme en vanilla."
          - "Les autres joueurs voient vos ailes par-dessus l'armure."
        faq:
          - q: "Peut-on porter une élytre et un plastron en même temps ?"
            a: "Oui. L'élytre va dans son propre slot, à côté de la main secondaire, et le plastron reste dans le sien : vous volez avec toute votre armure."
          - q: "Est-ce que ça change le vol en élytre ?"
            a: "Non. Le plané, la vitesse, l'usure et les réparations sont vanilla ; seul l'endroit où elle se porte change."
          - q: "Comment réparer une élytre dans son slot ?"
            a: "Comme en vanilla : avec des membranes de Phantom à l'enclume, ou avec Raccommodage, qui marche aussi dans le slot de l'élytre."
    - id: hopper
      title: "Entonnoir filtrant"
      shot_alt: "Fenêtre d'entonnoir avec un bloc de pierre dans son emplacement de filtre : seule la pierre passe"
      lead: "Des trieurs sans redstone."
      points:
        - "Chaque entonnoir a un emplacement de filtre : posez-y un objet, l'entonnoir n'accepte plus que lui."
        - "Mettez-y un sac ou une boîte de Shulker, et tous les objets qu'il contient passent."
        - "Une rangée d'entonnoirs avec des filtres en dessous, et le trieur est fait."
        - "On les reconnaît à leur grille en fer. Vitesse, blocage par la redstone et comparateurs restent vanilla."
      detail:
        heading: "Des entonnoirs filtrants : triez les objets sans redstone"
        intro: "Chaque entonnoir a un emplacement de filtre. Posez-y un objet, l'entonnoir n'accepte plus que lui : une rangée d'entonnoirs filtrants fait un trieur complet, sans un seul comparateur ni torche de redstone."
        points:
          - "Chaque entonnoir a un emplacement de filtre : posez-y un objet, l'entonnoir n'accepte plus que lui."
          - "Un bundle ou une boîte de Shulker dans le filtre laisse passer tous les objets qu'il contient. Vide, il filtre les bundles ou les boîtes de Shulker, comme n'importe quel objet."
          - "Le filtre compare l'objet, pas ses enchantements ni son nom."
          - "Une rangée d'entonnoirs avec des entonnoirs filtrants en dessous fait un trieur complet."
          - "Vitesse, blocage par la redstone et comparateurs restent vanilla."
          - "On reconnaît les entonnoirs filtrants à la grille en fer à l'intérieur."
        faq:
          - q: "Comment construire un trieur avec des entonnoirs filtrants ?"
            a: "Faites passer vos objets dans une ligne d'entonnoirs. Sous chaque entonnoir de la ligne, posez un entonnoir filtrant qui mène à un coffre : chacun ne retire que son objet, le reste continue sa route."
          - q: "Un entonnoir peut-il filtrer plusieurs objets ?"
            a: "Oui : mettez dans le filtre un bundle ou une boîte de Shulker qui contient ces objets, et tous ceux qu'il contient passent."
          - q: "Le filtre tient-il compte des enchantements ou des noms ?"
            a: "Non, il ne compare que l'objet : toute épée en diamant passe par un filtre d'épée en diamant, enchantée ou renommée."
          - q: "Est-ce que ça casse mes circuits de redstone ?"
            a: "Non. Sans filtre, un entonnoir marche exactement comme en vanilla, et la vitesse, le blocage par la redstone et les comparateurs ne changent jamais."
    - id: quests
      title: "Journal de quête et progrès"
      shot_alt: "Journal de quête ouvert sur le chapitre des premiers pas, avec tous les chapitres et leur avancement"
      lead: "Toujours savoir quoi faire ensuite."
      points:
        - "Un journal en douze chapitres vous guide de la première nuit aux défis les plus durs, en suivant les progrès du jeu."
        - "La quête en cours s'affiche sous la mini-map, avec son avancement. Un clic ouvre le journal."
        - "Un nouvel écran de progrès les liste tous, avec ce qu'il reste à faire pour chacun (biomes à visiter, monstres à tuer…)."
        - "Chaque progrès obtenu est célébré au centre de l'écran, en plus grand pour les objectifs et les défis."
      keys: "J journal · L progrès · K suivi"
      more_shots:
        - id: advancements
          alt: "Écran des progrès ouvert sur l'onglet Minecraft, avec ses progrès et le nombre obtenus dans chaque onglet"
      detail:
        heading: "Un journal de quête et un meilleur écran de progrès pour Minecraft"
        intro: "Toujours savoir quoi faire ensuite : un journal en douze chapitres vous guide de la première nuit aux défis les plus durs, en suivant les progrès du jeu, et un nouvel écran de progrès montre ce qu'il reste à faire pour chacun."
        points:
          - "<strong>Journal de quête</strong> (J) : douze chapitres qui vous guident de la première nuit aux défis les plus durs. Il est proposé dans un petit panneau sur le côté au début d'un monde : J accepte, K refuse, et il s'en va si vous l'ignorez. Il s'active ou se désactive à tout moment."
          - "<strong>Quête en cours</strong> : affichée sous la mini-map avec son avancement. Un clic ouvre le journal ; K la réduit, la masque ou la réaffiche."
          - "<strong>Écran des progrès</strong> (L) : tous les progrès dans un seul livre, avec ce qu'il reste à faire pour chacun (biomes à visiter, monstres à tuer…) et un filtre pour ce qui est fait ou reste à faire."
          - "<strong>Célébrations</strong> : chaque progrès obtenu est annoncé au centre de l'écran, en plus grand pour les objectifs et les défis."
          - "Les quêtes suivent les progrès de Minecraft : rien de nouveau à collectionner, rien qui change la progression du jeu."
        faq:
          - q: "Les quêtes sont-elles du nouveau contenu ?"
            a: "Non. Le journal range les progrès de Minecraft en douze chapitres, dans un ordre logique : il donne une direction sans changer le jeu."
          - q: "Peut-on désactiver le journal de quête ?"
            a: "Oui. Il est proposé dans un petit panneau au début d'un monde : K le refuse, et il s'en va si vous l'ignorez. Il s'active ou se désactive à tout moment. K réduit ou masque la quête en cours à l'écran."
          - q: "Que montre le nouvel écran des progrès ?"
            a: "Tous les progrès dans un seul livre, et pour chacun ce qu'il reste à faire : les biomes pas encore visités pour « Partons à l'aventure ! », les monstres pas encore tués pour « Monstres chassés », etc."
    - id: combat
      title: "Combat"
      shot_alt: "Un creeper et une araignée avec leur barre de vie et un « ! » doré au-dessus de la tête, et l'œil en haut à gauche"
      lead: "Équipez un compas sculk pour savoir qui vous poursuit."
      points:
        - "Une barre de vie au-dessus des monstres en combat, qui montre les dégâts que vous venez d'infliger."
        - "Un « ! » quand un monstre vous prend en chasse."
        - "Un œil dans le coin de l'écran tant que quelque chose vous poursuit, même hors de vue."
        - "Un point rouge sur la mini-map pour chaque monstre qui vous traque."
      item:
        icon: sculk_compass
        name: "Compas sculk"
        recipe: "Compas + Capteur sculk"
        text: "Équipé à la place du compas, il affiche la mini-map et perçoit les monstres autour de vous. Les capteurs sculk poussent dans les abîmes et ne se récupèrent qu'avec Toucher de soie."
      detail:
        heading: "Barres de vie des monstres et vigilance au combat pour Minecraft"
        intro: "Fabriquez un compas sculk avec un compas et un capteur sculk, et voyez qui vous poursuit : une barre de vie au-dessus des monstres que vous combattez, un « ! » quand un monstre vous prend en chasse, et un œil dans le coin de l'écran tant que quelque chose vous traque, même hors de vue."
        points:
          - "Associez un compas à un capteur sculk pour fabriquer un compas sculk, et portez-le dans le slot du compas : il affiche aussi la mini-map."
          - "Une barre de vie au-dessus des monstres en combat, qui montre les dégâts que vous venez d'infliger ; les boss gardent la leur en haut de l'écran."
          - "Un « ! » doré quand un monstre vous prend en chasse."
          - "Un œil dans le coin de l'écran tant que quelque chose vous poursuit, même hors de vue, avec le nombre de poursuivants."
          - "Un point rouge sur la mini-map pour chaque monstre qui vous traque, sur son bord quand il est plus loin : vous savez d'où il vient."
          - "Les autres joueurs autour de vous sur la mini-map, en marqueurs bleus avec leur pseudo."
          - "Avec ou sans compas sculk, un arc rouge autour du viseur montre d'où vient un coup."
        recipe:
          pattern: ["CS", "  "]
          key:
            C: { icon: compass, name: "Compas" }
            S: { icon: sculk_sensor, name: "Capteur sculk" }
          result: { icon: sculk_compass, name: "Compas sculk" }
          text: "Un compas et un capteur sculk, n'importe où dans une grille de fabrication : celle de l'inventaire suffit."
        faq:
          - q: "Comment obtenir un compas sculk ?"
            a: "Minez un capteur sculk avec un outil enchanté Toucher de soie, dans les abîmes, puis associez-le à un compas. Portez le compas sculk dans le slot du compas, à sa place."
          - q: "Garde-t-on la mini-map avec le compas sculk ?"
            a: "Oui : le compas sculk fait tout ce que fait le compas, et perçoit en plus les monstres autour de vous."
          - q: "Est-ce que ça marche en multijoueur ?"
            a: "Oui, avec Cassonade sur le serveur : le « ! » et l'œil ont besoin du serveur, qui sait quels monstres vous poursuivent."
    - id: spyglass
      title: "Longues-vues"
      shot_alt: "Un cheval vu à travers la longue-vue de naturaliste, dans une lentille ronde, sa vitesse, son saut, sa vie et s'il peut se reproduire dans un panneau sous le viseur"
      lead: "Une lentille plus nette, un zoom plus fin, et une longue-vue de naturaliste qui lit ce qu'elle voit."
      points:
        - "À travers une longue-vue, une lentille ronde, et la molette zoome d'un cran de plus ou de moins."
        - "La longue-vue de naturaliste lit aussi ce que vous voyez : la vitesse, le saut et la vie d'un cheval, si un animal peut se reproduire, les échanges épuisés d'un villageois, la croissance d'une culture, le miel et le nombre d'abeilles dans une ruche."
        - "Jusqu'à 128 blocs."
      item:
        icon: naturalist_spyglass
        name: "Longue-vue de naturaliste"
        recipe: "Longue-vue + Livre + Capteur sculk"
        text: "Elle zoome comme une longue-vue, et lit ce que vous voyez à travers. Les capteurs sculk poussent dans les abîmes et ne se récupèrent qu'avec Toucher de soie."
      keys: "La molette zoome et dézoome"
      more_shots:
        - id: spyglass-bees
          alt: "Une ruche vue à travers la longue-vue de naturaliste, avec son niveau de miel et le nombre d'abeilles à l'intérieur"
      detail:
        heading: "Une longue-vue de naturaliste : stats des chevaux, reproduction et ruches d'un coup d'œil"
        intro: "Regardez à travers une longue-vue dans une lentille ronde, et zoomez plus ou moins avec la molette. Assemblez-la avec un livre et un capteur sculk pour en faire une longue-vue de naturaliste : un petit panneau dit ce que vous voyez, la vitesse, le saut et la vie d'un cheval, si un animal peut se reproduire, les échanges épuisés d'un villageois, la croissance d'une culture et le nombre d'abeilles dans une ruche."
        points:
          - "À travers une longue-vue, une lentille ronde au bout d'un tube sombre au lieu de la fenêtre carrée du jeu."
          - "La molette zoome d'un cran de plus ou de moins que le jeu, la longue-vue restant en main."
          - "Assemblez une longue-vue, un livre et un capteur sculk pour faire une longue-vue de naturaliste : elle zoome comme une longue-vue, et lit ce que vous voyez à travers, jusqu'à 128 blocs."
          - "<strong>Chevaux, ânes, mules et lamas</strong> : leur vitesse en blocs par seconde, la hauteur de leur saut et leur vie, et la force d'un lama, chacune en barre du pire cheval possible au meilleur, du rouge au vert."
          - "<strong>Animaux</strong> : s'ils sont prêts à se reproduire, ou dans combien de temps, et quand un petit deviendra adulte."
          - "<strong>Villageois</strong> : leur niveau, et combien de leurs échanges sont épuisés."
          - "<strong>Cultures</strong> : leur croissance, ou qu'elles sont mûres. <strong>Ruches</strong> : leur miel et le nombre d'abeilles à l'intérieur."
        recipe:
          pattern: ["SB", "K "]
          key:
            S: { icon: spyglass, name: "Longue-vue" }
            B: { icon: book, name: "Livre" }
            K: { icon: sculk_sensor, name: "Capteur sculk" }
          result: { icon: naturalist_spyglass, name: "Longue-vue de naturaliste" }
          text: "Une longue-vue, un livre et un capteur sculk, n'importe où dans une grille de fabrication : celle de l'inventaire suffit."
        faq:
          - q: "Comment fabriquer la longue-vue de naturaliste ?"
            a: "Minez un capteur sculk avec un outil Toucher de soie dans les abîmes, puis assemblez-le avec une longue-vue et un livre sur un établi."
          - q: "Comment voir les stats d'un cheval ?"
            a: "Regardez le cheval à travers une longue-vue de naturaliste : sa vitesse, son saut et sa vie s'affichent sous le viseur, chacun en barre du pire cheval possible au meilleur, du rouge au vert."
          - q: "Peut-on zoomer plus avec une longue-vue ?"
            a: "Oui. En regardant à travers n'importe quelle longue-vue, tournez la molette : elle zoome d'un cran de plus, ou d'un cran de moins, que le jeu."
          - q: "Est-ce que ça marche en multijoueur ?"
            a: "Oui, avec Cassonade sur le serveur, qui connaît la longue-vue de naturaliste et sait quand un animal peut se reproduire et quels échanges sont épuisés. La lentille et le zoom à la molette marchent sur tous les serveurs."
    - id: torch
      title: "Torche sculk"
      shot_alt: "Une prairie de nuit vue une torche sculk en main, de discrètes têtes de creeper posées sur l'herbe là où des monstres peuvent apparaître, aucune autour d'une torche"
      lead: "Voyez où les monstres peuvent apparaître avant qu'ils ne le fassent."
      points:
        - "Tenue en main, elle éclaire comme une torche."
        - "Une discrète tête de creeper se pose sur chaque bloc alentour où des monstres peuvent apparaître."
        - "Sombre là où ils le peuvent à toute heure, claire là où seule la nuit le permet."
      item:
        icon: sculk_torch
        name: "Torche sculk"
        recipe: "Torche + Capteur sculk"
        text: "Éclairez les endroits qu'elle montre et les têtes disparaissent. Les capteurs sculk poussent dans les abîmes et ne se récupèrent qu'avec Toucher de soie."
      detail:
        heading: "Une torche sculk : voir où les monstres peuvent apparaître, sans mod de niveau de lumière"
        intro: "Assemblez une torche et un capteur sculk pour faire une torche sculk. Tenue dans une main, elle éclaire autour de vous comme une torche, et pose une discrète tête de creeper sur chaque bloc alentour où des monstres peuvent apparaître : éclairez-les, et les têtes disparaissent."
        points:
          - "Tenue dans une main, elle éclaire autour de vous comme une torche, comme toute torche en main avec Cassonade."
          - "À la place de la flamme, une vrille de capteur sculk ondule à son sommet."
          - "Sur chaque bloc à 12 blocs autour où un monstre peut apparaître, une tête de creeper se pose à plat, comme une ombre discrète, cachée par les blocs devant."
          - "Sombre là où les monstres peuvent apparaître à toute heure, dans les grottes et sous un toit ; claire là où ils ne le peuvent que la nuit, à ciel ouvert."
          - "Elle lit la lumière que votre jeu connaît : posez des torches jusqu'à ce qu'il ne reste plus de tête."
        recipe:
          pattern: ["TK"]
          key:
            T: { icon: torch, name: "Torche" }
            K: { icon: sculk_sensor, name: "Capteur sculk" }
          result: { icon: sculk_torch, name: "Torche sculk" }
          text: "Une torche et un capteur sculk, n'importe où dans une grille de fabrication : celle de l'inventaire suffit."
        faq:
          - q: "Comment voir où les monstres peuvent apparaître ?"
            a: "Tenez une torche sculk : une discrète tête de creeper s'affiche sur chaque bloc alentour où un monstre peut apparaître. Posez des torches ou une autre lumière jusqu'à ce que les têtes disparaissent."
          - q: "Que veulent dire les têtes sombres et claires ?"
            a: "Une tête sombre marque un endroit assez sombre à toute heure, comme une grotte. Une claire est à ciel ouvert : les monstres n'y apparaissent que la nuit."
          - q: "Comment fabriquer la torche sculk ?"
            a: "Minez un capteur sculk avec un outil Toucher de soie dans les abîmes, puis assemblez-le avec une torche dans n'importe quelle grille de fabrication."
          - q: "Ça marche en multijoueur ?"
            a: "Oui, sur n'importe quel serveur : votre jeu lit la lumière qu'il connaît déjà."
    - id: woodcutter
      title: "Tailleur de bois"
