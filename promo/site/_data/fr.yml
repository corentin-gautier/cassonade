            a: "Non. Une pièce donne ce que donne l'établi par planche, arrondi à l'inférieur et au moins un : tailler le bois n'est jamais un moyen d'en tirer plus."
          - q: "Est-ce que ça marche en multijoueur ?"
            a: "Oui, avec Cassonade sur le serveur, qui fournit la fenêtre et ses recettes."
    - id: waystone
      title: "Pierre de voyage"
      shot_alt: "Une pierre de voyage dans un pré : un monument de pierre de deux blocs de haut veiné de violet, un cube rose flottant et tournant au-dessus, couvert de lettres étranges"
      lead: "Le voyage rapide, une fois le jeu terminé."
      points:
        - "Clic droit sur l'une, choisissez-en une autre, et vous y êtes, dans n'importe quelle dimension."
        - "Sa recette demande un fruit de chorus : elle arrive donc après l'End, et ne mène jamais qu'à une autre pierre de voyage."
        - "Nommez-les, et distinguez-les dans la liste à la couleur et à l'icône de leur dimension."
      more_shots:
        - id: waystone-list
          alt: "La fenêtre d'une pierre de voyage : un champ pour la nommer et la liste des autres, teintées et avec une icône pour le Nether et l'End"
      item:
        icon: waystone
        name: "Pierre de voyage"
        recipe: "Carte du monde + fruit de chorus + 5 briques de pierre sculptées"
        text: "Une carte du monde sur cinq briques de pierre sculptées, un fruit de chorus au-dessus, sur un établi."
      detail:
        heading: "Pierres de voyage : voyager entre vos lieux en un clic, une fois l'End atteint"
        intro: "Fabriquez une pierre de voyage, posez-en une partout où vous revenez souvent, et passez de l'une à l'autre d'un clic. Il faut un fruit de chorus : le voyage rapide attend donc l'End, et ne mène jamais ailleurs qu'à une autre pierre."
        points:
          - "Elle fait deux blocs de haut : un monument de pierre, surmonté d'un cube rose qui tourne, couvert de l'alphabet de la table d'enchantement, et qui attire des particules."
          - "Clic droit pour lister les autres, dans toutes les dimensions, puis un clic pour y aller. Vous arrivez à son pied."
          - "Les vôtres sont dans la liste dès que vous les posez, celles des autres joueurs une fois que vous êtes passé à proximité."
          - "Nommez les vôtres dans leur fenêtre, ou à l'enclume avant de les poser. Sans nom, une pierre s'affiche avec sa dimension et ses coordonnées."
          - "Dans la liste, chaque dimension a son icône, le Nether et l'End leur couleur."
          - "Avec une carte du monde ou une boussole équipée, ces mêmes pierres apparaissent sur la carte, sur la minimap et, avec une boussole, dans le monde avec leur nom : des repères pour s'orienter, pas des raccourcis, car un trajet part toujours du bloc."
          - "Une pierre sans place libre autour d'elle empêche le trajet, et celle qu'on casse quitte la liste."
        recipe:
          pattern: [" C ", "SMS", "SSS"]
          key:
            C: { icon: chorus_fruit, name: "Fruit de chorus" }
            M: { icon: world_map, name: "Carte du monde" }
            S: { icon: chiseled_stone_bricks, name: "Briques de pierre sculptées" }
          result: { icon: waystone, name: "Pierre de voyage" }
          text: "Une carte du monde au centre, des briques de pierre sculptées de chaque côté et sur toute la rangée du bas, et un fruit de chorus au-dessus."
        faq:
          - q: "Comment fabriquer une pierre de voyage ?"
            a: "Posez une carte du monde au centre d'un établi, des briques de pierre sculptées de chaque côté et sur la rangée du bas, et un fruit de chorus au milieu du haut : 5 briques, 1 carte, 1 fruit."
          - q: "Peut-on se téléporter n'importe où ?"
            a: "Non : seulement vers une autre pierre de voyage. Vous posez vous-même les deux bouts de chaque trajet."
          - q: "Le voyage coûte-t-il quelque chose ?"
            a: "Non : le coût, c'est de fabriquer les pierres. Le fruit de chorus ne pousse que dans l'End, elles arrivent donc tard dans la partie."
          - q: "Ça marche entre les dimensions ?"
            a: "Oui : la liste montre les pierres de toutes les dimensions, et un clic vous y emmène."
          - q: "Les autres joueurs peuvent-ils utiliser mes pierres ?"
            a: "Oui, une fois qu'ils les ont trouvées en passant à proximité : la pierre rejoint alors leur liste. Seul le joueur qui a posé une pierre peut la renommer."
          - q: "Ça marche en multijoueur ?"
            a: "Oui, avec Cassonade sur le serveur, qui fournit le bloc et tient la liste."
    - id: tweaks
      title: "Petits détails du quotidien"
      shot_alt: "De la poussière de redstone en main, et la puissance du fil regardé, de 0 à 15"
      lead: "De petits agacements, réglés un par un."
      points:
        - "De la poussière de redstone en main montre la puissance d'un fil ; un rayon de miel ou une hache, si le cuivre est ciré."
        - "Un coffre, un tonneau ou une boîte de Shulker renommé affiche son nom, une étagère sculptée le livre de la case regardée."
        - "Les supports d'armure ont des bras, et un chaudron d'eau lave les blocs teints, durcit le béton et efface les cartes, toute une pile d'un coup."
        - "Renommer à l'enclume est gratuit."
      more_shots:
        - id: tweaks-copper
          alt: "Du cuivre regardé avec un rayon de miel en main, indiqué comme ciré"
        - id: tweaks-chest
          alt: "Un coffre renommé à l'enclume, son nom affiché quand on le regarde"
        - id: tweaks-bookshelf
          alt: "Une étagère sculptée avec le titre et l'enchantement du livre de la case regardée"
        - id: tweaks-armor-stand
          alt: "Un support d'armure avec des bras, portant une armure"
        - id: tweaks-pirate-booty
          alt: "Un butin de pirate dans une grotte luxuriante : des tonneaux entassés sur la mousse, sous les baies lumineuses"
      detail:
        heading: "Petits détails du quotidien : les agacements de Minecraft, réglés"
        intro: "Une poignée de petites choses que le jeu ne dit pas, ou vous fait faire à la dure. Chacune marche comme le vanilla le ferait, s'il y avait pensé."
        sections:
          - title: "Ce que le jeu ne dit pas"
            points:
              - "<strong>Redstone</strong> : poussière de redstone en main, regardez un fil pour voir sa puissance, de 0 à 15 ; sur tout autre bloc, s'il est alimenté. Les blocs musicaux montrent leur note, les juke-box en marche leur morceau."
              - "<strong>Cuivre</strong> : avec un rayon de miel ou une hache en main, regardez du cuivre pour voir s'il est ciré."
              - "<strong>Coffres, tonneaux et boîtes de Shulker</strong> : un conteneur renommé affiche son nom quand on le regarde. Un cadre sur un coffre l'ouvre ; accroupissez-vous pour tourner l'objet."
              - "<strong>Étagères sculptées</strong> : regardez une case pour voir le titre du livre, avec ses enchantements ou son auteur. Un pupitre montre le titre et l'auteur de son livre."
              - "<strong>Pistons, observateurs, distributeurs, droppers et entonnoirs</strong> : en main, une petite croix sombre encadrée de quatre coins montre la face du futur bloc qui poussera, éjectera, déversera ou observera."
          - title: "Fabrication et blocs"
            points:
              - "<strong>Chaudrons d'eau</strong> : ils lavent laine, tapis, lits, terre cuite et verre teints, durcissent le béton en poudre et effacent les cartes remplies : toute la pile pour un niveau d'eau."
              - "<strong>Enclume</strong> : renommer est gratuit."
              - "<strong>Fours</strong> : ils montrent l'expérience qu'ils contiennent, dans l'infobulle de l'icône « ! »."
              - "<strong>Recettes</strong> : un bloc de verrues du Nether redonne 9 verrues, la glace compactée 9 glaces."
              - "<strong>Coffres de l'Ender</strong> : ils se récupèrent avec n'importe quelle pioche, sans Toucher de soie."
          - title: "Construire et se déplacer"
            points:
              - "<strong>Supports d'armure</strong> : posés avec des bras, comme dans Bedrock ; les cisailles les retirent, deux bâtons les remettent. Alt et clic droit à mains nues pour échanger votre armure avec celle du support ; accroupi et clic droit pour passer à la suivante des 13 poses de Bedrock."
              - "<strong>Pots de fleurs</strong> : un clic droit sur un pot rempli avec une autre fleur ou une pousse les échange."
              - "<strong>Tableaux</strong> : accroupi, visez-en un avec un tableau en main, ou juste après avoir posé votre dernier, et la molette fait défiler tous ceux qui rentrent."
              - "<strong>Ponts</strong> : accroupi, visez le côté opposé du bloc sous vos pieds, et le bloc en main se pose devant lui."
              - "<strong>Vos animaux</strong> : un coup traverse votre loup ou votre cheval et atteint ce qui est derrière ; accroupi, il les touche exprès. Vos chiens, chats et perroquets contournent le feu au lieu de vous y suivre."
              - "<strong>Villageois</strong> : un bouton à côté des échanges vous tourne vers le bloc où il travaille et le signale."
              - "<strong>Étiquettes</strong> : une étiquette vierge rend une créature silencieuse ; une autre lui rend sa voix."
              - "<strong>Creepers</strong> : <code>/gamerule cassonade:spawn_creepers false</code> les empêche d'apparaître, les autres monstres restent inchangés ; ceux déjà là restent, et un œuf d'apparition en fait toujours un."
              - "<strong>Neige</strong> : un clic droit avec une pelle retire une couche, pour une boule de neige."
              - "<strong>Bateaux et wagonnets</strong> : vous descendez à côté, du côté libre le plus proche de votre regard."
              - "<strong>Toiles d'araignée</strong> : elles se cassent d'un coup, même à la main, et donnent leur ficelle."
              - "<strong>Portails du Nether</strong> : un cadre d'obsidienne pleureuse s'allume aussi, seule ou mêlée à l'obsidienne."
          - title: "Enchantements et équipement"
            points:
              - "<strong>Poison</strong> : deux fois moins long et deux fois moins souvent, quelle qu'en soit la source : une seule potion ne vous laisse plus à un demi-cœur."
              - "<strong>Épée en netherite</strong> : 10 de dégâts au lieu de 8, la plupart des monstres tombent en deux coups."
              - "<strong>Pioche en netherite</strong> : toute l'ardoise des abîmes se casse aussi vite que la pierre, et d'un coup avec Efficacité V et Célérité II."
            table:
              intro: "Chaque enchantement plafonne à I, III ou V : ceux qui s'arrêtaient à II montent à III, ceux qui s'arrêtaient à IV montent à V. Chaque nouveau niveau ajoute autant que les précédents, et s'obtient à la table d'enchantement, chez les villageois, dans les coffres et à l'enclume comme les autres. Les réductions de dégâts comptent par pièce d'armure et s'additionnent, jusqu'à la limite du jeu de 80 %."
              head: ["Enchantement", "Niveau max", "Chaque niveau", "Au nouveau niveau max"]
              rows:
                - ["Protection", "IV → V", "−4 % de dégâts", "−20 % par pièce : quatre pièces atteignent la limite de 80 %, au lieu de 64 %"]
                - ["Protection contre le feu", "IV → V", "−8 % de dégâts du feu et de la lave, −15 % de temps en feu", "−40 % de dégâts, −75 % de temps en feu"]
                - ["Protection contre les explosions", "IV → V", "−8 % de dégâts des explosions, −15 % de leur recul", "−40 % de dégâts, −75 % de recul"]
                - ["Protection contre les projectiles", "IV → V", "−8 % de dégâts des projectiles", "−40 %"]
                - ["Chute amortie", "IV → V", "−12 % de dégâts de chute", "−60 %"]
                - ["Brèche", "IV → V", "L'armure de la cible 15 % moins efficace", "75 % moins efficace"]
                - ["Perforation", "IV → V", "La flèche traverse une créature de plus", "Traverse 5 créatures"]
                - ["Recul", "II → III", "Un cran de recul en plus", "Trois fois le recul de Recul I"]
                - ["Frappe", "II → III", "Un cran de recul en plus pour les flèches", "Trois fois le recul de Frappe I"]
                - ["Aura de feu", "II → III", "4 secondes de feu", "12 secondes"]
                - ["Semelles givrantes", "II → III", "La glace 1 bloc plus loin autour de vous, 3 au niveau I", "5 blocs autour de vous"]
          - title: "Écriture et menus"
            points:
              - "<strong>Livres</strong> : insérez ou supprimez une page n'importe où pendant l'écriture ; Échap enregistre ce que vous avez écrit."
              - "<strong>Panneaux</strong> : ils s'éditent à la souris et aux flèches comme un vrai champ de texte ; sans sélection, copier et coller prennent tout le panneau."
              - "<strong>Longs panneaux</strong> : le mot en cours passe à la ligne suivante quand une ligne est pleine."
              - "<strong>Menus</strong> : le bouton 4 de la souris revient en arrière, comme Échap, sauf si vous l'avez assigné à autre chose."
        faq:
          - q: "Comment voir la puissance d'un fil de redstone ?"
            a: "Tenez de la poussière de redstone et regardez le fil : sa puissance, de 0 à 15, s'affiche sous le viseur."
          - q: "Comment récupérer un coffre de l'Ender sans Toucher de soie ?"
            a: "Cassez-le avec n'importe quelle pioche : il se donne lui-même au lieu de 8 obsidiennes."
          - q: "Comment durcir toute une pile de béton en poudre ?"
            a: "Faites un clic droit sur un chaudron d'eau avec la pile : tout devient du béton, pour un niveau d'eau. Le même clic efface les cartes remplies."
          - q: "Comment empêcher les creepers d'apparaître sans désactiver les autres monstres ?"
            a: "Lancez <code>/gamerule cassonade:spawn_creepers false</code>. Zombies, squelettes et les autres continuent d'apparaître ; les creepers déjà dans le monde restent, et un œuf d'apparition en fait toujours un."
          - q: "Est-ce que ça marche en multijoueur ?"
            a: "Oui, avec Cassonade sur le serveur pour ce que seul le serveur sait ou décide : puissance des fils, noms des coffres, titres des étagères, chaudrons, tableaux, neige, coffres de l'Ender et apparition des creepers. Sur un serveur sans le mod, le jeu retombe sur le vanilla."
    - id: graphics
      title: "Lumière, ciel et mer"
      shot_alt: "Le soleil qui se couche derrière la mer sur un horizon net, l'eau qui s'assombrit sous un ciel orange"
      lead: "Les mêmes blocs sous un meilleur jour : des lumières qui ont une couleur, un ciel plus profond, et une mer avec un vrai horizon et de vraies profondeurs."
      points:
        - "Chaque lumière teinte ce qu'elle éclaire de sa couleur : le feu des âmes en bleu, la redstone en rouge, le cuivre en vert, l'améthyste en violet. Dehors, le soleil l'efface le jour."
        - "Une torche en main éclaire autour de vous, comme les torches jetées au sol, tenues par d'autres ou les monstres en feu."
        - "Le ciel est d'un bleu profond qui pâlit vers l'horizon, et les terres lointaines s'y fondent plutôt que dans le blanc."
        - "La mer s'arrête sur une courbe nette, le soleil se couche derrière elle, et l'eau lointaine devient opaque."
        - "Sous l'eau, le ciel n'apparaît qu'au-dessus de vous, et les profondeurs sont sombres et troubles."
      more_shots:
        - id: graphics-underwater
          alt: "Le regard levé depuis le fond de la mer vers le soleil du matin qui brille à travers les vagues, la surface autour comme un miroir sombre"
      detail:
        heading: "Lumière, ciel et mer : un Minecraft plus beau qui reste vanilla"
        intro: "Pas de pack de shaders ni de nouvelles textures : l'aspect du jeu lui-même, avec des lumières qui ont une couleur, un ciel qui a de la profondeur et une mer qui a un horizon. Rien d'autre à installer que le mod, rien à régler."
        sections:
          - title: "La lumière"
            points:
              - "<strong>Lumières colorées</strong> : chaque lumière teinte ce qu'elle éclaire de sa couleur, le feu des âmes en bleu, la redstone en rouge, les torches en cuivre en vert, l'améthyste et l'obsidienne pleureuse en violet, les lanternes aquatiques en bleu pâle, la lave en orange, le cristal de la pierre de voyage en rose ; une lumière tenue en main prend aussi sa couleur, la torche sculk en bleu-vert. La couleur va où va la lumière, jamais à travers les murs ; dehors, le soleil l'efface le jour ; torches, lanternes et feu gardent leur lumière chaude."
              - "<strong>Une lumière en main</strong> : une torche, une lanterne ou toute lumière que vous tenez éclaire autour de vous et vous suit sans à-coups, comme les torches jetées au sol, tenues par d'autres joueurs ou les monstres en feu."
          - title: "Le ciel"
            points:
              - "<strong>Le ciel</strong> est d'un bleu profond au zénith, plus pâle vers l'horizon, et les terres lointaines se fondent dans le ciel juste derrière elles, orange près d'un couchant et bleu le jour, plutôt que dans le blanc."
          - title: "En mer"
            points:
              - "<strong>L'horizon</strong> : la mer s'arrête sur une courbe nette, et le soleil et la lune se couchent derrière elle au lieu de transparaître dans l'eau."
              - "<strong>L'eau lointaine</strong> devient opaque et cache les algues et les structures englouties que le jeu de base laisse voir, éclairées, au loin."
              - "<strong>Sa couleur</strong> suit la lumière : la mer s'assombrit et grisonne au crépuscule, et garde peu de son bleu la nuit."
          - title: "Sous l'eau"
            points:
              - "<strong>Sous l'eau</strong>, le ciel n'apparaît qu'en levant les yeux, comme dans une vraie mer, et jamais à travers la roche. Le lointain est sombre, d'autant plus qu'on descend, et l'eau trouble, chargée de particules que la houle fait dériver, referme la vue : au-delà d'environ 30 blocs, tout se perd dans l'eau, et la vue se brouille, d'autant plus que les choses sont loin, comme pour des yeux ouverts dans une vraie eau. Les yeux s'habituent à l'eau en 3 secondes au lieu de 30, et on y retrouve quand même son chemin. Les monstres n'y voient pas mieux : à travers l'eau, ils ne vous remarquent qu'à 16 blocs et vous perdent au-delà de 30. Un <strong>masque de plongée</strong>, cinq cuirs autour d'une vitre portés à la place du casque, garde la vue nette et deux fois plus longue, et son tuba vous laisse respirer jusqu'à environ 2 blocs sous la surface, votre dernière bouffée d'air durant 5 secondes plus bas ; il prend les enchantements du casque."
        faq:
          - q: "Est-ce un pack de shaders ?"
            a: "Non. C'est le rendu du jeu lui-même, ajusté : ni Iris ni OptiFine, et rien à régler."
          - q: "Est-ce que ça marche avec Sodium ?"
            a: "Les lumières colorées sont désactivées quand Sodium est installé, car il dessine le terrain à sa façon ; les lumières gardent alors la teinte chaude du jeu de base."
          - q: "Est-ce que ça marche sur un serveur sans le mod ?"
            a: "Oui : tout se passe sur votre ordinateur, donc ça marche partout. Seul le masque de plongée, un objet du mod, demande Cassonade sur le serveur."
          - q: "Comment mieux voir sous l'eau ?"
            a: "Fabriquez un masque de plongée avec cinq cuirs autour d'une vitre, en forme de casque, et portez-le à la place du casque : la vue reste nette et porte deux fois plus loin, environ 60 blocs, et vous respirez la tête jusqu'à environ 2 blocs sous la surface, puis 5 secondes de plus en plongeant plus bas. Apnée et Affinité aquatique peuvent s'y appliquer, comme sur un casque."
    - id: interface
      title: "Une interface soignée"
      shot_alt: "Établi avec le livre de recettes redessiné, comme un livre relié de cuir aux pages crème et à onglets"
      lead: "Un style plus net et plus chaleureux pour chaque écran, toujours dans l'esprit de Minecraft."
      points:
        - "Panneaux en bois, emplacements sombres et texte crème, du HUD au chat, aux inventaires, boutons et infobulles."
        - "Un livre de recettes qui ressemble à un livre, et un livre animé sur la table d'enchantement."
        - "Un discret « ! » près du titre des fours, meules, alambics et plus encore montre ce que la fenêtre ne dit pas."
        - "Pendant le chargement d'un monde, sa carte se dessine chunk par chunk."
      more_shots:
        - id: interface-info
          alt: "Four avec l'infobulle de son icône « ! » : temps de cuisson, ce que le combustible cuira encore et l'expérience stockée"
        - id: interface-worlds
          alt: "Choix du monde : les mondes à gauche, celui choisi à droite avec une grande icône, son mode de jeu et sa difficulté, sa dernière partie, le temps de jeu et sa version"
        - id: interface-loading
          alt: "Écran de chargement du monde : la carte explorée en sépia dans un cadre en bois, les chunks déjà chargés en couleur autour du joueur, une barre de progression et une astuce"
      detail:
        heading: "Une interface Minecraft plus nette et plus chaleureuse, qui reste vanilla"
        intro: "Cassonade redessine les écrans du jeu dans un style unique : panneaux en bois sépia, emplacements sombres et texte crème, du HUD aux inventaires, au chat et aux infobulles. Toujours le style pixel de Minecraft, en plus soigné."
        points:
          - "Panneaux en bois sépia, emplacements sombres et texte crème, du HUD au chat, aux inventaires, boutons et infobulles."
          - "Le monde légèrement flouté derrière les fenêtres ouvertes, qui se mettent doucement en place en s'ouvrant et s'effacent en se fermant."
          - "Le chat encadré de bois au-dessus des cœurs, avec son champ de saisie."
          - "Les effets encadrés en haut à droite, chacun avec son temps restant dans un coin de l'icône."
          - "<strong>Barres de boss</strong> : larges et cerclées de fer sombre entre deux crânes, elles se remplissent à l'arrivée du boss, laissent la vie tout juste perdue en une traînée pâle qui se vide, et additionnent les dégâts infligés à côté du nom du boss."
          - "Un livre de recettes qui ressemble à un livre, relié de cuir, aux pages crème et à onglets."
          - "Un livre animé sur la table d'enchantement, qui montre tous les enchantements d'une option au lieu de « …? »."
          - "<strong>Écran d'accueil</strong> : les boutons en colonne à gauche, un petit logo centré au-dessus et de petits textes atténués en bas, sur le panorama qui s'assombrit de ce côté."
          - "<strong>Choix du monde</strong> : vos mondes à gauche, chacun avec son icône, la date de votre dernière partie et son mode de jeu ; celui choisi à droite, avec une grande icône, son mode de jeu et sa difficulté, la date de votre dernière partie, votre temps de jeu et sa version. Le dernier monde joué est choisi dès l'ouverture."
          - "<strong>Choix du serveur</strong> : dans le même style, vos serveurs à gauche et celui sélectionné à droite, avec s'il répond, le nombre de joueurs, sa latence et sa version."
          - "<strong>Menus et dialogues</strong> : les autres menus partagent ce fond uni, les confirmations et les formulaires de serveur tiennent dans un panneau encadré, et l'écran de mort montre un crâne au-dessus d'un panneau qui réunit tout, sur le voile rouge."
          - "Les libellés cliquables des livres des quêtes et des succès sont assortis à leurs pages."
          - "<strong>Feu et boucliers</strong> : quand vous brûlez, les flammes restent en bas de l'écran, et un bouclier levé se tient plus bas : le milieu reste dégagé."
          - "<strong>L'icône « ! »</strong> : survolez-la, près du titre d'une fenêtre, pour ce que le vanilla cache. Un four indique son temps de cuisson, combien d'objets de plus le combustible cuira et l'expérience qu'il contient ; une meule, l'expérience rendue, sous forme de fourchette ; l'écran d'un marchand ambulant, le temps qu'il lui reste."
          - "<strong>Chargement du monde</strong> : pendant le chargement d'un monde, en solo ou en rejoignant un serveur, la carte se dessine. Ce que tu as exploré apparaît en sépia et prend ses couleurs chunk par chunk ; les terres inconnues s'encrent sur le papier vierge. Une barre de progression et une astuce sur le mod complètent l'écran."
        faq:
          - q: "L'écran de chargement ralentit-il le chargement ?"
            a: "Non. Il montre seulement le chargement du jeu et ne le rallonge jamais. Sur un monde déjà généré, il peut ne durer qu'un instant."
          - q: "Cassonade change-t-il les textures du jeu ?"
            a: "Non. Blocs, objets et créatures restent exactement comme en vanilla : seuls les fenêtres, boutons, infobulles, le chat et les panneaux du mod changent."
          - q: "Pourquoi la table d'enchantement montre-t-elle tous les enchantements ?"
            a: "Le vanilla en montre un, puis « …? ». Cassonade montre tous les enchantements que l'option donnera, calculés comme sur le serveur : vous savez ce que vous payez."

living_world:
  heading: "Un monde qui vit"
  intro: "De la première lueur à l'aurore : rien à combattre, à ramasser ou à fabriquer, seulement ce qui donne à un lieu l'air d'être habité. Tout est toujours là, et rien ne change le jeu."
  cards:
    - id: ambience-mist
      time: "06:00"
      alt: "Une forêt de bouleaux à l'aube, les arbres lointains s'effaçant dans une brume légère"
      title: "Brume du matin"
      text: "Certains matins commencent dans une brume légère qui se dissipe avec le soleil, les arbres lointains s'y fondant."
      sounds:
        - "Rouge-gorge chante"
        - "Coucou chante"
        - "Poisson saute"
    - id: ambience
      time: "08:00"
      alt: "Un vol d'oies en V traversant un ciel bleu dégagé, vu depuis le sol"
      title: "Des vols dans le ciel"
      text: "Oies en V, corbeaux noirs, mouettes blanches près des côtes, criant à leur passage. Très rarement, un grand nuage d'étourneaux."
      sounds:
        - "Oies cacardent"
        - "Goéland crie"
        - "Vagues déferlent"
    - id: ambience-butterfly
      time: "12:00"
      alt: "Une plaine fleurie en plein jour, du pollen dans l'air et un papillon parmi les fleurs"
      title: "Papillons et pollen"
      text: "Les papillons volettent autour des fleurs, le pollen flotte sur l'herbe, la poussière tombe du plafond des grottes."
      sounds:
        - "Sauterelles stridulent"
        - "Rouge-gorge chante"
    - id: ambience-night
      time: "21:00"
      alt: "La voie lactée, bande discrète haut dans le ciel de nuit, au-dessus d'une plaine dégagée aux herbes fleuries"
      title: "Une nuit étoilée"
