        - topic: "Un monstre dans les hautes herbes"
          vanilla: "Le coup coupe l'herbe"
          mod: "Le coup traverse jusqu'au monstre"
        - topic: "Coup d'épée balayé"
          vanilla: "Touche aussi votre loup ou votre cheval"
