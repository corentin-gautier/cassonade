faq:
  heading: "Questions"
  items:
    - q: "Qu'est-ce que Cassonade ?"
      a: "Un mod Fabric gratuit et open source pour Minecraft 26.3 qui réunit les fonctions de confort (QoL) dans un seul mod « vanilla+ » : sac à dos, mini-map au compas, carte du monde avec marqueurs, tri de l'inventaire, récolte au clic droit, journal de quêtes et des dizaines de petites corrections. Il remplace une pile de petits mods de confort par un seul mod cohérent, qui garde l'esprit de Minecraft vanilla."
    - q: "Cassonade change-t-il la progression de Minecraft ?"
      a: "Non. Pas de nouvelles ressources, de nouveaux paliers ni de nouvelles dimensions, et chaque fonction se débloque en équipant un objet vanilla ou fabriqué à partir d'objets vanilla. On mine, construit, explore et combat toujours de la même façon."
    - q: "Fonctionne-t-il en multijoueur ?"
      a: "Oui. Installez-le sur le serveur et chez chaque joueur. Sur un serveur sans le mod, le jeu reste jouable et tout ce qui se passe sur votre écran marche encore : le monde vivant, les lumières, l'interface, les infobulles et facilités de l'inventaire. Mais les emplacements d'équipement ne sont pas proposés, donc rien de ce qui se porte ne marche (sac à dos, minimap, carte du monde, montre, emplacement d'élytres, vigilance au combat), et les objets, recettes, structures et règles du mod sont absents."
    - q: "Quelles versions sont prises en charge ?"
      a: "Minecraft 26.3 avec Fabric Loader 0.20.1 ou plus récent, Fabric API et Java 25. Forge et NeoForge ne sont pas pris en charge."
    - q: "Peut-on désactiver des fonctions ?"
      a: "Il n'y a pas d'écran de réglages, et c'est voulu : chaque fonction marche d'une seule façon, proche du vanilla, il n'y a donc rien à régler. Une fonction dont l'objet n'est pas équipé reste cachée : sans compas, pas de mini-map. Les touches se changent dans Options → Contrôles → Assignation des touches → Cassonade, et les choix d'affichage (rotation de la carte, marqueurs, suivi de quête) sont retenus."
    - q: "Peut-on l'utiliser dans un modpack ?"
      a: "Oui. Cassonade est publié sous licence GPL-3.0 : vous pouvez l'inclure dans un modpack, et le modifier ou reprendre son code tant que votre version reste sous GPL-3.0, cite son auteur et publie ses sources."

