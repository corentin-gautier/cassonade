  eyebrow: "Cassonade · mod Fabric pour Minecraft 26.3"
  shot_alt: "Des aurores vertes et violettes au-dessus d'une plaine enneigée la nuit, avec la voie lactée et un croissant de lune"
  title: "Sans friction, plus vivant."
  lead: "Un mod de confort « vanilla+ » : les cent petits agacements de la survie corrigés, et un monde qui s'anime d'oiseaux, de vagues et de nuits étoilées. Pas de nouveaux minerais, pas de magie, pas de machines."
