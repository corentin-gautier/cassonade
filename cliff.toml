# git-cliff writes CHANGELOG.md from the Conventional Commits (feat, fix, perf) since the last release.
# The release workflow (.github/workflows/release.yml) runs it; to preview the next entry locally:
#   git cliff --unreleased

[changelog]
header = """
# Changelog

All notable changes to Cassonade. Each entry is written by [git-cliff](https://git-cliff.org) from the commit messages.
"""
body = """
{%- set repo = "https://github.com/corentin-gautier/cassonade" -%}
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{%- if commits | length == 0 %}
No player-facing changes.
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments only order the sections, striptags removes them
commit_parsers = [
	{ message = "^feat", group = "<!-- 0 -->Features" },
	{ message = "^fix", group = "<!-- 1 -->Bug Fixes" },
	{ message = "^perf", group = "<!-- 2 -->Performance" },
	{ message = ".*", skip = true },
]
