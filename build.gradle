plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	// Mod Menu, which opens the settings screen (client/settings/ModMenuSettings)
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Same player every launch, so test worlds keep the inventory
			programArgs "--username", "Corentin"
			// Where /dev edit saves the mod's structure templates (TemplateEditing)
			property "cassonade.resources", file('src/main/resources').absolutePath
		}
	}

	mods {
		"cassonade" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'cassonade-test'
		enableGameTests = false
		eula = true
	}
}

// The client tests also join Minecraft's own server, without the mod: the jar Loom downloaded.
tasks.named('runClientGameTest') {
	systemProperty 'cassonade.vanillaServerJar', "${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-server.jar"
	// With -PsiteScreenshots, they take the website's screenshots (SiteScreenshotsClientGameTest), alone
	// unless -Ptests names others
	if (project.hasProperty('siteScreenshots')) {
		systemProperty 'cassonade.siteScreenshots', file('promo/site/assets/screenshots').absolutePath
		// The shots' world, kept from one run to the next (SiteScreenshotsClientGameTest.siteWorld)
		systemProperty 'cassonade.siteWorld', file('.test-worlds/site-world').absolutePath
		// With -PsiteShots=hero,ambience-night, only those shots, not the whole run
		if (project.hasProperty('siteShots')) {
			systemProperty 'cassonade.siteShots', project.property('siteShots')
		}
	}
	// With -PsiteIcons, the website's recipe icons of the blocks among the ingredients (SiteIconsClientGameTest), alone
	if (project.hasProperty('siteIcons')) {
		systemProperty 'cassonade.siteIcons', file('promo/site/assets/items').absolutePath
	}
	// With -PexploredWorld, the world map on a world truly explored (ExploredWorldClientGameTest), kept from one run to the next
	if (project.hasProperty('exploredWorld') || project.hasProperty('profile')) {
		systemProperty 'cassonade.exploredWorld', file('.test-worlds/explored-world').absolutePath
	}
	// With -Pprofile, the frame rates and Flight Recorder files of ProfileClientGameTest
	if (project.hasProperty('profile')) {
		systemProperty 'cassonade.profile', layout.buildDirectory.dir('profile').get().asFile.absolutePath
	}
	// -Ptests=Gear,Quest runs only those (see TestSelection)
	def tests = project.findProperty('tests') ?: (project.hasProperty('siteScreenshots') ? 'SiteScreenshots' : project.hasProperty('siteIcons') ? 'SiteIcons' : project.hasProperty('profile') ? 'Profile' : project.hasProperty('exploredWorld') ? 'ExploredWorld' : null)
	if (tests) {
		systemProperty 'cassonade.tests', tests
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: the settings screen opens from Mod Menu's list of mods, in runClient too
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// The atlases are drawn in Photoshop files kept out of git, src/textures/gui.psd and world.psd: where one is newer
// than its PNG, write the PNG from it first (tools/atlas_psd.py, which needs psd-tools). Without them, the PNGs are used
def exportAtlasPsds = tasks.register("exportAtlasPsds", Exec) {
	def atlases = ["gui", "world"].collect { [file("src/textures/${it}.psd"), file("src/textures/${it}.png")] }
	onlyIf { atlases.any { psd, png -> psd.exists() && psd.lastModified() > png.lastModified() } }
	commandLine "python3", "tools/atlas_psd.py"
}

// Textures of a setting's overlay (see generatePackMeta), cut there rather than into assets/: loaded only while it is on
def SETTING_TEXTURES = [
	"minecraft/textures/environment/rain.png": "setting_rain_color",
	"minecraft/textures/entity/villager/profession/cleric.png": "setting_tavern_keeper",
	"minecraft/textures/entity/zombie_villager/profession/cleric.png": "setting_tavern_keeper",
]

// The textures are all edited in two images, src/textures/gui.png for the interface (see tools/gui_atlas.py) and
// src/textures/world.png for the rest (tools/world_atlas.py): cut them back into the game's files, placed as their .json says
def unpackTextureAtlases = tasks.register("unpackTextureAtlases") {
	dependsOn(exportAtlasPsds)
	def atlases = ["gui", "world"].collect { [file("src/textures/${it}.png"), file("src/textures/${it}.json")] }
	def output = layout.buildDirectory.dir("generated/atlasTextures")
	inputs.files(atlases.flatten())
	outputs.dir(output)
	doLast {
		def root = output.get().asFile
		root.deleteDir()
		atlases.each { atlasFile, layoutFile ->
			def atlas = javax.imageio.ImageIO.read(atlasFile)
			new groovy.json.JsonSlurper().parse(layoutFile).each { String path, Map texture ->
				def (ax, ay, w, h) = texture.atlas
				def (ox, oy) = texture.offset
				def (width, height) = texture.size
				def image = new java.awt.image.BufferedImage(width, height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
				if (w > 0) {
					image.setRGB(ox, oy, w, h, atlas.getRGB(ax, ay, w, h, null, 0, w), 0, w)
				}
				def overlay = SETTING_TEXTURES[path]
				def target = new File(root, (overlay ? overlay + "/assets/" : "assets/") + path)
				target.parentFile.mkdirs()
				javax.imageio.ImageIO.write(image, "png", target)
			}
		}
	}
}
sourceSets.main.resources.srcDir(unpackTextureAtlases)

// Each setting_<id> folder of src/main/resources or src/client/resources is an overlay of the mod's pack, loaded while that setting is on
// (settings/Settings.SettingCondition): pack.mcmeta lists them, so a new folder needs nothing else
def generatePackMeta = tasks.register("generatePackMeta") {
	def roots = [file("src/main/resources"), file("src/client/resources")]
	def textureOverlays = SETTING_TEXTURES.values() as List
	def overlayNames = { (roots.collectMany { root -> root.listFiles().findAll { it.directory && it.name.startsWith("setting_") }*.name } + textureOverlays).unique().sort() }
	def output = layout.buildDirectory.dir("generated/packMeta")
	inputs.property "overlays", provider { overlayNames() }
	outputs.dir(output)
	doLast {
		def overlays = overlayNames()
		def meta = [
			pack: [description: "Cassonade", min_format: 97, max_format: 999],
			"fabric:overlays": [entries: overlays.collect { [directory: it, condition: [condition: "cassonade:setting", setting: it.substring("setting_".length())]] }]
		]
		def target = new File(output.get().asFile, "pack.mcmeta")
		target.parentFile.mkdirs()
		target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(meta))
	}
}
sourceSets.main.resources.srcDir(generatePackMeta)

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
