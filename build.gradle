plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Same player every launch, so test worlds keep the inventory
			programArgs "--username", "Corentin"
		}
	}

	mods {
		"cassonade" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'cassonade-test'
		enableGameTests = false
		eula = true
	}
}

// The client tests also join Minecraft's own server, without the mod: the jar Loom downloaded.
tasks.named('runClientGameTest') {
	systemProperty 'cassonade.vanillaServerJar', "${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-server.jar"
	// With -PsiteScreenshots, they take the website's screenshots (SiteScreenshotsClientGameTest), alone
	// unless -Ptests names others
	if (project.hasProperty('siteScreenshots')) {
		systemProperty 'cassonade.siteScreenshots', file('site/assets/screenshots').absolutePath
		// The shots' world, kept from one run to the next (SiteScreenshotsClientGameTest.siteWorld)
		systemProperty 'cassonade.siteWorld', layout.buildDirectory.dir('site-world').get().asFile.absolutePath
		// With -PsiteShots=ambience,ambience-night, only those of the ambience's shots, not the whole run
		if (project.hasProperty('siteShots')) {
			systemProperty 'cassonade.siteShots', project.property('siteShots')
		}
	}
	// With -PexploredWorld, the world map on a world truly explored (ExploredWorldClientGameTest), kept from one run to the next
	if (project.hasProperty('exploredWorld') || project.hasProperty('profile')) {
		systemProperty 'cassonade.exploredWorld', layout.buildDirectory.dir('explored-world').get().asFile.absolutePath
	}
	// With -Pprofile, the frame rates and Flight Recorder files of ProfileClientGameTest
	if (project.hasProperty('profile')) {
		systemProperty 'cassonade.profile', layout.buildDirectory.dir('profile').get().asFile.absolutePath
	}
	// -Ptests=Gear,Quest runs only those (see TestSelection)
	def tests = project.findProperty('tests') ?: (project.hasProperty('siteScreenshots') ? 'SiteScreenshots' : project.hasProperty('profile') ? 'Profile' : project.hasProperty('exploredWorld') ? 'ExploredWorld' : null)
	if (tests) {
		systemProperty 'cassonade.tests', tests
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// The textures are all edited in two images, textures/gui.png for the interface (see tools/gui_atlas.py) and
// textures/world.png for the rest (tools/world_atlas.py): cut them back into the game's files, placed as their .json says
def unpackTextureAtlases = tasks.register("unpackTextureAtlases") {
	def atlases = ["gui", "world"].collect { [file("textures/${it}.png"), file("textures/${it}.json")] }
	def output = layout.buildDirectory.dir("generated/atlasTextures")
	inputs.files(atlases.flatten())
	outputs.dir(output)
	doLast {
		def root = output.get().asFile
		root.deleteDir()
		atlases.each { atlasFile, layoutFile ->
			def atlas = javax.imageio.ImageIO.read(atlasFile)
			new groovy.json.JsonSlurper().parse(layoutFile).each { String path, Map texture ->
				def (ax, ay, w, h) = texture.atlas
				def (ox, oy) = texture.offset
				def (width, height) = texture.size
				def image = new java.awt.image.BufferedImage(width, height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
				if (w > 0) {
					image.setRGB(ox, oy, w, h, atlas.getRGB(ax, ay, w, h, null, 0, w), 0, w)
				}
				def target = new File(root, "assets/" + path)
				target.parentFile.mkdirs()
				javax.imageio.ImageIO.write(image, "png", target)
			}
		}
	}
}
sourceSets.main.resources.srcDir(unpackTextureAtlases)

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
