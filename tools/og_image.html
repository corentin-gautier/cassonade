<!doctype html>
<!--
The image shown when the website or the repository is shared (site/assets/og.jpg, also GitHub's social
preview): the mod's icon and name over the website's hero screenshot. Rendered at 1280×640 by Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
        --window-size=1280,640 --screenshot=og.png tools/og_image.html
    sips -s format jpeg -s formatOptions 90 og.png --out site/assets/og.jpg
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<style>
		@font-face { font-family: "Pixelify Sans"; src: url("../site/assets/fonts/pixelify-sans.woff2") format("woff2"); font-weight: 400 700; }
		@font-face { font-family: "Nunito Sans"; src: url("../site/assets/fonts/nunito-sans.woff2") format("woff2"); font-weight: 200 1000; }
		html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
		body {
			position: relative;
			background: #2f1c1b url("../site/assets/screenshots/hero.avif") right center / auto 100% no-repeat;
			font-family: "Nunito Sans", sans-serif;
			color: #f6e9cb;
		}
		/* The screenshot fades into the page's dark wood on the left, under the text */
		body::before {
			content: "";
			position: absolute;
			inset: 0;
			background: linear-gradient(90deg, #211414 0%, rgba(33, 20, 20, .97) 42%, rgba(33, 20, 20, .55) 62%, rgba(33, 20, 20, 0) 80%);
		}
		body::after {
			content: "";
			position: absolute;
			inset: 0;
			border: 6px solid #1a0b0c;
			box-shadow: inset 0 0 0 3px #4d2e28;
		}
		main { position: absolute; left: 78px; top: 150px; width: 600px; z-index: 1; }
		.eyebrow { font: 700 22px/1 "Pixelify Sans"; color: #dea62b; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 26px; }
		h1 { display: flex; align-items: center; gap: 28px; margin: 0 0 30px; font: 700 76px/1 "Pixelify Sans"; letter-spacing: .01em; }
		h1 img { width: 92px; height: 92px; image-rendering: pixelated; }
		.tagline { font-size: 32px; font-weight: 800; color: #ffd76a; margin: 0 0 18px; }
		.text { font-size: 23px; line-height: 1.45; color: #ceb49d; margin: 0; }
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Fabric mod · Minecraft 26.3</p>
		<h1><img src="../site/assets/icon.png" alt="">Cassonade</h1>
		<p class="tagline">Minecraft, minus the friction.</p>
		<p class="text">Backpack, minimap, world map, quest journal, inventory sorting and dozens of small fixes. No new ores, no magic, no machines.</p>
	</main>
</body>
</html>
